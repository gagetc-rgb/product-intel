<style>
/* Layout: a field report — sticky masthead, a chart-first overview (market map → top 5 → all 20), one long page per category with charts set into the text. */
:root{

  --c1:#2350B8; --c2:#C0562E; --c3:#1D7F49; --c4:#8A5BB8; --c5:#B87A0B;
  --k-new:#1D7F49; --k-gen:#D79B2B; --k-est:#6F8FD0; --k-old:#7E8781; --k-genold:#C7CBC5;
  --a1:#C9D6F2; --a2:#8EA8E2; --a3:#4F73C9; --a4:#1F3F8F;

  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111513; --card:#181D1B; --ink:#E6EBE7; --muted:#A1ABA5; --faint:#748079; --line:#2B332F; --wash:#1F2522;
  --accent:#86A8F2; --accent-wash:#1E2843;
  --good:#5CC48A; --good-wash:#16301F; --warn:#E3B04B; --warn-wash:#33280F; --bad:#EE7F68; --bad-wash:#3A1D17; --violet:#B497E8; --violet-wash:#2A2140;
  --c1:#86A8F2; --c2:#EE8F66; --c3:#5CC48A; --c4:#B497E8; --c5:#E3B04B;
  --k-new:#4DB67D; --k-gen:#D9A443; --k-est:#7F9EE0; --k-old:#7C8781; --k-genold:#46504B;
  --a1:#25345C; --a2:#3A5596; --a3:#6286D8; --a4:#A9C0F4; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111513; --card:#181D1B; --ink:#E6EBE7; --muted:#A1ABA5; --faint:#748079; --line:#2B332F; --wash:#1F2522;
  --accent:#86A8F2; --accent-wash:#1E2843;
  --good:#5CC48A; --good-wash:#16301F; --warn:#E3B04B; --warn-wash:#33280F; --bad:#EE7F68; --bad-wash:#3A1D17; --violet:#B497E8; --violet-wash:#2A2140;
  --c1:#86A8F2; --c2:#EE8F66; --c3:#5CC48A; --c4:#B497E8; --c5:#E3B04B;
  --k-new:#4DB67D; --k-gen:#D9A443; --k-est:#7F9EE0; --k-old:#7C8781; --k-genold:#46504B;
  --a1:#25345C; --a2:#3A5596; --a3:#6286D8; --a4:#A9C0F4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)} a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--f-head);text-wrap:balance;line-height:1.15;margin:0}
code{font:400 .82em var(--f-mono);background:var(--wash);padding:1px 5px;border-radius:4px;word-break:break-word}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1.2 var(--f-head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.logo{font:800 17px/1 var(--f-head);color:var(--ink);text-decoration:none;display:flex;align-items:baseline;gap:8px}

.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{font:600 14px var(--f-head);color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px}
.nav a[aria-current="page"]{color:var(--ink);background:var(--wash)}
.nav a:hover{color:var(--ink)}
main{padding-block:28px 64px}
/* tiers */
.tier{font-size:.8em;margin-left:2px;cursor:help}
.tier.t1{color:var(--ink)} .tier.t2{color:var(--muted)} .tier.t3{color:var(--warn)}
/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:22px}
.hero h1{font-size:clamp(30px,4.6vw,52px);font-weight:800;letter-spacing:-.02em;max-width:18ch}
.hero .lede{max-width:68ch;color:var(--muted);font-size:18px}
.hero .lede p{margin:.4em 0} .hero .lede ol{margin:.3em 0;padding-left:1.3em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel-h{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.panel-h h2{font-size:21px;font-weight:700}
.cap{font:400 14px/1.45 var(--f-head);color:var(--muted);max-width:80ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 13px var(--f-head);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font:500 13px/1.4 var(--f-head);padding:8px 10px;border-radius:6px;max-width:260px;z-index:5;transform:translate(-50%,calc(-100% - 12px))}
.tip b{font-weight:700}
.tip[hidden]{display:none!important}

svg .lbl{fill:var(--ink);font-weight:600}

.dot:hover{stroke:var(--ink);stroke-width:2}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}

.card .ph{aspect-ratio:4/3;background:var(--wash);position:relative;overflow:hidden}

.mini{display:flex;flex-direction:column;gap:1px}

.spark{display:block;width:100%;height:34px}
/* table */

.chip{font:600 13px var(--f-head);border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:20px;padding:5px 12px;cursor:pointer}

.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}

th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-head);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.grid20 th{cursor:pointer;user-select:none}
.grid20 th[aria-sort]::after{content:" ↓";color:var(--ink)}
.grid20 th[aria-sort="ascending"]::after{content:" ↑"}
.grid20 td{vertical-align:middle;white-space:nowrap}
.grid20 tbody tr{cursor:pointer}
.grid20 tbody tr:hover td{background:var(--wash)}
.grid20 td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.grid20 th.n{text-align:right}
.cell{display:inline-block;min-width:54px;text-align:right;padding:2px 7px;border-radius:5px}
.hbar{display:inline-block;height:8px;border-radius:2px;background:var(--k-new);vertical-align:middle;margin-left:8px}
.pill{display:inline-block;font:700 11px/1 var(--f-head);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:20px;white-space:nowrap}
.s-top5{background:var(--good-wash);color:var(--good)} .s-challenger_compliance{background:var(--violet-wash);color:var(--violet)}
.s-reserve{background:var(--warn-wash);color:var(--warn)} .s-weak{background:var(--wash);color:var(--muted)} .s-dropped{background:var(--bad-wash);color:var(--bad)}
/* category page */
.crumb{font:600 14px var(--f-head);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none} .crumb a:hover{color:var(--ink)}
.sub{color:var(--faint);font-size:.85em}.warn{color:var(--warn);cursor:help}.lens{margin-top:14px}
.cathead{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start;margin:16px 0 22px}
.cathead h1{font-size:clamp(32px,4.4vw,50px);font-weight:800;letter-spacing:-.02em;margin:10px 0 12px}

.cathead .photo{border-radius:10px;overflow:hidden;background:var(--wash);aspect-ratio:1/1;max-height:360px;width:100%}
.cathead .photo img{width:100%;height:100%;object-fit:cover;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.kpi{background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.kpi b{font:500 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font:500 12.5px/1.3 var(--f-head);color:var(--muted)}
.kpi em{font:600 12px var(--f-head);font-style:normal}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.lead{font-size:19px;max-width:68ch}
.body{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.sec{padding:26px 0;border-top:1px solid var(--line)}
.sec>h2{font-size:24px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
.prose{max-width:70ch}
.prose p{margin:.55em 0} .prose ul,.prose ol{padding-left:1.25em;margin:.5em 0} .prose li{margin:.25em 0}
.prose blockquote{margin:.8em 0;padding:8px 14px;border-left:3px solid var(--line);color:var(--muted);font-style:italic}
.prose .tbl{margin:12px 0;max-width:100%}
.prose table{font-size:14px}
.fig{margin:16px 0 6px;display:flex;flex-direction:column;gap:10px}
.fig .panel{padding:16px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:500 13px var(--f-head);color:var(--muted)}
.ctl label{display:flex;align-items:center;gap:6px;cursor:pointer}
.readout{font:500 13px/1.4 var(--f-head);color:var(--muted);min-height:1.4em}

.stack-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;font:500 13px var(--f-head);color:var(--muted)}
.keys div{display:flex;justify-content:space-between;gap:10px} .keys b{font:500 13px var(--f-mono);color:var(--ink)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* leaders */
.lrow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr);gap:4px 14px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.lrow:last-child{border-bottom:0}
.lname{font:600 14.5px/1.3 var(--f-head)}

.lbar{display:flex;align-items:center;gap:8px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.lbar span.b{height:12px;border-radius:2px;flex:none}
.lmeta{grid-column:2;font:500 12px var(--f-head);color:var(--muted)}
.tag{font:700 10px/1 var(--f-head);letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.new{background:var(--good-wash);color:var(--good)} .tag.old{background:var(--wash);color:var(--muted)}
/* funnel */
.fun{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:8px 12px;align-items:center;font:500 13.5px var(--f-head)}
.fun .bar{height:22px;border-radius:3px;background:var(--accent);display:flex;align-items:center;padding-left:8px;color:#fff;font:500 12px var(--f-mono);white-space:nowrap;min-width:2px}
.fun .val{font:500 13px var(--f-mono);color:var(--ink);margin-left:8px;white-space:nowrap}
.shops{display:flex;flex-wrap:wrap;gap:6px}
.shop{font:500 12.5px var(--f-mono);background:var(--wash);border-radius:5px;padding:4px 8px}
.shop b{font-weight:500;color:var(--accent)}
/* creatives */
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ad .im{position:relative;aspect-ratio:1/1;background:var(--wash)}
.ad img{width:100%;height:100%;object-fit:cover;display:block}

.ad .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;font:400 13.5px/1.4 var(--f-head)}
.ad .bd b{font-weight:700}
.ad .bd span{color:var(--muted)}
.ad .bd a{font-size:12.5px;margin-top:auto}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.pager a{flex:1 1 220px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink);font:700 17px var(--f-head)}
.pager a small{display:block;font:600 12px var(--f-head);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.pager a:hover{border-color:var(--accent)}
.pager a.next{text-align:right}
.foot{border-top:1px solid var(--line);margin-top:48px;padding-top:16px;font:500 13px var(--f-head);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.tiers{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 13.5px var(--f-head);color:var(--muted)}
.empty{font:500 14px var(--f-head);color:var(--muted);padding:10px 0}
@media (max-width:820px){
  .cathead{grid-template-columns:minmax(0,1fr)}
  .cathead .photo{max-height:240px;aspect-ratio:16/10}
  .lrow{grid-template-columns:minmax(0,1fr)} .lmeta{grid-column:1}
  body{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<script>
const DATA=/*__DATA__*/null;
const C=DATA.cats, BY={}; C.forEach(c=>BY[c.slug]=c);
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??"").replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const fmt=n=>n==null?"—":Math.round(n).toLocaleString("en-US");
const kfmt=n=>n==null?"—":n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e4?Math.round(n/1e3)+"K":n>=1e3?(n/1e3).toFixed(1)+"K":String(Math.round(n));
const xf=n=>n==null?"—":"×"+(+n).toFixed(2);
const pct=(a,b)=>b?Math.round(100*a/b)+"%":"—";
const T1='<span class="tier t1" title="counted by a platform">◆</span>', T2='<span class="tier t2" title="estimate or our reading">◈</span>', T3='<span class="tier t3" title="disputed">◇</span>';
const STATUS={top5:"Top 5",challenger_compliance:"Challenger · regulated",reserve:"Reserve",weak:"Weak",dropped:"Dropped"};
const SCOL={top5:"var(--good)",challenger_compliance:"var(--violet)",reserve:"var(--warn)",weak:"var(--faint)",dropped:"var(--bad)"};
const pill=s=>`<span class="pill s-${s}">${STATUS[s]||s}</span>`;
const KIND=[["new_brand","New brands (under 24 months)","--k-new"],["generic_new","Unbranded sellers, new","--k-gen"],["older_brand_new_here","Established brands new to this product","--k-est"],["old_brand","Old brands","--k-old"],["generic_old","Unbranded sellers, old","--k-genold"]];
const AGE=[["0-6","0-6 months","--a4"],["6-12","6-12 months","--a3"],["12-24","12-24 months","--a2"],["24+","24+ months","--a1"]];
const SER=["--c1","--c2","--c3","--c4","--c5"];
const W0=new Date(DATA.week0+"T00:00:00Z");
const wdate=i=>new Date(W0.getTime()+i*7*864e5);
const MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const dfmt=d=>`${MON[d.getUTCMonth()]} ${d.getUTCDate()}, ${d.getUTCFullYear()}`;
const ymfmt=ym=>{const [y,m]=ym.split("-");return MON[+m-1]+" "+y};
const ma=(v,k=4)=>v.map((_,i)=>{const s=v.slice(Math.max(0,i-k+1),i+1);return s.reduce((a,b)=>a+b,0)/s.length});
const share=c=>c.shelf?c.nb/c.shelf:0;
const revG=c=>{const s=c.reviews&&c.reviews.series.find(s=>s.growth!=null);return s?s.growth:null};
const a90=c=>c.meta&&c.meta.active?c.meta.aged90/c.meta.active:null;

function nice(max){if(max<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(max)));for(const m of[1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=max)return m*p;return 10*p}
function tipAt(box,x,y,html){let t=$(".tip",box);if(!t){t=document.createElement("div");t.className="tip";box.appendChild(t)}t.innerHTML=html;t.hidden=false;
  const w=box.clientWidth;t.style.left=Math.max(130,Math.min(w-130,x))+"px";t.style.top=y+"px"}
function tipOff(box){const t=$(".tip",box);if(t)t.hidden=true}

/* ---------- market map ---------- */
function marketMap(){
  const W=760,H=430,L=62,R=18,Tp=16,B=50;
  const lx=v=>Math.log(v), X0=lx(.5),X1=lx(6.5);
  const sx=v=>L+(lx(Math.max(.5,Math.min(6.5,v)))-X0)/(X1-X0)*(W-L-R);
  const NEW=lens==="new", Y0=Math.log(1e4), Y1=Math.log(5e5);

  <div class="fun">${rows.map(([l,v])=>`<span>${l}</span><div style="display:flex;align-items:center"><div class="bar" style="width:${Math.max(.4,v/m.active*80)}%"></div><span class="val">${fmt(v)} <span style="color:var(--muted)">${pct(v,m.active)}</span></span></div>`).join("")}</div>
  ${shops.length?`<div class="cap" style="margin-top:14px"><b>Shops with the oldest live ads</b> (days running)</div><div class="shops">${shops.map(s=>`<span class="shop">${esc(s[0])} <b>${s[2]}</b></span>`).join("")}</div>`:""}
  ${bp}<p class="cap">Counts are Meta's own ${T1}. Advertisers switch off ads that lose money, so an ad still running after months is a sign it pays back ${T2}. Shares are of ads active today, not of all ads ever launched.</p></div>`}
function reviewsFig(c){const r=c.reviews;if(!r)return"";
  return `<div class="panel" data-chart="reviews"><div class="panel-h"><h3 class="eyebrow">Reviews per month in the leaders' own stores</h3>
   <div class="ctl"><label><input type="radio" name="rv-${c.slug}" value="abs" checked> Reviews</label><label><input type="radio" name="rv-${c.slug}" value="rel"> Each store vs its own peak</label></div></div>
   <div class="legend rvleg">${r.series.map((s,k)=>`<label style="cursor:pointer"><input type="checkbox" data-k="${k}" checked style="accent-color:var(${SER[k]})"> <i style="background:var(${SER[k]})"></i>${esc(s.name)}${s.growth!=null?` <b style="color:var(--ink);font-family:var(--f-mono);font-weight:500">${xf(s.growth)}</b>`:""}</label>`).join("")}</div>
   <div class="readout">Hover the chart to read a month.</div><div class="chartbox"></div>
   <p class="cap">×N = Aug-Oct 2026 vs Aug-Oct 2025. Solid: exact counts ${T1}. Dashed and hollow dots: estimated months ${T2} (older Judge.me months scaled from 1-4 star reviews; Loox stores counted from photo reviews in a 20% sample). Compare shapes, not levels: stores turn 3-10% of orders into reviews.</p></div>`}
function drawReviews(el,c){const box=$(".chartbox",el),ro=$(".readout",el),S=c.reviews.series,M=DATA.months,n=M.length;
  const on=$$(".rvleg input",el).map(i=>i.checked),rel=$(`input[name="rv-${c.slug}"]:checked`,el).value==="rel";
  const W=760,H=260,L=44,R=10,Tp=12,B=26;
  const val=(s,i)=>{const v=s.pts[i][1];if(v==null)return null;if(!rel)return v;const mx=Math.max(...s.pts.map(p=>p[1]||0));return mx?v/mx*100:null};
  let mx=1;S.forEach((s,k)=>{if(on[k])for(let i=0;i<n;i++){const v=val(s,i);if(v!=null&&v>mx)mx=v}});mx=rel?100:nice(mx);
  const sx=i=>L+i/(n-1)*(W-L-R),sy=y=>H-B-y/mx*(H-Tp-B);
  let g="";for(let t=0;t<=4;t++){const y=mx*t/4;g+=`<line x1="${L}" x2="${W-R}" y1="${sy(y)}" y2="${sy(y)}" stroke="var(--line)"/><text x="${L-6}" y="${sy(y)+4}" text-anchor="end">${rel?Math.round(y)+"%":kfmt(y)}</text>`}
  M.forEach((m,i)=>{if(m.endsWith("-01")||i===0)g+=`<text x="${sx(i)}" y="${H-6}" text-anchor="${i===0?"start":"middle"}">${i===0?ymfmt(m):m.slice(0,4)}</text><line x1="${sx(i)}" x2="${sx(i)}" y1="${H-B}" y2="${H-B+4}" stroke="var(--faint)"/>`});
  const iA=M.indexOf("2025-08"),iB=M.indexOf("2026-08");
  [[iA,"Aug-Oct 2025"],[iB,"Aug-Oct 2026"]].forEach(([i,l])=>{if(i>=0)g+=`<rect x="${sx(i)}" y="${Tp}" width="${sx(i+2)-sx(i)}" height="${H-B-Tp}" fill="var(--accent-wash)"/><text x="${sx(i)+3}" y="${Tp+11}" style="font-size:10.5px;fill:var(--accent)">${l}</text>`});
  S.forEach((s,k)=>{if(!on[k])return;const col=`var(${SER[k]})`;
    for(let i=1;i<n;i++){const a=val(s,i-1),b=val(s,i);if(a==null||b==null)continue;const est=s.pts[i-1][2]||s.pts[i][2];
      g+=`<line x1="${sx(i-1)}" y1="${sy(a)}" x2="${sx(i)}" y2="${sy(b)}" stroke="${col}" stroke-width="2" ${est?'stroke-dasharray="4 3"':""} stroke-linecap="round"/>`}
    for(let i=0;i<n;i++){const v=val(s,i);if(v==null)continue;g+=`<circle cx="${sx(i)}" cy="${sy(v)}" r="2.6" fill="${s.pts[i][2]?"var(--card)":col}" stroke="${col}" stroke-width="1.4"/>`}});
  g+=`<line class="hx" x1="0" x2="0" y1="${Tp}" y2="${H-B}" stroke="var(--ink)" visibility="hidden"/><rect class="hit" x="${L}" y="${Tp}" width="${W-L-R}" height="${H-B-Tp}" fill="transparent"/>`;
  box.innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly reviews per store">${g}</svg>`;
  const svg=$("svg",box),hx=$(".hx",svg);
  $(".hit",svg).addEventListener("pointermove",e=>{const r=svg.getBoundingClientRect(),px=(e.clientX-r.left)/r.width*W;const i=Math.max(0,Math.min(n-1,Math.round((px-L)/(W-L-R)*(n-1))));
    hx.setAttribute("x1",sx(i));hx.setAttribute("x2",sx(i));hx.setAttribute("visibility","visible");
    ro.innerHTML=`<b>${ymfmt(M[i])}</b>: `+S.map((s,k)=>on[k]?`${esc(s.name.split(" · ")[0])} <b>${s.pts[i][1]==null?"—":fmt(s.pts[i][1])}</b>${s.pts[i][2]&&s.pts[i][1]!=null?" (est.)":""}`:"").filter(Boolean).join(" · ")});
  $(".hit",svg).addEventListener("pointerleave",()=>hx.setAttribute("visibility","hidden"));
  $$("input",el).forEach(i=>i.onchange=()=>drawReviews(el,c));
}
function adsGallery(c){const A=c.creatives||[];if(!A.length)return"";
  return `<div data-chart="creatives"><div class="ads">${A.map(a=>`<figure class="ad" style="margin:0"><div class="im"><img src="${a.img}" alt="Ad image from ${esc(a.domain)}" loading="lazy"><span class="days">${a.days} days${a.video?" · video":""}</span></div>
    <figcaption class="bd"><b>${esc(a.head||a.page)}</b><span>${esc(a.body)}${a.body&&a.body.length>=180?"…":""}</span><span>${esc(a.page)} → ${esc(a.domain)}</span><a href="${a.lib}" target="_blank" rel="noopener">Open in Ad Library</a></figcaption></figure>`).join("")}</div>
    <p class="cap">The longest-running ads of the leading shops that land on the shop's own site, one per distinct creative ${T1} (running time from the Ad Library start date). Images are first frames for videos.</p></div>`}

/* ---------- category page ---------- */
const PLACE={trend:["trend"],shelf:["shelf","leaders"],ads:["ads"],reviews:["reviews"],creatives:["creatives"]};
const FIG={trend:trendFig,shelf:shelfFig,leaders:leadersFig,ads:adsFig,reviews:reviewsFig,creatives:adsGallery};
const FIGT={trend:"Search demand",shelf:"Who sells it",leaders:"Leaders",ads:"Ads",reviews:"Are the winners growing",creatives:"Ads that last"};
function category(c){
  const placed=new Set();
  let secs=c.sections.map((s,i)=>{let figs="";(PLACE[s.kind]||[]).forEach(k=>{const h=FIG[k](c);if(h){placed.add(k);figs+=h}});
    if(s.kind==="reviews"&&!c.reviews)figs="";
    return {id:"s"+i,h:s.h,kind:s.kind,html:`<div class="prose">${s.html}</div>${figs?`<div class="fig">${figs}</div>`:""}`}});
  const rest=Object.keys(FIG).filter(k=>!placed.has(k)&&FIG[k](c));
  if(rest.length){const at=secs.findIndex(s=>s.kind==="sources");const blocks=rest.map(k=>({id:"x"+k,h:FIGT[k],kind:k,html:`<div class="fig">${FIG[k](c)}</div>`+(k==="reviews"&&c.reviewsNote?"":"")}));
    secs.splice(at<0?secs.length:at,0,...blocks)}
  const i=C.indexOf(c),prev=C[i-1],next=C[i+1],rg=revG(c),a=a90(c);
  $("#app").innerHTML=`
  <div class="crumb"><a href="#">Overview</a><span aria-hidden="true">/</span><a href="#all">All 20</a><span aria-hidden="true">/</span><span>${esc(c.short)}</span></div>
  <section class="cathead"><div><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">${pill(c.status)}<span class="eyebrow">#${c.rank} of 20</span>${c.compliance?`<span class="pill s-dropped">${esc(c.compliance)}</span>`:""}</div>
    <h1>${esc(c.title)}</h1><p class="verdict">${esc(c.verdict)}</p></div>
    ${c.photo?`<div class="photo"><img src="${c.photo}" alt="${esc(c.title)}, product photo from a leading store"></div>`:"<div></div>"}</section>
  <div class="kpis">
    <div class="kpi"><span>Bought last month</span><b>${kfmt(c.shelf)}</b><span>Amazon, pages 1-5 ${T1}</span></div>
    <div class="kpi"><span>To new brands</span><b>${kfmt(c.nb)}</b><span>${Math.round(share(c)*100)}% of the shelf ${T2}</span></div>
    <div class="kpi"><span>Search vs last year</span><b>${xf(c.trend.mean)}</b><em style="color:${c.trend.label==="growing"?"var(--good)":c.trend.label==="falling"?"var(--bad)":"var(--muted)"}">${esc(c.trend.label||"")}</em></div>
    <div class="kpi"><span>Ads alive 90+ days</span><b>${a==null?"—":Math.round(a*100)+"%"}</b><span>${c.meta?fmt(c.meta.aged90)+" of "+fmt(c.meta.active)+" active":"not measured"}</span></div>
    <div class="kpi"><span>Median price</span><b>${c.price!=null?"$"+(+c.price).toFixed(2):"—"}</b><span>${c.p25p75?`half between $${c.p25p75[0]}-${c.p25p75[1]}`:""}</span></div>
    <div class="kpi"><span>Leader store reviews</span><b>${rg!=null?xf(rg):"—"}</b><span>${rg!=null?"Aug-Oct, year on year "+T2:"no readable store feed"}</span></div>
  </div>
  <nav class="toc" aria-label="Sections">${secs.filter(s=>s.kind!=="text"||1).map(s=>`<button class="chip" data-go="${s.id}">${esc(s.h)}</button>`).join("")}</nav>
  <div class="lead prose">${c.lead}</div>
  <div class="body">${secs.map(s=>`<section class="sec" id="${s.id}"><h2>${esc(s.h)}</h2>${s.html}</section>`).join("")}</div>
  <nav class="pager" aria-label="Other categories">${prev?`<a href="#c-${prev.slug}"><small>← #${prev.rank}</small>${esc(prev.short)}</a>`:"<span></span>"}${next?`<a class="next" href="#c-${next.slug}"><small>#${next.rank} →</small>${esc(next.short)}</a>`:"<span></span>"}</nav>
  ${foot()}`;
  $$("[data-go]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.go).scrollIntoView({behavior:"smooth"}));
  const tr=$('[data-chart="trend"]');if(tr)drawTrend(tr,c);
  const rv=$('[data-chart="reviews"]');if(rv)drawReviews(rv,c);
  window.scrollTo(0,0);
}
function methods(){const m=DATA.methods;
  $("#app").innerHTML=`<section class="hero"><span class="eyebrow">Method v2.1</span><h1>How we measured</h1><div class="lede">${m.lead}</div>
   <div class="tiers" style="margin-top:6px">${T1} counted by a platform · ${T2} an estimate or our reading · ${T3} disputed</div></section>
   <div class="body">${m.secs.map(s=>`<section class="sec"><h2>${esc(s.h)}</h2><div class="prose">${s.html}</div></section>`).join("")}</div>${foot()}`;window.scrollTo(0,0)}

function route(){const h=location.hash.slice(1);let nav="overview";
  if(h.startsWith("c-")&&BY[h.slice(2)]){category(BY[h.slice(2)]);nav=""}
  else if(h==="method"){methods();nav="method"}
  else if(h==="all"){overview(true);nav="all"}
  else overview(false);
  $$(".nav a").forEach(a=>a.dataset.nav===nav?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  const c=h.startsWith("c-")&&BY[h.slice(2)];document.title=c?c.short+" · Shelf Survey":"Shelf Survey US 2026";
}
addEventListener("hashchange",route);route();
</script>
