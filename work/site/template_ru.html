<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Полка США 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2EC;--card:#FFFFFF;--ink:#121212;--soft:#5E5B55;--faint:#9A968E;--line:#E3DFD6;--wash:#ECE9E1;
  --g:#1E9E5A;--g-w:#E2F4E9;--y:#D08A00;--y-w:#FBF0D6;--r:#D2443C;--r-w:#FBE4E1;--n:#A8A49B;--n-w:#EFEDE7;
  --acc:#2B2BFF;--dark:#111114;--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit}img{display:block;max-width:100%}
h1,h2,h3,.disp{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.nav.sc{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:64px}
.logo{font:700 17px Unbounded;text-decoration:none;display:flex;gap:9px;align-items:center}
.logo i{width:12px;height:12px;border-radius:4px;background:var(--acc);display:block}
.nav nav{margin-left:auto;display:flex;gap:4px}
.nav nav a{white-space:nowrap;text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:99px;color:var(--soft)}
.nav nav a[aria-current]{background:var(--ink);color:#fff}
.nav nav a .soon{font-size:11px;opacity:.6;margin-left:4px}
/* cover */
.cover{padding:72px 0 40px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.cover h1{font-size:clamp(40px,6.4vw,84px);font-weight:800;margin:18px 0 22px;max-width:14ch}
.cover .lede{font-size:21px;color:var(--soft);max-width:44ch;margin:0}
.switch{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px;gap:4px;margin:38px 0 10px}
.switch button{font:600 15px Manrope;border:0;background:transparent;padding:11px 20px;border-radius:99px;cursor:pointer;color:var(--soft);transition:.25s}
.switch button[aria-pressed=true]{background:var(--ink);color:#fff}
.switch-sub{font-size:15px;color:var(--soft);margin:0 0 22px;min-height:24px}
.tiles{display:grid;grid-template-columns:repeat(var(--n,5),1fr);gap:14px}
.tile{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--wash);aspect-ratio:3/4;text-decoration:none;color:#fff;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tile:hover{transform:translateY(-6px)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.78))}
.tile .no{position:absolute;top:12px;left:14px;z-index:2;font:800 30px Unbounded;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.tile .tx{position:absolute;left:14px;right:14px;bottom:14px;z-index:2}
.tile .tx b{display:block;font:700 16px/1.2 Unbounded;margin-bottom:6px}
.tile .tx span{display:block;font-size:13px;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* sections */
section.blk{padding:72px 0 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:clamp(28px,3.6vw,44px);font-weight:700}
.sh p{margin:0;color:var(--soft);max-width:46ch}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pc{background:var(--card);border-radius:var(--radius);padding:26px 24px 24px}
.pc .k{font:700 13px Unbounded;color:var(--acc);margin-bottom:14px;display:block}
.pc h3{font-size:19px;font-weight:700;margin-bottom:10px}
.pc p{margin:0;color:var(--soft);font-size:15.5px}
.pc ul{margin:0;padding:0;list-style:none;font-size:15.5px;color:var(--soft)}.pc li{margin:0 0 6px}
.pc li b{color:var(--ink)}
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px;background:var(--card);border-radius:var(--radius);padding:12px 30px}
.fd{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.fd:nth-last-child(-n+2){border-bottom:0}
.fd .n{font:800 15px Unbounded;color:var(--faint);min-width:26px}
.fd p{margin:0;font-size:16px}.fd p b{font-weight:700}
/* indicators */
.ind{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:5px 11px 5px 9px;border-radius:99px;white-space:nowrap;cursor:help}
.ind:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ind.g{background:var(--g-w);color:var(--g)}.ind.y{background:var(--y-w);color:var(--y)}.ind.r{background:var(--r-w);color:var(--r)}.ind.n{background:var(--n-w);color:var(--n)}.ind.o{background:transparent;color:inherit;box-shadow:inset 0 0 0 1px var(--faint)}
.flag{font-size:12.5px;font-weight:700;color:var(--y);cursor:help}
/* leaderboard */
.board{background:var(--card);border-radius:var(--radius);padding:8px 10px}
.bh,.br{display:grid;grid-template-columns:minmax(260px,1fr) repeat(5,128px);align-items:center;gap:10px;padding:12px 14px}
.br .ic{display:none}.br .nm>span{min-width:0}
.br .why{display:block;font-weight:500;color:var(--soft);font-size:13.5px;line-height:1.45;margin-top:3px}
.br .chg{display:block;font-weight:500;color:#9a6600;font-size:13px;line-height:1.45;margin-top:4px}
.gh{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;padding:22px 14px 8px;border-top:1px solid var(--line)}
.gh:first-of-type{border-top:0}.gh b{font:700 20px Unbounded;display:flex;align-items:center;gap:10px}
.gh b:before{content:"";width:12px;height:12px;border-radius:50%;background:var(--c)}.gh span{color:var(--soft);font-size:14.5px}
.gh.go{--c:var(--g)}.gh.watch{--c:var(--y)}.gh.no{--c:var(--r)}
.bh{font-size:12.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}
.br{border-radius:14px;cursor:pointer;text-decoration:none;transition:background .2s}
.br:hover{background:var(--bg)}
.br .rk{font:800 18px Unbounded;color:var(--faint)}
.br.top .rk{color:var(--ink)}
.br .nm{display:flex;align-items:center;gap:14px;font-weight:700}
.br .nm img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--wash)}
.br .nm small{display:block;font-weight:500;color:var(--faint);font-size:13px}
.cut{height:1px;background:var(--line);margin:6px 14px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--soft);margin-top:14px}
.legend .ind{cursor:default}
.i{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;color:var(--faint);font:700 11px/1 Manrope;cursor:help;vertical-align:2px;margin-left:6px;background:transparent;padding:0;flex:none}
.i:hover,.i:focus-visible{color:var(--ink);outline:none}
.howl{background:var(--card);border-radius:var(--radius);padding:6px 26px}
.howl div{display:grid;grid-template-columns:180px 1fr;gap:16px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.howl div:last-child{border-bottom:0}.howl b{font-weight:700}.howl span{color:var(--soft)}
.wins{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.win{background:var(--card);border-radius:var(--radius);padding:22px;text-decoration:none;display:flex;flex-direction:column;gap:8px;transition:transform .3s}
.win:hover{transform:translateY(-3px)}.win b{font:700 19px Unbounded}.win small{color:var(--faint);font-size:13px}
.win p{margin:0;font-size:15px;color:var(--soft);flex:1}.win .ch{font-size:13.5px;font-weight:700;color:var(--acc)}
.mbar{display:flex;height:48px;border-radius:14px;overflow:hidden;background:var(--wash)}
.mbar i{display:flex;align-items:center;justify-content:center;font:700 13px Manrope;color:#fff;white-space:nowrap;overflow:hidden;min-width:3px}
.mleg{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;font-size:14.5px;color:var(--soft)}
.mleg span:before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--c);margin-right:7px}
.cc{background:var(--card);border-radius:var(--radius);padding:6px 10px}
.ccr{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr) 210px;gap:18px;padding:16px 14px;border-bottom:1px solid var(--line);align-items:start;font-size:15.5px}
.ccr:last-child{border-bottom:0}.ccr.h{font-size:12.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em}
.ccr .q{font-weight:700}.ccr .ev{color:var(--soft)}.ccr .ind{cursor:default;white-space:normal}
.sum3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:14px}
.sum3 div{background:var(--card);border-radius:var(--radius);padding:20px 22px}.sum3 b{display:block;font-weight:700;margin-bottom:10px}
.sum3 p{margin:0 0 4px;font-size:14.5px;color:var(--soft)}.sum3 p em{font-style:normal;font-weight:700;color:var(--ink)}
.lead2{font-size:18px;max-width:70ch;margin:0 0 20px;color:var(--soft)}
@media (max-width:760px){.howl div{grid-template-columns:1fr;gap:4px}.ccr{grid-template-columns:1fr;gap:8px}.ccr.h{display:none}.sum3{grid-template-columns:1fr}}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(0,0,0,.35)}
.card .ph{aspect-ratio:16/10;background:var(--wash);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .badge{position:absolute;top:12px;left:12px;background:var(--card);border-radius:99px;font:700 13px Unbounded;padding:6px 11px}
.card .badge.t{background:var(--ink);color:#fff}
.card .bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.card h3{font-size:19px;font-weight:700}
.card p{margin:0;font-size:15px;color:var(--soft);flex:1}
.nums{display:flex;gap:22px;flex-wrap:wrap}.nums div b{display:block;font:700 19px Unbounded;white-space:nowrap}.nums div span{font-size:12.5px;color:var(--faint)}
.inds{display:flex;flex-wrap:wrap;gap:6px}
.grv{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;margin:14px 0}
.tomb{background:#ECEAE4;border-radius:80px 80px 10px 10px;padding:26px 14px 14px;text-align:center;font-size:13px;line-height:1.4;color:var(--ink);position:relative}
.tomb:before{content:"✝";position:absolute;top:6px;left:0;right:0;color:#9C978E;font-size:14px}
.tomb b{display:block;font-size:14px;margin-bottom:2px;word-break:break-all}.tomb .d{color:#6F6A62}.tomb .h{font-style:italic;color:#6F6A62;margin-top:6px}
.tomb .k{display:inline-block;margin:6px 3px 0;padding:1px 8px;border-radius:10px;background:#fff;font-size:12px}
.tomb.alive{background:#E7F0E6}
.chl{margin:0 0 14px;font-size:15px;line-height:1.5}.chl p{margin:0 0 4px}.ilab{margin:6px 0 6px;font-size:13px;color:var(--faint)}
/* article */
.back{display:inline-flex;gap:8px;align-items:center;font-weight:600;color:var(--soft);text-decoration:none;margin:34px 0 0}
.ahead{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:28px 0 10px}
.ahead h1{font-size:clamp(34px,4.8vw,62px);font-weight:800;margin:14px 0 18px}
.ahead .vd{font-size:21px;line-height:1.45;margin:0 0 22px}
.ahead .ph{border-radius:28px;overflow:hidden;aspect-ratio:1/1;background:var(--wash)}
.ahead .ph img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--ink);color:#fff;margin-right:6px}
.tag.l{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.claim{background:var(--dark);color:#fff;border-radius:var(--radius);padding:34px 36px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:30px;align-items:center}
.claim .q{font-size:20px;line-height:1.5;margin:10px 0 0}
.claim .money{font:800 clamp(22px,2.4vw,30px)/1.2 Unbounded;text-align:right}
.claim .money small{display:block;font:500 13px Manrope;opacity:.6;margin-top:6px;max-width:30ch}
.claim .eyebrow{color:#9a9aff}
.claim a{color:#9a9aff}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fact{background:var(--card);border-radius:var(--radius);padding:24px}
.fact h3{font-size:17px;font-weight:700;margin-bottom:10px}
.fact p{margin:0;font-size:15.5px;color:var(--soft)}
.mlist{margin:0;padding-left:18px;font-size:15px;color:var(--soft)}.mlist li{margin:0 0 6px}
/* story home (v2.5) */
.hero{display:grid;grid-template-columns:1.35fr 1fr;gap:40px;align-items:end}.hero h1{font-size:clamp(34px,4.8vw,62px);max-width:17ch}
.ans{background:var(--ink);color:#fff;border-radius:var(--radius);padding:28px 28px 22px}.ans .eyebrow{color:#B9B6AE}
.ans p{margin:14px 0 0;font-size:16.5px;line-height:1.5;color:#E9E7E1}.ans b{color:#fff}.ans a{color:#fff}
.ctas{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}
.btn{font:700 15px Manrope;border:0;border-radius:99px;padding:13px 22px;background:var(--acc);color:#fff;cursor:pointer;text-decoration:none;display:inline-block}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.cnt div{background:var(--card);border-radius:var(--radius);padding:22px 18px}.cnt b{display:block;font:800 clamp(28px,3.4vw,42px)/1 Unbounded;color:var(--acc)}
.cnt span{display:block;margin-top:10px;font-size:14px;color:var(--soft);line-height:1.35}
.vcs{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.vc{background:var(--card);border-radius:var(--radius);padding:20px;display:flex;flex-direction:column;gap:12px}
.vc .q{font:700 16px/1.3 Unbounded;margin:0;color:var(--ink)}
.why3{margin:0 0 12px;padding-left:18px;color:var(--soft)}.why3 li{margin-bottom:8px}.why3 b{color:var(--ink)}
.cv p{color:var(--soft)}
.tally{display:grid;gap:12px}.trow{background:var(--card);border-radius:var(--radius);padding:18px 20px}.trow>b{display:block;font:700 16px Unbounded;margin-bottom:12px}
.tcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.tcols .ind{cursor:default}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}.chip{display:flex;align-items:center;gap:7px;background:var(--bg);border-radius:99px;padding:3px 10px 3px 3px;text-decoration:none;font-size:13px}
.chip img,.chip i{width:26px;height:26px;border-radius:50%;object-fit:cover;background:var(--wash);display:block}
.vc .ind{align-self:flex-start;cursor:default}.vc p{margin:0;font-size:14.5px;color:var(--soft)}
.ind.hold{background:var(--acc);color:#fff}
abbr.ab{text-decoration:underline dotted 1.5px;text-underline-offset:3px;cursor:help}
.ico{width:30px;height:30px;color:var(--acc);display:block}.ico.sm{width:20px;height:20px;display:inline-block;vertical-align:-4px;margin-right:8px}
.mq{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}.mq div{background:var(--card);border-radius:var(--radius);padding:22px 20px;position:relative}
.mq .n{position:absolute;top:18px;right:20px;font:800 22px Unbounded;color:var(--line)}.mq b{display:block;margin:14px 0 8px;font-size:16.5px;line-height:1.3}.mq p{margin:0 0 14px;color:var(--soft);font-size:14.5px}
.src{display:flex;flex-wrap:wrap;gap:5px}.src span{font-size:12px;background:var(--wash);border-radius:99px;padding:3px 9px;color:var(--soft)}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:14px;align-items:center}.eq>i{font:800 30px Unbounded;font-style:normal;color:var(--faint);text-align:center}
.eq div{background:var(--card);border-radius:var(--radius);padding:22px}.eq b{display:block;margin:12px 0 6px;font:700 18px Unbounded}.eq span{color:var(--soft);font-size:14px}.eq .ok{box-shadow:inset 0 0 0 2px var(--acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.two>div{background:var(--card);border-radius:var(--radius);padding:22px}.two h3{font-size:18px;margin-bottom:10px}.two ul{margin:0;padding-left:18px;color:var(--soft)}.two li{margin-bottom:8px}.two li b{color:var(--ink)}
@media (max-width:980px){.mq{grid-template-columns:1fr 1fr}.eq{grid-template-columns:1fr}.eq>i{display:none}}@media (max-width:620px){.mq,.two{grid-template-columns:1fr}}
.kcnt{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kcnt div{background:var(--card);border-radius:var(--radius);padding:20px}.kcnt b{display:block;font:800 clamp(26px,3vw,36px)/1 Unbounded;color:var(--acc)}.kcnt span{display:block;margin-top:8px;color:var(--soft);font-size:14px}
.vs{background:var(--card);border-radius:var(--radius);padding:6px 20px}.vs .vh,.vs .vr{display:grid;grid-template-columns:1fr 1.3fr 1.3fr;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.vs .vr:last-child{border-bottom:0}.vs .vh b{font:700 17px Manrope}.vs .vh a{color:var(--ink)}.vs .vr span{color:var(--faint);font-size:14px}.vs .vr p{margin:0;font-size:15px}
@media (max-width:760px){.vs .vh,.vs .vr{grid-template-columns:1fr 1fr}.vs .vh span,.vs .vr span{grid-column:1/-1}}
.lash3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:14px}.lash3 div{background:var(--card);border-radius:var(--radius);padding:20px}.lash3 b{display:block;font:700 19px Unbounded;margin:6px 0 8px}.lash3 p{margin:0;color:var(--soft);font-size:14.5px}
@media (max-width:760px){.lash3{grid-template-columns:1fr}}
.jump{display:flex;flex-wrap:wrap;gap:6px;margin-top:22px}.jump button,.jump a{font:600 13.5px Manrope;border:1px solid var(--line);background:var(--card);border-radius:99px;padding:7px 13px;cursor:pointer;color:var(--ink);text-decoration:none;transition:background .2s,border-color .2s}
.jump button:hover,.jump a:hover{border-color:var(--ink)}.jump a{background:var(--ink);color:#fff;border-color:var(--ink)}
.rv{opacity:0;transform:translateY(32px);transition:opacity .8s ease,transform .9s cubic-bezier(.2,.8,.2,1)}.rv.in{opacity:1;transform:none}
.fx .gt i{transform:scaleX(0);transform-origin:right;transition:transform 1.1s cubic-bezier(.2,.8,.2,1) .1s}.fx .gt i.ad{transition-delay:.7s}.fx.in .gt i{transform:none}
.fx .gt em{opacity:0;transition:opacity .4s 1.6s}.fx.in .gt em{opacity:1}
.fx .rr i{transform:scaleX(0);transform-origin:left;transition:transform .6s ease var(--d,0ms)}.fx.in .rr i{transform:none}
.fx .dots i{opacity:0;transition:opacity .6s ease var(--d,0ms)}.fx.in .dots i{opacity:1}
.mbar.fx i{transform:scaleX(0);transform-origin:left;transition:transform .9s cubic-bezier(.2,.8,.2,1) .2s}.mbar.fx.in i{transform:none}
.card{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}.card:hover{transform:translateY(-4px);box-shadow:0 14px 30px -18px rgba(0,0,0,.35)}
.tstrip{display:flex;justify-content:space-between;align-items:center;gap:22px;background:var(--ink);color:#fff;border-radius:var(--radius);padding:26px 28px;text-decoration:none;transition:transform .3s}
.tstrip:hover{transform:translateY(-3px)}.tstrip .eyebrow{color:#B9B6AE}.tstrip b{display:block;font:700 clamp(20px,2.4vw,28px) Unbounded;margin:8px 0}.tstrip p{margin:0;color:#D9D6CE;max-width:60ch}

  <section class="blk"><div class="sh"><h2>Данные</h2></div><div class="figs">${funnel(c)}${trendFig(c)}${leadersFig(c)}${reviewsFig(c)}</div>
   <details class="more"><summary>Все цифры и как считали</summary><div class="kv">
    <div>Покупают на Amazon в месяц (первые 5 страниц поиска)</div><div>${nf(m.A2)}</div>
    ${GR.a1_invalid&&GR.a1_invalid[c.pid]?`<div>Поиск в Google к прошлому году</div><div>не виден</div>`:`<div>Поиск в Google к прошлому году (${/, summed$/.test(m.A1_terms)?"сумма запросов ":""}${esc(m.A1_terms.replace(/, summed$/,""))}, среднее по ${m.A1_pulls} замерам)</div><div>${pc(m.A1)}</div>`}
    <div>Новых продавцов за 3–24 месяца</div><div>${m.B1_n}</div><div>Из них продают 1 000+ / 300+ в месяц</div><div>${m.B2_1k} / ${m.B2_300}</div>
    <div>Доля с учётом погрешности (95%)</div><div>${Math.round(m.B1_lo*100)}–${Math.round(m.B1_hi*100)}%</div>
    <div>Из пробившихся безымянных (по названию карточки)</div><div>${m.D1_unbranded_1k} из ${m.B2_1k}</div>
    <div>Доля трёх крупнейших брендов</div><div>${Math.round(m.B3_top3*100)}%</div><div>Индекс концентрации (HHI)</div><div>${nf(m.B3_hhi)}</div>
    <div>Цены за 12 месяцев</div><div>${esc(m.D2_note)}</div>
    ${m.B4_shops.map(s=>`<div>Реклама Meta, ${esc(s.domain)}: активных / работают 90+ дней</div><div>${nf(s.active)} / ${nf(s.aged90)}</div>`).join("")}
    ${m.B6?`<div>Молодой бизнес-победитель (проверено по сайту и отзывам)</div><div>${esc(m.B6)}</div>`:""}
    <div class="c">◆ посчитано платформой · ◈ наша оценка или прочтение · ◇ спорно. <a href="#method">Методика на отдельной странице.</a></div></div></details></section>
  ${adsFig(c)}${foot()}</div>`;
  window.scrollTo(0,0);wireTips();drawAll(c)}
const tier=s=>s.replace(/◆/g,'<span title="посчитано платформой">◆</span>').replace(/◈/g,'<span title="наша оценка">◈</span>');
function money(s){s=String(s||"").split("(")[0].replace(/,\s*относится.*$/,"");
  s=s.replace(/\$([\d,]{5,})/g,(_,n)=>{const v=+n.replace(/,/g,"");return v>=1e6?"$"+(v/1e6).toFixed(1).replace(".",",").replace(/,0$/,"")+" млн":"$"+Math.round(v/1e3)+" тыс."});
  return s.trim().slice(0,70)}
function funnel(c){const m=c.m,mx=m.B1_n||1,w=v=>Math.max(2,Math.round(100*v/mx))+"%";
  return `<div class="fig"><h3>Сколько новичков пробивается</h3><p class="cap">Продавцы, пришедшие на Amazon за последние 3–24 месяца</p><div class="funnel">
   <div><b>${m.B1_n}</b><i style="width:${w(m.B1_n)};opacity:.25"></i><span>пришли</span></div>
   <div><b>${m.B2_300}</b><i style="width:${w(m.B2_300)};opacity:.5"></i><span>продают 300+</span></div>
   <div><b>${m.B2_1k}</b><i style="width:${w(m.B2_1k)}"></i><span>продают 1 000+</span></div>
   <div><b>${m.D1_unbranded_1k}</b><i style="width:${w(m.D1_unbranded_1k)};background:var(--faint)"></i><span>из них без бренда</span></div></div></div>`}
function trendFig(c){if(!c.trend.values||(GR.a1_invalid&&GR.a1_invalid[c.pid]))return"";const sum=c.m&&/, summed$/.test(c.m.A1_terms||"");
  return `<div class="fig"><h3>Спрос в Google</h3><p class="cap">«${esc(c.trend.term)}», США, по неделям, сглажено${sum?`. Это один запрос; все формулировки вместе дают ${pc(c.m.A1)} к прошлому году`:""}</p><div id="tr"></div></div>`}
function leadersFig(c){const L=(c.leaders||[]).slice(0,6);if(!L.length)return"";const mx=Math.max(...L.map(l=>l.units));
  return `<div class="fig"><h3>Лидеры Amazon</h3><p class="cap">Покупают в месяц · цена</p><div class="bars">${L.map(l=>`<div><span style="color:var(--ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.name)}</span><i style="width:${Math.max(2,Math.round(100*l.units/mx))}%"></i><span>${kf(l.units)}${l.price?" · $"+l.price.toFixed(0):""}</span></div>`).join("")}</div></div>`}
function reviewsFig(c){if(!c.reviews)return"";return `<div class="fig"><h3>Отзывы в магазинах лидеров</h3><p class="cap">Отзывов в месяц; пунктиром показана оценка</p><div id="rv"></div></div>`}
function adsFig(c){const A=(c.creatives||[]).slice(0,3);if(!A.length)return"";
  return `<section class="blk"><div class="sh"><h2>Реклама, которая живёт дольше всех</h2><p>Объявления лидеров из библиотеки Meta, отсортированы по сроку показа; все ещё крутятся на 11 ноября (проверено через Apify).</p></div><div class="ads">${A.map(a=>`<a class="ad" href="${a.lib}" target="_blank" rel="noopener"><img src="${a.img}" alt="" loading="lazy"><div><b>${a.days} дн. в показе</b>${esc(a.domain)}</div></a>`).join("")}</div></section>`}
const SER=["#2B2BFF","#121212","#1E9E5A","#D08A00","#D2443C"];
function line(series,labels,W=520,H=200){const L=34,B=24,all=series.flatMap(s=>s.v.filter(x=>x!=null)),mx=Math.max(...all,1)*1.08,n=labels.length;
  const X=i=>L+i/(n-1)*(W-L-6),Y=v=>H-B-(v/mx)*(H-B-8);let g="";
  for(const t of[0,.5,1]){const y=Y(mx*t/1.08);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#E3DFD6"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(mx*t/1.08)}</text>`}
  labels.forEach((l,i)=>{if(l)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${l}</text>`});
  series.forEach((s,k)=>{let d="",pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${SER[k%5]}" stroke-width="2.2" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round"/>`});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`+(series.length>1?`<div class="legend" style="margin-top:6px">${series.map((s,k)=>`<span><i style="display:inline-block;width:10px;height:3px;background:${SER[k%5]};vertical-align:middle;margin-right:6px"></i>${esc(s.name)}</span>`).join("")}</div>`:"")}
function drawAll(c){
  if(c.trend.values&&$("#tr")){const v=c.trend.values.slice(-156),sm=v.map((_,i)=>{const s=v.slice(Math.max(0,i-3),i+1);return s.reduce((a,b)=>a+b,0)/s.length});
    const w0=new Date(DATA.week0+"T00:00:00Z"),off=c.trend.values.length-v.length,MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
    const lab=v.map((_,i)=>{const d=new Date(w0.getTime()+(off+i)*7*864e5);return d.getUTCMonth()===0&&d.getUTCDate()<=7?String(d.getUTCFullYear()):""});
    $("#tr").innerHTML=line([{name:"спрос",v:sm}],lab)}
  if(c.reviews&&$("#rv")){const M=DATA.months,S=c.reviews.series.slice(0,4);
    const ser=[];S.forEach(s=>{ser.push({name:s.name,v:s.pts.map(p=>p[2]?null:p[1])});if(s.pts.some(p=>p[2]))ser.push({name:s.name+" (оценка)",v:s.pts.map(p=>p[1]),dash:1})});
    $("#rv").innerHTML=line(ser.filter(s=>s.v.some(x=>x!=null)),M.map(ym=>ym.endsWith("-01")?ym.slice(0,4):""))}}

/* ---------- tips ---------- */
const RISK={legal:["g","Законно"],gray:["y","Серая зона"],risk:["r","Риск бана или иска"]};
const SEC=[["stay","Как оставаться на рынке","Запреты площадок и формулировки"],["sell","Как хитро продавать","Страницы, офферы, цены"],["ads","Как хитро рекламировать","Креативы и запуск"],["_money","Как они считают деньги","Откуда цифры в видео"]];
let tipF="all";
function tips(){const T=RU.tips;
  const body=()=>SEC.map(([k,h,s])=>{const L=T.filter(t=>t.sec===k&&(tipF==="all"||t.risk===tipF));if(!L.length)return"";
    return `<section class="blk"><div class="sh"><h2>${h}</h2><p>${s}</p></div><div class="facts">${L.map(t=>`<div class="fact">
      <span class="ind ${RISK[t.risk][0]}" style="cursor:default;margin-bottom:12px">${RISK[t.risk][1]}</span><h3>${esc(t.h)}</h3><p>${tier(esc(t.p))}</p>
      <p style="margin-top:12px;font-size:13.5px">${t.src.map(([v,p])=>`<a href="https://www.youtube.com/watch?v=${v}" target="_blank" rel="noopener">${esc(RU.name[p]||p)}</a>`).join(" · ")}</p></div>`).join("")}</div></section>`}).join("");
  $("#app").innerHTML=`<div class="wrap fade"><section class="cover"><span class="eyebrow">Из 19 видео по нашим товарам</span><h1>Хитрости</h1>
    <p class="lede">Всё, что авторы советовали про запреты, формулировки, продажи и рекламу. У каждого приёма есть пометка риска и ссылка на видео.</p>
    <div class="switch" role="group">${[["all","Все"],["legal","Законно"],["gray","Серая зона"],["risk","Риск"]].map(([k,v])=>`<button data-r="${k}" aria-pressed="${tipF===k}">${v}</button>`).join("")}</div></section>
    <div id="tipbody">${body()}</div>${foot()}</div>`;
  $$("[data-r]").forEach(b=>b.onclick=()=>{tipF=b.dataset.r;$$("[data-r]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#tipbody").innerHTML=body()});
  window.scrollTo(0,0)}

/* ---------- other pages ---------- */
function soon(t,p){$("#app").innerHTML=`<div class="wrap fade"><section class="cover"><span class="eyebrow">В работе</span><h1>${t}</h1><p class="lede">${p}</p></section>${foot()}</div>`;window.scrollTo(0,0)}
function foot(){return `<footer><span>Собрано ${DATA.built}</span><span><a href="#method">Как мы проверяем</a></span><span>◆ посчитано платформой · ◈ наша оценка · ◇ спорно</span></footer>`}
/* tooltips: hover on desktop; tap on touch screens (ⓘ always opens on click) */
let tipFor=null;const touch=matchMedia("(hover: none)").matches;
function showTip(e){const T=$("#tip"),w=Math.min(300,innerWidth-16);T.textContent=e.dataset.tip;T.style.maxWidth=w+"px";T.style.opacity=1;tipFor=e;
  const r=e.getBoundingClientRect();T.style.left=Math.min(innerWidth-w-8,Math.max(8,r.left))+"px";
  const below=r.bottom+8;T.style.top=(below+T.offsetHeight>innerHeight-8?Math.max(8,r.top-8-T.offsetHeight):below)+"px"}
function hideTip(){$("#tip").style.opacity=0;tipFor=null}
function wireTips(){$$("[data-tip]").forEach(e=>{e.onmouseenter=()=>showTip(e);e.onmouseleave=hideTip;
  e.onclick=ev=>{if(!(e.classList.contains("i")||touch))return;ev.preventDefault();ev.stopPropagation();tipFor===e?hideTip():showTip(e)}})}
addEventListener("click",hideTip);addEventListener("scroll",hideTip,{passive:true});
const ABBR={"RDAP": "Реестр доменов. Показывает, когда зарегистрирован сайт магазина.", "Wayback": "Архив интернета (Wayback Machine): сохранённые копии сайтов. По первой копии видно, когда сайт появился.", "CTR": "Доля людей, которые кликнули по рекламе, из всех, кто её увидел.", "FDA": "Управление по контролю за продуктами и лекарствами США. Решает, где косметика, а где лекарство.", "FTC": "Федеральная торговая комиссия США. Следит за честной рекламой и отзывами.", "USPS": "Почта США. Мы брали её тарифы на доставку посылок покупателю.", "HHI": "Индекс концентрации рынка. Чем выше, тем больше продаж у немногих продавцов: до 1 000 рынок открыт, выше 1 800 захвачен.", "CBO": "Режим Facebook, в котором он сам распределяет бюджет между группами объявлений.", "MoCRA": "Закон США о косметике 2022 года: регистрация производства и товаров, маркировка.", "PDRN": "Косметический компонент из ДНК лосося, популярный в корейском уходе.", "Meta Ad Library": "Открытая библиотека рекламы Facebook и Instagram: все работающие объявления с датой запуска.", "BigSpy": "Архив рекламы. В отличие от библиотеки Meta, хранит и уже выключенные объявления.", "Keepa": "Сервис истории Amazon: продажи, цены и отзывы каждого товара по месяцам.", "EchoTik": "Сервис статистики продаж в TikTok Shop.", "Kalodata": "Сервис статистики TikTok Shop с историей до ~1 000 дней.", "FastMoss": "Сервис статистики TikTok Shop с историей продаж.", "Semrush": "Сервис оценки трафика сайтов из поиска Google.", "Similarweb": "Сервис оценки посещаемости сайтов и источников трафика.", "Apify": "Магазин готовых программ, которые собирают данные с сайтов.", "Trustpilot": "Сайт отзывов о компаниях. Магазин не может там спрятать плохие отзывы.", "camelcamelcamel": "Сервис истории цен на Amazon.", "Google Trends": "Как менялся интерес к запросу в Google по неделям.", "TikTok Shop": "Магазин внутри TikTok: товары покупают прямо из видео.", "Opportunity Explorer": "Данные самого Amazon о спросе и о том, сколько новых товаров запускается в нише.", "ImportYeti": "База морских поставок в США: по ней видно, какая фабрика возит товар лидеру.", "Made-in-China": "Площадка китайских поставщиков с оптовыми ценами."};
const ABRE=new RegExp("(^|[^\\wА-Яа-яЁё-])("+Object.keys(ABBR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\wА-Яа-яЁё-])");
function abbrify(){const root=$("#app"),done=new Set(),W=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,button,abbr,[data-tip],h1,.nav")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(W.nextNode())nodes.push(W.currentNode);
  nodes.forEach(n=>{let t=n.nodeValue,m,frag=null,last=0;const re=new RegExp(ABRE.source,"g");
    while((m=re.exec(t))){const k=m[2];if(done.has(k))continue;done.add(k);frag=frag||document.createDocumentFragment();const st=m.index+m[1].length;
      frag.appendChild(document.createTextNode(t.slice(last,st)));const a=document.createElement("abbr");a.className="ab";a.dataset.tip=ABBR[k];a.textContent=k;frag.appendChild(a);last=st+k.length}
    if(frag){frag.appendChild(document.createTextNode(t.slice(last)));n.replaceWith(frag)}})}
function route(){const h=location.hash.slice(1);let n="home";
  if(h.startsWith("c-")&&BY[h.slice(2)]){article(BY[h.slice(2)]);n=""}
  else if(h==="tips"){tips();n="tips"}
  else if(h==="method"){method();n="method"}
  else if(h==="video"){videoPage();n="video"}
  else if(h==="tools"){toolsPage();n="tools"}
  else{home();if(h==="all")setTimeout(()=>$("#all20").scrollIntoView(),20);n=h==="all"?"all":"home";if(h!=="all")window.scrollTo(0,0)}
  $$(".nav nav a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.n===n));abbrify();wireTips()}
addEventListener("hashchange",route);addEventListener("scroll",()=>$("#nav").classList.toggle("sc",scrollY>10));route();
</script>
