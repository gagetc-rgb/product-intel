:root {
    /**
     * ---------------------------------------------------------------------
     * SPACING VARIABLES
     *
     * We are using a spacing inspired from frameworks like Tailwind CSS.
     * ---------------------------------------------------------------------
     */
    --spacing-0-5: 0.125rem; /* 2px */
    --spacing-1: 0.25rem; /* 4px */
    --spacing-1-5: 0.375rem; /* 6px */
    --spacing-2: 0.5rem; /* 8px */
    --spacing-2-5: 0.625rem; /* 10px */
    --spacing-3: 0.75rem; /* 12px */
    --spacing-3-5: 0.875rem; /* 14px */
    --spacing-4: 1rem; /* 16px */
    --spacing-4-5: 1.125rem; /* 18px */
    --spacing-5: 1.25rem; /* 20px */
    --spacing-5-5: 1.375rem; /* 22px */
    --spacing-6: 1.5rem; /* 24px */
    --spacing-6-5: 1.625rem; /* 26px */
    --spacing-7: 1.75rem; /* 28px */
    --spacing-7-5: 1.875rem; /* 30px */
    --spacing-8: 2rem; /* 32px */
    --spacing-8-5: 2.125rem; /* 34px */
    --spacing-9: 2.25rem; /* 36px */
    --spacing-9-5: 2.375rem; /* 38px */
    --spacing-10: 2.5rem; /* 40px */
    --spacing-11: 2.75rem; /* 44px */
    --spacing-12: 3rem; /* 48px */
    --spacing-14: 3.5rem; /* 56px */
    --spacing-16: 4rem; /* 64px */
    --spacing-18: 4.5rem; /* 72px */
    --spacing-20: 5rem; /* 80px */
    --spacing-24: 6rem; /* 96px */
    --spacing-28: 7rem; /* 112px */
    --spacing-32: 8rem; /* 128px */
    --spacing-36: 9rem; /* 144px */
    --spacing-40: 10rem; /* 160px */
    --spacing-44: 11rem; /* 176px */
    --spacing-48: 12rem; /* 192px */
    --spacing-52: 13rem; /* 208px */
    --spacing-56: 14rem; /* 224px */
    --spacing-60: 15rem; /* 240px */
    --spacing-64: 16rem; /* 256px */
    --spacing-72: 18rem; /* 288px */
    --spacing-80: 20rem; /* 320px */
    --spacing-96: 24rem; /* 384px */

    /* Container */
    --container-max-width: 1440px;
    --container-narrow-max-width: 1190px;
    --container-gutter: var(--spacing-5);
    --section-outer-spacing-block: var(--spacing-8);
    --section-inner-max-spacing-block: var(--spacing-8);
    --section-inner-spacing-inline: var(--container-gutter);
    --section-stack-spacing-block: var(--spacing-8);

    /* Grid gutter */
    --grid-gutter: var(--spacing-5);

    /* Product list settings */
    --product-list-row-gap: var(--spacing-8);
    --product-list-column-gap: var(--grid-gutter);

    /* Form settings */
    --input-gap: var(--spacing-2);
    --input-height: 2.625rem;
    --input-padding-inline: var(--spacing-4);

    /* Other sizes */
    --sticky-area-height: calc(var(--sticky-announcement-bar-enabled, 0) * var(--announcement-bar-height, 0px) + var(--sticky-header-enabled, 0) * var(--header-height, 0px) + var(--collection-fragment-top-offset, 0px));

    /* RTL support */
    --transform-logical-flip: 1;
    --transform-origin-start: left;
    --transform-origin-end: right;

    /**
     * ---------------------------------------------------------------------
     * TYPOGRAPHY
     * ---------------------------------------------------------------------
     */

    /* Font properties */
    --heading-font-family: "Tenor Sans", sans-serif;
    --heading-font-weight: 400;
    --heading-font-style: normal;
    --heading-text-transform: normal;
    --heading-letter-spacing: 0.0em;
    --text-font-family: "Tenor Sans", sans-serif;
    --text-font-weight: 400;
    --text-font-style: normal;
    --text-letter-spacing: 0.0em;

    /* Font sizes */
    --text-h0: 2.75rem;
    --text-h1: 2rem;
    --text-h2: 1.75rem;
    --text-h3: 1.375rem;
    --text-h4: 1.125rem;
    --text-h5: 1.125rem;
    --text-h6: 1rem;
    --text-xs: 0.75rem;
    --text-sm: 0.8125rem;
    --text-base: 0.9375rem;
    --text-lg: 1.1875rem;
    /* Custom (sp text blocks): h2.5 step, round-up-even midpoint of --text-h3/--text-h2 per heading size — small 24/28/34px, medium 26/30/38px, large 28/36/42px across the three tiers */
    --text-h2-5: 1.625rem;
    /**
     * ---------------------------------------------------------------------
     * COLORS
     * ---------------------------------------------------------------------
     */

    /* Color settings */--accent: 28 28 28;
    --text-primary: 51 51 51;

    <script>
      (() => {
        const consentValue = (allowed) => (allowed ? 'granted' : 'denied');

        const syncGoogleConsent = () => {
          console.log('Syncing Google consent with Shopify customer privacy settings...');
          const customerPrivacy = window.Shopify?.customerPrivacy;

          if (!customerPrivacy) {
            return;
          }

          const analyticsAllowed = customerPrivacy.analyticsProcessingAllowed();
          const marketingAllowed = customerPrivacy.marketingAllowed();
          const advertisingDataAllowed = marketingAllowed && customerPrivacy.saleOfDataAllowed();
          console.log('Analytics allowed:', {
            analytics_storage: consentValue(analyticsAllowed),
            ad_storage: consentValue(marketingAllowed),
            ad_user_data: consentValue(advertisingDataAllowed),
            ad_personalization: consentValue(advertisingDataAllowed),
          });

          window.gtag('consent', 'update', {
            analytics_storage: consentValue(analyticsAllowed),
            ad_storage: consentValue(marketingAllowed),
            ad_user_data: consentValue(advertisingDataAllowed),
            ad_personalization: consentValue(advertisingDataAllowed),
          });
        };

        document.addEventListener('visitorConsentCollected', syncGoogleConsent);

        window.Shopify?.loadFeatures([{ name: 'consent-tracking-api', version: '0.1' }], (error) => {
          if (!error) {
            syncGoogleConsent();
          }
        });
      })();
