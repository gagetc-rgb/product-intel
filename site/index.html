<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Полка США 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F4F2EC;--card:#FFFFFF;--ink:#121212;--soft:#5E5B55;--faint:#9A968E;--line:#E3DFD6;--wash:#ECE9E1;
  --g:#1E9E5A;--g-w:#E2F4E9;--y:#D08A00;--y-w:#FBF0D6;--r:#D2443C;--r-w:#FBE4E1;--n:#A8A49B;--n-w:#EFEDE7;
  --acc:#2B2BFF;--dark:#111114;--radius:22px}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.55 Manrope,system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:inherit}img{display:block;max-width:100%}
h1,h2,h3,.disp{font-family:Unbounded,Manrope,sans-serif;letter-spacing:-.02em;line-height:1.08;margin:0}
.wrap{max-width:1180px;margin:0 auto;padding:0 28px}
/* nav */
.nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid transparent}
.nav.sc{border-bottom-color:var(--line)}
.nav .wrap{display:flex;align-items:center;gap:22px;height:64px}
.logo{font:700 17px Unbounded;text-decoration:none;display:flex;gap:9px;align-items:center}
.logo i{width:12px;height:12px;border-radius:4px;background:var(--acc);display:block}
.nav nav{margin-left:auto;display:flex;gap:4px}
.nav nav a{text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:99px;color:var(--soft)}
.nav nav a[aria-current]{background:var(--ink);color:#fff}
.nav nav a .soon{font-size:11px;opacity:.6;margin-left:4px}
/* cover */
.cover{padding:72px 0 40px}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--soft)}
.cover h1{font-size:clamp(40px,6.4vw,84px);font-weight:800;margin:18px 0 22px;max-width:14ch}
.cover .lede{font-size:21px;color:var(--soft);max-width:44ch;margin:0}
.switch{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px;gap:4px;margin:38px 0 10px}
.switch button{font:600 15px Manrope;border:0;background:transparent;padding:11px 20px;border-radius:99px;cursor:pointer;color:var(--soft);transition:.25s}
.switch button[aria-pressed=true]{background:var(--ink);color:#fff}
.switch-sub{font-size:15px;color:var(--soft);margin:0 0 22px;min-height:24px}
.tiles{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.tile{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--wash);aspect-ratio:3/4;text-decoration:none;color:#fff;transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.tile:hover{transform:translateY(-6px)}
.tile img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .4s}
.tile:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 35%,rgba(0,0,0,.78))}
.tile .no{position:absolute;top:12px;left:14px;z-index:2;font:800 30px Unbounded;text-shadow:0 2px 12px rgba(0,0,0,.35)}
.tile .tx{position:absolute;left:14px;right:14px;bottom:14px;z-index:2}
.tile .tx b{display:block;font:700 16px/1.2 Unbounded;margin-bottom:6px}
.tile .tx span{font-size:13px;opacity:.88}
/* sections */
section.blk{padding:72px 0 0}
.sh{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:26px;flex-wrap:wrap}
.sh h2{font-size:clamp(28px,3.6vw,44px);font-weight:700}
.sh p{margin:0;color:var(--soft);max-width:46ch}
.pre{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.pc{background:var(--card);border-radius:var(--radius);padding:26px 24px 24px}
.pc .k{font:700 13px Unbounded;color:var(--acc);margin-bottom:14px;display:block}
.pc h3{font-size:19px;font-weight:700;margin-bottom:10px}
.pc p{margin:0;color:var(--soft);font-size:15.5px}
.pc ul{margin:0;padding:0;list-style:none;font-size:15.5px;color:var(--soft)}.pc li{margin:0 0 6px}
.pc li b{color:var(--ink)}
.finds{display:grid;grid-template-columns:repeat(2,1fr);gap:0 40px;background:var(--card);border-radius:var(--radius);padding:12px 30px}
.fd{display:flex;gap:16px;padding:18px 0;border-bottom:1px solid var(--line)}
.fd:nth-last-child(-n+2){border-bottom:0}
.fd .n{font:800 15px Unbounded;color:var(--faint);min-width:26px}
.fd p{margin:0;font-size:16px}.fd p b{font-weight:700}
/* indicators */
.ind{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;padding:5px 11px 5px 9px;border-radius:99px;white-space:nowrap;cursor:help}
.ind:before{content:"";width:8px;height:8px;border-radius:50%;background:currentColor}
.ind.g{background:var(--g-w);color:var(--g)}.ind.y{background:var(--y-w);color:var(--y)}.ind.r{background:var(--r-w);color:var(--r)}.ind.n{background:var(--n-w);color:var(--n)}
.flag{font-size:12.5px;font-weight:700;color:var(--y);cursor:help}
/* leaderboard */
.board{background:var(--card);border-radius:var(--radius);padding:8px 10px}
.bh,.br{display:grid;grid-template-columns:44px minmax(220px,1.6fr) repeat(4,minmax(120px,1fr));align-items:center;gap:12px;padding:12px 14px}
.bh{font-size:12.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line)}
.br{border-radius:14px;cursor:pointer;text-decoration:none;transition:background .2s}
.br:hover{background:var(--bg)}
.br .rk{font:800 18px Unbounded;color:var(--faint)}
.br.top .rk{color:var(--ink)}
.br .nm{display:flex;align-items:center;gap:14px;font-weight:700}
.br .nm img{width:44px;height:44px;border-radius:12px;object-fit:cover;background:var(--wash)}
.br .nm small{display:block;font-weight:500;color:var(--faint);font-size:13px}
.cut{height:1px;background:var(--line);margin:6px 14px}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--soft);margin-top:14px}
.legend .ind{cursor:default}
/* cards */
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.card{background:var(--card);border-radius:var(--radius);overflow:hidden;text-decoration:none;display:flex;flex-direction:column;transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.card:hover{transform:translateY(-4px);box-shadow:0 18px 40px -22px rgba(0,0,0,.35)}
.card .ph{aspect-ratio:16/10;background:var(--wash);position:relative}
.card .ph img{width:100%;height:100%;object-fit:cover}
.card .badge{position:absolute;top:12px;left:12px;background:var(--card);border-radius:99px;font:700 13px Unbounded;padding:6px 11px}
.card .badge.t{background:var(--ink);color:#fff}
.card .bd{padding:20px 22px 22px;display:flex;flex-direction:column;gap:14px;flex:1}
.card h3{font-size:19px;font-weight:700}
.card p{margin:0;font-size:15px;color:var(--soft);flex:1}
.nums{display:flex;gap:22px}.nums div b{display:block;font:700 19px Unbounded}.nums div span{font-size:12.5px;color:var(--faint)}
.inds{display:flex;flex-wrap:wrap;gap:6px}
/* article */
.back{display:inline-flex;gap:8px;align-items:center;font-weight:600;color:var(--soft);text-decoration:none;margin:34px 0 0}
.ahead{display:grid;grid-template-columns:1.2fr 1fr;gap:40px;align-items:center;padding:28px 0 10px}
.ahead h1{font-size:clamp(34px,4.8vw,62px);font-weight:800;margin:14px 0 18px}
.ahead .vd{font-size:21px;line-height:1.45;margin:0 0 22px}
.ahead .ph{border-radius:28px;overflow:hidden;aspect-ratio:1/1;background:var(--wash)}
.ahead .ph img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--ink);color:#fff;margin-right:6px}
.tag.l{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.claim{background:var(--dark);color:#fff;border-radius:var(--radius);padding:34px 36px;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:30px;align-items:center}
.claim .q{font-size:20px;line-height:1.5;margin:10px 0 0}
.claim .money{font:800 clamp(22px,2.4vw,30px)/1.2 Unbounded;text-align:right}
.claim .money small{display:block;font:500 13px Manrope;opacity:.6;margin-top:6px;max-width:30ch}
.claim .eyebrow{color:#9a9aff}
.claim a{color:#9a9aff}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.fact{background:var(--card);border-radius:var(--radius);padding:24px}
.fact h3{font-size:17px;font-weight:700;margin-bottom:10px}
.fact p{margin:0;font-size:15.5px;color:var(--soft)}
.take{font:700 clamp(22px,2.6vw,32px)/1.3 Unbounded;letter-spacing:-.015em;max-width:30ch;margin:0}
.next{display:flex;flex-wrap:wrap;gap:8px;margin-top:22px}.next span{background:var(--card);border:1px dashed var(--faint);border-radius:99px;padding:8px 14px;font-size:14.5px}
.figs{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.fig{background:var(--card);border-radius:var(--radius);padding:24px 24px 18px}
.fig h3{font-size:16px;font-weight:700;margin-bottom:4px}
.fig .cap{font-size:13.5px;color:var(--faint);margin:0 0 14px}
.fig svg{width:100%;height:auto;display:block;overflow:visible}
.fig svg text{font:500 11.5px Manrope;fill:var(--faint)}
.funnel div{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:14.5px}
.funnel i{display:block;height:30px;border-radius:9px;background:var(--acc);min-width:6px}
.funnel b{font:700 16px Unbounded;min-width:40px}
.bars div{display:grid;grid-template-columns:120px 1fr 74px;gap:10px;align-items:center;margin-bottom:8px;font-size:14px}
.bars i{display:block;height:14px;border-radius:7px;background:var(--ink)}
.bars span{color:var(--faint);text-align:right}
.ads{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.ad{background:var(--card);border-radius:var(--radius);overflow:hidden;text-decoration:none}
.ad img{width:100%;aspect-ratio:1/1;object-fit:cover;background:var(--wash)}
.ad div{padding:14px 16px;font-size:14px}.ad b{display:block;margin-bottom:4px}
details.more{background:var(--card);border-radius:var(--radius);padding:6px 26px;margin-top:14px}
details.more summary{cursor:pointer;font-weight:700;padding:16px 0;list-style:none}
details.more summary:after{content:" +";color:var(--faint)}
details.more[open] summary:after{content:" −"}
.kv{display:grid;grid-template-columns:1fr auto;gap:0;font-size:15px;padding-bottom:16px}
.kv div{padding:9px 0;border-bottom:1px solid var(--line)}.kv div:nth-child(even){text-align:right;font-weight:700}
.kv div.c{grid-column:1/-1;color:var(--soft);font-size:13.5px;border:0;padding-top:12px}
.credt{background:var(--card);border-radius:var(--radius);padding:8px 10px}
.cr{display:grid;grid-template-columns:1.4fr repeat(4,1fr);gap:12px;align-items:center;padding:16px 14px;border-radius:14px;font-size:16px;cursor:help}
.cr:hover{background:var(--bg)}.cr.ch{font-size:12.5px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.08em;cursor:default;border-bottom:1px solid var(--line);border-radius:0}
.cr.ch:hover{background:none}.cr small{display:block;color:var(--faint);font-size:13px}
.cr .strike{text-decoration:line-through;text-decoration-color:var(--r);text-decoration-thickness:2px;color:var(--soft)}
.cr .gap{font:800 22px Unbounded;color:var(--r)}.cr .gap i{font:400 13px Manrope;color:var(--faint);font-style:normal}
.cap2{font-size:14px;color:var(--faint);margin:12px 4px 0;max-width:80ch}
@media (max-width:760px){.cr{grid-template-columns:1fr 1fr;row-gap:6px}.cr.ch{display:none}.cr .gap{grid-column:2;grid-row:1;text-align:right}}
.empty{background:var(--card);border-radius:var(--radius);padding:30px;color:var(--soft)}
footer{padding:80px 0 50px;color:var(--faint);font-size:14px;display:flex;gap:24px;flex-wrap:wrap}
.tip{position:fixed;z-index:50;background:var(--ink);color:#fff;font-size:13.5px;line-height:1.45;padding:10px 13px;border-radius:12px;max-width:290px;pointer-events:none;opacity:0;transition:opacity .15s}
.fade{animation:fd .5s ease both}@keyframes fd{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:980px){.tiles{grid-template-columns:repeat(5,minmax(150px,1fr));overflow-x:auto;scroll-snap-type:x mandatory}.tile{scroll-snap-align:start}
  .pre{grid-template-columns:1fr 1fr}.finds{grid-template-columns:1fr}.fd:nth-last-child(2){border-bottom:1px solid var(--line)}
  .cards,.facts,.ads{grid-template-columns:1fr 1fr}.figs{grid-template-columns:1fr}.ahead{grid-template-columns:1fr}.ahead .ph{max-height:320px;aspect-ratio:16/10}
  .bh{display:none}.br{grid-template-columns:34px 1fr;row-gap:8px}.br .ic{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px}.br>.ind{display:none}
  .claim{grid-template-columns:1fr}.claim .money{text-align:left}}
@media (max-width:620px){.wrap{padding:0 16px}.pre,.cards,.facts,.ads{grid-template-columns:1fr}.cover{padding-top:40px}.nav nav a{padding:7px 9px;font-size:14px}.nav nav a .soon{display:none}
  .switch{display:flex}.switch button{flex:1;padding:10px 8px;font-size:14px}.claim{padding:26px 22px}.finds{padding:6px 20px}}
</style>
</head>

iner in Mulberry! This rich, sophisticated shade is tur","video":false,"lib":"https://www.facebook.com/ads/library/?id=1344689150019541"},{"img":"media/6fd6ff5d0501b101.jpg","days":361,"start":"2025-11-12","page":"Cosmetic Times","domain":"smooche.com","head":"BUY 1, GET 1 FREE ON PLUMPERS ❤️","body":"“I’ve been getting sooo many compliments on my lips after using Smooche” Unlock celebrity-worthy lips without the injections..👇🏽 💋 Instant plumping effect in just 5 minutes 🌿 100% ","video":true,"lib":"https://www.facebook.com/ads/library/?id=1896655871732413"},{"img":"media/6371656f68899dec.jpg","days":341,"start":"2025-12-02","page":"Smooche","domain":"smooche.com","head":"The anti-aging step you’re probably skipping","body":"Your lips are aging — losing shape, volume, and definition. It’s subtle, until it’s not. That’s why women are turning to a new lip-plumping formula that delivers instant fullness a","video":false,"lib":"https://www.facebook.com/ads/library/?id=877639321440646"},{"img":"media/a5f794311f0d7c13.jpg","days":314,"start":"2025-12-29","page":"Prime Prometics","domain":"primeprometics.com","head":"Foundation You’ve Sought, Made Real.","body":"😶THEY SAID THIS FOUNDATION COULDN’T BE DONE 😶 So we did it! The ultimate second-skin effect for women over 50. Solves every challenge that’s kept you away from foundations. ❤️ Buil","video":true,"lib":"https://www.facebook.com/ads/library/?id=593764237127939"}],"photo":"media/9fae9b7bc570df28.jpg","lead":"<p><strong>Verdict: #1 of 20.</strong> Every layer we measure points the same way. This is a young market that is still growing fast, and the money in it already goes mostly to brands that did not exist on Amazon a year ago. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A foundation, usually a stick or a light liquid, that comes out of the tube in one neutral shade and \"adapts\" to the skin tone as it is blended. The pitch on every leading listing is the same: <em>one shade for everyone, made for mature skin</em>. Luxe sells it as \"for Mature Skin\", Prime Prometics as \"for Mature Women\", Prime Prometics' oldest live Meta ads say \"Color-Changing Foundation For 50+ Skin\". The buyer is a woman over 50 who is tired of shade-matching and of foundation settling into lines. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (listing titles and ad texts)</p><p>Typical price on Amazon: $21.99 median, half of all listings between $16.99 and $26.99. The three new leaders sell above that: Luxe at $27, Prime Prometics at $44, Smooche at $49. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> The first five pages of Amazon search for \"color changing foundation\" show at least <strong>322,950 purchases a month</strong> (sum of the \"bought in past month\" badges). At the listing prices that is at least <strong>$10.0 million a month</strong> on these five pages alone. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money (the badge is a floor and counts buyers, not units; discounts and multi-packs are ignored).</p><p><strong>Trend.</strong> US Google searches for \"color changing foundation\" over the last 12 weeks are <strong>4.7 times</strong> what they were in the same weeks a year ago, after correcting for a Google-wide spike in spring 2026. Yearly averages tell the same story: 0.6 → 0.8 → 2.4 → 5.3 → 26.7 (index, 2021-22 to 2025-26). The category went from almost nothing to a mass product in about 18 months. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (pull 1 of 3; the chart shows pulls 1-2)</p><blockquote>Chart: 5-year weekly search curve. The spike in April-June 2026 appears on control terms (shampoo, body lotion) in the same weeks, so it is a Google data artifact, not demand.</blockquote>"},{"h":"Who holds the market","kind":"shelf","html":"<p><span class=\"tier t1\" title=\"counted by a platform\">◆</span> (age of a brand = its oldest listing in the sample, dated from the ASIN; error about ±1-2 months)</p><p>By age of the seller (brand or unbranded listing), <strong>236,200 units a month go to sellers that are 6-12 months old</strong> and 69,400 to sellers under 6 months. Sellers older than two years take 12,100. This is the youngest shelf of all 20 categories. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>The leaders:</p><p><span class=\"tier t1\" title=\"counted by a platform\">◆</span> units and prices, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> months (ASIN dating) and revenue.</p><p>Note the ratings: 3.4-4.0 stars for the leaders. Buyers are not delighted; they are buying the promise. That is both a risk (returns, reviews) and an opening for a product that delivers better on the same promise. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>Yes, and this is the strongest case of the 20. <strong>Three brands under 24 months old sell 1,000+ a month each</strong>, and 23 unbranded listings do too. The unbranded part (90,050 units) is where the price war is: sellers like Facelove, LATORICE and MilkySeoul each sell about 10,000 a month at $29-45, without a known brand name. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>What this means for us: the brand route (own name, own store, Meta ads, Amazon as a second channel) is proven three times in 10 months. The cheap-Amazon route is crowded with unbranded sellers already. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta Ad Library, US, active ads containing the exact phrase \"color changing foundation\" (counts by Meta, 2026-11-07): <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>The largest ad market of all 20 categories. Most ads are short tests; the ones that survive belong to a few shops. In our sample, 9 of 13 shops have at least one ad running 90+ days; the oldest are magnixa.com (481 days), primeprometics.com (470) and trylumineskin.com (367). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>Brand by brand, counted on each brand's own Facebook Page: <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><div class=tbl><table><thead><tr><th>Brand</th><th>Active ads</th><th>90+ days</th><th>180+ days</th><th>Note</th></tr></thead><tbody><tr><td>Smooche</td><td>6,800</td><td>760</td><td>540</td><td></td></tr><tr><td>Prime Prometics</td><td>3,000</td><td>660</td><td>340</td><td>also runs ads from persona pages (\"Makeup Hacks for Mature Women\")</td></tr><tr><td>Luxe</td><td>2,604</td><td>78</td><td>7</td><td>rotates creatives fast; Amazon is its main channel</td></tr><tr><td>Lumine Skin</td><td>—</td><td>—</td><td>—</td><td>no Page of its own found; 12 of 23 ads with its name land on its site</td></tr></tbody></table></div><p>Hundreds of ads alive for half a year mean money keeps going into ads that pay back. Two of the three Amazon leaders also run this kind of evergreen Meta spend: the strongest sign we have that the product sells profitably on both channels. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p>Store reviews do not show the growth that search shows. <strong>Prime Prometics</strong>, the second-largest store brand: its foundation got 687 reviews in Aug-Oct 2026 vs 690 a year earlier, and has drifted from about 330 a month in spring to 199 in October. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> <strong>Smooche</strong>: photo reviews ran at 1,000-2,650 a month in Apr-Aug 2026 and then almost stopped in Sep-Oct; more likely a change in how the store asks for reviews than a sales collapse. <span class=\"tier t3\" title=\"disputed\">◇</span> Luxe's store feed has months-long gaps and is not used.</p><p>Reading: the growth in search is going to Amazon and to new brands, not to the incumbent stores. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>The oldest live ads (471 days, Prime Prometics) open with \"Color-Changing Foundation For 50+ Skin — Tired of…\". The angle is age plus frustration with ordinary foundation, not beauty in general. Smooche's 404-day ads lead with an offer (\"BUY 1, GET 1 FREE\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (<code>work/ads/longrunning_v2.json</code>, images saved)</p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Quality gap.</strong> Leader ratings of 3.4-4.0 suggest a lot of disappointed buyers; returns and reviews may hurt a newcomer as fast as they help. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>The peak may be near.</strong> Search grew ×4.7 in a year; such curves often flatten. Watch pulls 2-3 and the next months. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Brand-age dating is estimated</strong> from ASINs, not from \"Date First Available\" (not collected). <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Advertising cost</strong> is unknown; 12,000 active ads mean a crowded auction. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p><strong>#1.</strong> Pre-registered kill rules: demand is not falling (×4.66), new brands take 211,800 units/mo with many shops keeping 90+ day ads. It would drop if search interest fell below ×0.8 of last year, or if the new-brand share collapsed in a later scan.</p>"},{"h":"Metho ot dated, after the method already mistook RevitaLash for a new brand. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"The product, size and trend","kind":"trend","html":"<p>A serum brushed on the lash line to make lashes look longer and fuller. Listings split into \"prostaglandin-free\" peptide serums (ForChics, EPAIS) and castor-oil ones (UpNature, unbranded). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> At least <strong>213,450 purchases a month</strong> on five Amazon pages (US, collected by hand), about <strong>$7.0 million a month</strong>; median price $26.98 (half between $17.99 and $44.00). Search for \"lash serum\" ×1.17 versus a year ago: <strong>flat</strong>, close to the growing line. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count/price/trend, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p>Grande Cosmetics alone: 52,000/mo, ~$1.8M. Young brands above 1,000/mo include NUNA (8,000/mo at $42.99, ~20 months) and UpNature (6,000 at $9.97, ~22 months). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> ages (ASIN-estimated; RevitaLash, Olaplex and Dr.Althea were moved to \"older brands\" by hand).</p>"},{"h":"Ads","kind":"ads","html":"<p>Meta, exact phrase \"lash serum\": 3,200 active; 1,100 (34%) 30+ days, 400 (12%) 90+, 90 (3%) 180+. 17 of 24 shops keep a 90+ day ad; oldest borboleta.com (725 days), moxielash.com (349). Brand Pages not counted yet. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Risks","kind":"text","html":"<ul><li><strong>Regulation.</strong> In the US a product claiming to <em>grow</em> lashes is treated as a drug; prostaglandin-type ingredients carry side-effect warnings. A cosmetic route exists (\"longer-looking\"), but claims and ingredients must be reviewed. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> (our flag \"COMPLIANCE\": the route exists, it costs money)</li><li><strong>Two-thirds of the shelf is old brands</strong>, Grande at the top for years. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Brand ages unverified</strong>: \"Date First Available\" could not be collected. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p>Challenger. It enters the top 5 if (1) a compliance review shows a cheap cosmetic route, and (2) dated listings confirm the young brands are really young.</p>"},{"h":"Sources","kind":"sources","html":"<p>Amazon <code>eyelash growth serum</code>, ZIP 10001, collected by hand → <code>work/blind/amazon_manual/amazon_search_us.csv</code> → <code>graveyard_us/lash_serum.json</code>. Meta <a href=\"https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=US&amp;q=%22lash%20serum%22&amp;search_type=keyword_exact_phrase&amp;media_type=all\" target=\"_blank\" rel=\"noopener\">exact phrase \"lash serum\"</a>. Trends <a href=\"https://trends.google.com/trends/explore?date=today%205-y&amp;geo=US&amp;q=lash%20serum\" target=\"_blank\" rel=\"noopener\">\"lash serum\"</a>.</p>"}],"m":{"A1":1.17,"A1_terms":"lash serum","A1_pulls":2,"A1_zero_share":0,"A2":213450,"A2_source":"manual (AMAZON_TASK.md)","flags":["Amazon data collected by hand, not re-verified"],"B1":0.164,"B1_n":55,"B2_1k":9,"B2_300":17,"B3_hhi":775,"B3_top3":0.35,"D1_unbranded_1k":3,"B4_shops":[{"domain":"borboleta.com","active":210,"aged90":98}],"B6":"Hanae (domain Nov 2025; 5,500/mo on Amazon)","B6_none":null,"D2":"stable","D2_note":"flat, discount cycles"},"kill":"","note":""},{"pid":"tallow_balm","slug":"tallow-balm","rank":4,"status":"top5","title":"Beef tallow balm","short":"Tallow balm",  shops keep Meta ads running for 300-700 days. What holds it back is demand: after four years of steep growth, searches are flat. Entering now means fighting for share in a market that has stopped expanding. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A face and body balm made from rendered grass-fed beef fat, often whipped with honey or essential oils. It sells on \"ancestral\", \"clean\", \"one ingredient\" skincare: Ancestral Cosmetics' oldest ad opens with \"I made a face cream from BEEF FAT\". Buyers are people who distrust conventional skincare, men included (Forge Skin sells \"for Men\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (listings, ads)</p><p>Price: $16.95 median on Amazon (half between $9.99 and $22.99); Terra Lotus $19.99, Hearth &amp; Homestead $29.97, Forge $39.95. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> At least <strong>122,850 purchases a month</strong> on five Amazon pages, about <strong>$2.8 million a month</strong>. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p><p><strong>Trend.</strong> ×1.05 versus a year ago (control-corrected): <strong>flat</strong>. The yearly index shows why it looked so good before: 0.9 → 3.3 → 8.3 → 21.2 → 35.3 — four years of steep growth that has now levelled off. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (one pull of three)</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p>Most units go to sellers <strong>12-24 months old</strong> (55,350/mo): the wave of 2025 entrants is now the core of the shelf. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p><span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> ages and revenue.</p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>Yes: 9 young brands above 1,000/mo, plus 8 unbranded listings. The shelf is fragmented: the top three brands hold 41% of units (the lowest concentration among our top 5). Room for one more brand, but the newest cohort (under 6 months) takes only 2,650 units/mo: the door was wider in 2025 than it is now. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> counts, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> reading.</p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta, US, active, exact phrase \"tallow balm\": <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>16 of 19 shops in the sample have an ad 90+ days old. The oldest: Hibi Youth Skincare (703 days), ancestralcosmetics.com (348), byminus.com (310), bare-ritual.com (301). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>On each brand's own Page: <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><div class=tbl><table><thead><tr><th>Brand</th><th>Active</th><th>90+ days</th><th>180+ days</th><th>Reading</th></tr></thead><tbody><tr><td>byminus</td><td>150</td><td>38</td><td>17</td><td>evergreen</td></tr><tr><td>Ancestral Cosmetics</td><td>130</td><td>77</td><td>55</td><td>most evergreen: 42% of its ads live 180+ days</td></tr><tr><td>Terra Lotus</td><td>130</td><td>0</td><td>0</td><td>Amazon leader, only now testing Meta</td></tr><tr><td>Bare Ritual</td><td>77</td><td>43</td><td>21</td><td>evergreen</td></tr><tr><td>Forge</td><td>74</td><td>4</td><td>0</td><td>rotates fast</td></tr></tbody></table></div><p>Two different winning models are visible: Terra Lotus wins on Amazon without Meta; Ancestral, Bare Ritual and byminus win on their own stores with small but very long-lived ad sets. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p>The leaders move in different directions. <strong>Terra Lotus</strong>, a new brand, ramped from about 40 reviews a month in spring 2026 to about 1,350 in August, then fell to 488 in September and 336 in October; 43% of its September reviews are below five stars (26% all-time). <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> <strong>Ancestral</strong>, the older store leader, is flat year on year at 300-600 a month. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> <strong>Forge</strong> started collecting in June 2026 (93 in Aug-Oct). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> <strong>Wild Gold</strong> peaked in late 2025 and faded (9 vs 53). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>This matches flat search (×1.04): new brands still get in, but the market as a whole is not growing. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>Ancestral: \"I made a face cream from BEEF FAT\" (349 days), \"Handmade tallow products\" (341 days). Bare Ritual: \"Someone asked if I got BOTOX. I didn't.\" (263 days). Founder story and shock-value honesty, not clinical claims. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Growth has stopped</strong> (×1.05) after a 4-year boom; late entrants fight for share. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Low price floor</strong>: unbranded tallow at $9.99-19.99. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Perishability and smell</strong> (animal fat): shelf life and complaints. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Forge is not a new brand</strong >lilyeve</strong> (14,000/mo, ~$0.43M/mo). <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"Ads","kind":"ads","html":"<p>Meta, exact phrase \"hair growth serum\": 3,000 active; 1,200 (40%) 30+ days, 220 (7%) 90+, 53 (2%) 180+. 20 of 25 shops keep a 90+ day ad; oldest are a seller page named \"gardenpurejoy…\" (644 days), jcsmiracleproducts.com (543), the Marée page (348), officialbodywise.com (345). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Risks","kind":"text","html":"<ul><li><strong>Overlap with rosemary oil</strong>, whose search interest is falling (×0.76): part of this shelf may shrink. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Regulation</strong>: \"hair growth\" is a drug claim in the US (minoxidil is the approved drug); cosmetic wording must be \"thicker-looking\". <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Three-quarters of the shelf is old brands.</strong> <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Brand ages unverified.</strong> <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p>Challenger. It enters the top 5 if a compliance review finds a cheap cosmetic route, dated listings confirm the young brands, and its demand holds up separately from rosemary.</p>"},{"h":"Sources","kind":"sources","html":"<p>Amazon <code>hair growth serum</code>, ZIP 10001, collected by hand → <code>graveyard_us/hair_serum.json</code>. Meta <a href=\"https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=US&amp;q=%22hair%20growth%20serum%22&amp;search_type=keyword_exact_phrase&amp;media_type=all\" target=\"_blank\" rel=\"noopener\">exact phrase \"hair growth serum\"</a>. Trends <a href=\"https://trends.google.com/trends/explore?date=today%205-y&amp;geo=US&amp;q=hair%20growth%20 at a new brand can take a mature shelf. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span> (see below)</p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A body oil sold not for softness but against <strong>crepey skin</strong>: thin, wrinkled skin on arms, legs and chest that comes with age. GODA's listing reads \"Silk Body Oil Women - Firming Anti Aging\". The buyer is a woman 45+ who already uses a moisturizer and wants something that \"firms\". <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (listing titles)</p><p>Price: $19.47 median on Amazon (half between $12.99 and $28.25); GODA sells at $31.49, OSEA at $52. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> At least <strong>196,800 purchases a month</strong> on the first five Amazon search pages, about <strong>$4.0 million a month</strong> at listing prices. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p><p><strong>Trend.</strong> Searches for \"crepey skin\" are flat: ×1.02 versus a year ago after correcting for the spring-2026 Google artifact. The yearly index has moved sideways for five years (50 → 58 → 43 → 58 → 69). This is a steady need, not a fad. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (one pull of three)</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p><span class=\"tier t1\" title=\"counted by a platform\">◆</span> (brand age from ASINs, ±1-2 months)</p><p>Leaders by revenue (floor units × listing price): <strong>GODA ~$0.63M/mo</strong>, Palmer's ~$0.61M, OSEA ~$0.56M, Neutrogena ~$0.47M. GODA sells 20,000 a month from two listings, entered Amazon about 18 months ago, rated 4.3. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> revenue and age.</p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>Hard, but proven. Three brands under 24 months sell 1,000+ a month; GODA is by far the largest. Unlike color foundation, there is almost no unbranded price war here (4,900 units): buyers choose brands. A newcomer has to look and feel like a brand from day one. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta Ad Library, US, active, exact phrase \"crepey skin\" (this phrase also catches cream ads): <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>A big ad market. 22 of 26 shops in our sample keep at least one ad 90+ days; the oldest are thehealthcarpenter.com (439 days) and try-turmskin.com (323 days, 19 ads in the sample). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p><strong>How GODA advertises.</strong> Only 140 active ads run from GODA's own Page, none older than 180 days. But <strong>24 of 30 ads</strong> that mention \"Goda Silk\" land on goda.co, and they come from creator pages (\"Over 40 &amp; Fabulous\", \"Natasha Knows Scents\"). GODA's ad engine is creators, not its own Page. Its oldest live ad (262 days) is a creator post: \"2 Drops That Will Change Your Life!\" <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>DRMTLGY, the other brand we counted: 1,200 active ads, 200 alive 90+ days, 36 alive 180+. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p><strong>GODA</strong>, the newcomer that broke through, shows it in its own store too: photo reviews in Aug-Oct 2026 are about five times the same months of 2025, and October 2026 is its best month in the sample. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> (photo reviews only, read from a 20% sample)</p><p><strong>DRMTLGY</strong>'s store-wide reviews fell to about a quarter of last year, but body oil is a small part of what it sells, so this says little about the category. <span class=\"tier t3\" title=\"disputed\">◇</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>Short emotional hooks from real-looking women 40+, often filmed by creators, promising visible change from a small amount (\"2 drops\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (<code>work/ads/longrunning_v2.json</code>)</p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Flat demand.</strong> Growth must come from taking share, not from a rising market. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Creator dependence.</strong> GODA's model needs a stream of creators; we see the ads, not the cost. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>The Meta phrase is wide</strong> (\"crepey skin\" includes creams), so category ad counts overstate the oil-only market. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Big old brands at low prices</strong> (Palmer's $13.99, Aveeno $9.58) cap what a newcomer can charge on Amazon. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p><strong>#2.</strong> Not falling (×1.02); new brands take 26,600 units/mo; many shops with 90+ day ads. It would drop if search fell below ×0.8 or if GODA's share proved to be a one-off (watch its review curve).</p>"},{"h":"Methods and sources","kind":"sources","html":"<ul><li>Amazon: <code>body oil for crepey skin</code>, ZIP 10001, pages 1-5 → <code>work/blind/graveyard_us/body_oil.json</code>.</li><li>Meta: <a href=\"https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=US&amp;q=%22crepey%20skin%22&amp;search_type=keyword_exact_phrase ,["2026-09",341,false],["2026-10",268,false]],"growth":2.01}]},"creatives":[{"img":"media/86e92b9bd2ce9753.jpg","days":517,"start":"2025-06-09","page":"Mirai Clinical","domain":"miraiclinical.com","head":"Say Goodbye to ‘Old People Smell’ for Good","body":"Did you know that during menopause, your skin starts producing a compound called Nonenal, and normal soap can’t wash it away? 😳 That subtle \"old people smell\" isn’t about hygiene… ","video":true,"lib":"https://www.facebook.com/ads/library/?id=737280825391743"},{"img":"media/4dfa6e2922de0cfe.jpg","days":321,"start":"2025-12-22","page":"Mirai Clinical","domain":"miraiclinical.com","head":"Buy 3, Get 2 Free 🤩","body":"Did you know that during menopause, your skin starts producing a compound called Nonenal, and normal soap can’t wash it away? 😳 That subtle \"old people smell\" isn’t about hygiene… ","video":false,"lib":"https://www.facebook.com/ads/library/?id=1589878905502289"},{"img":"media/78c4bc932f710b9a.jpg","days":233,"start":"2026-03-20","page":"Grandma's Care Journal","domain":"try-kaori.com","head":"","body":"I've taught over 600 children how to read. I still remember most of their names. Then one September, they replaced me with a teacher half my age. Everyone knew the reason except me","video":false,"lib":"https://www.facebook.com/ads/library/?id=2330372864056320"},{"img":"media/042a2297c820e30e.jpg","days":233,"start":"2026-03-20","page":"Grandma's Care Journal","domain":"try-kaori.com","head":"","body":"My grandson was at my house every afternoon. He was everything to me. Then one day he was gone. His name is Jack. His mom dropped him off on her way to work and I'd hear the backpa","video":false,"lib":"https://www.facebook.com/ads/library/?id=949368220884779"},{"img":"media/02219d70cd27e1e4.jpg","days":219,"start":"2026-04-03","page":"Grandma's Glow","domain":"try-kaori.com","head":"","body":"My grandson shoved me out of his life after a year of college. He was everything to me. I didn't know why until it was almost too late. I changed that boy's diapers. I taught him h","video":false,"lib":"https://www.facebook.com/ads/library/?id=1159318819556156"},{"img":"media/6c980417884c3884.jpg","days":185,"start":"2026-05-07","page":"Mirai Clinical","domain":"miraiclinical.com","head":"","body":"How are you finding your Japanese Persimmon Soap? Smelling fresher? 🧼 Get 15% off our Persimmon Soap Trio set and discover our other scents! Discover your favorite scent and smell ","video":false,"lib":"https://www.facebook.com/ads/library/?id=1507196367435098"}],"photo":"media/827e0fbeb390bb49.jpg","lead":"<p><strong>Verdict: #5 of 20, with reservations.</strong> Search interest is up ×4.6 in a year, the strongest growth after color foundation, and new brands are testing hard on Meta. But the market is small ($1.2M a month on five Amazon pages), cheap ($13 median), and so far the growth mostly feeds one older brand, Mirai Clinical, and unbranded sellers. It stays in the top 5 because of the trend; it is the most fragile of the five. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A Japanese-style soap bar with persimmon tannin, sold against <strong>\"old people smell\"</strong> (nonenal body odor that comes with age). Listings say it openly: \"Persimmon Soap for Old People Smell\", \"Body Odor Control\". Buyers: people 50+, and their adult children buying for them. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (listing titles)</p><p>Price: $12.99 median (half between $9.99 and $17.99); Mirai Clinical $19.95, Kakiyu $29.99 (2-pack). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> At least <strong>69,550 purchases a month</strong> on five Amazon pages, about <strong>$1.2 million a month</strong>: the smallest market in our top 5. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p><p><strong>Trend.</strong> ×4.6 versus a year ago (control-corrected). Yearly index 0.2 → 0.7 → 1.8 → 6.4 → 45.3. Unlike most terms, it has its own peak in October 2026, separate from the spring Google artifact, so the growth is real. Note: 13% of the last two years' weeks are zero (low volume), so single pulls are noisy. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (one pull of three)</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p><strong>Mirai Clinical</strong> alone: 25,300 units/mo, ~70 months on Amazon, $19.95, ~$0.63M/mo. Unbranded sellers (yoniagood 10,000/mo at $9.99, NXPPYY 8,000 at $7.99) take ~$0.48M. The new brands are tiny on Amazon: Kaori 1,950/mo, Kakiyu 1,300, Morovan 1,100. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> revenue and ages.</p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>On Amazon, barely so far: three young brands just above 1,000/mo, while cheap multi-packs set the price. The real question is whether the new brands' Meta-driven stores are working (section 5). <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta, US, active, exact phrase \"persimmon soap\": <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>Many fresh tests, few survivors: only 5% of active ads are 90+ days old, the lowest of our top 5. Ads die fast here. 7 of 10 shops in the sample have a 90+ day ad: miraiclinical.com (492 days), the persona page \"Grandma's Glow\" (206), try-kaori.com (173). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>On each brand's own Page: Kaori 198 active / 48 at 90+ / 4 at 180+; Mirai Clinical 96 / 19 / 17; <strong>Kakiyu 470 / 0 / 0</strong>: a 2-month-old brand testing hard. Kaori and Kakiyu also run ads through persona pages (\"Grandma's Care Journal\", \"Mari Tanaka\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p><strong>Mirai Clinical</strong>, the store leader: 947 reviews in Aug-Oct 2026 vs 471 a year earlier, ×2.0, climbing steadily since early 2025. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> Kaori, the other leader, has no review widget we can read. The store curve agrees with the search growth. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>Mirai's 517-day ad: \"Say Goodbye to 'Old People Smell' for Good\". Kaori's ads run from grandmother persona pages. The angle is shame and family, aimed at the user's children as much as at the user. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> ads, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> reading.</p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Small pie, low price</strong>: a $13 soap needs many orders to pay for ads. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Ads die fast</strong> (5% at 90+ days): many testers, few profitable. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Noisy trend</strong> (low search volume). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Sensitive topic</strong> (age, smell): ad review and tone risk. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p><strong>#5.</strong> Growing (×4.6); kill rule (b) passes only because shops keep 90+ day ads, as new-brand units (7 .com","head":"","body":"Why I'm Obsessed With This Scent Diffuser Brand: ✨ Elevated, Aesthetic Design 🏠 Clean Home Fragrances 💖 Scents Inspired By Luxury Hotels 💚 Sephora-Clean \"Best scent diffuser?\" 30 d","video":false,"lib":"https://www.facebook.com/ads/library/?id=1448928159721186"}],"photo":"media/1074a347e83c41d6.jpg","lead":"<p><strong>Verdict: #3 of 20.</strong> The most expensive product on our list ($64 median), with search interest doubling in a year. On Amazon it is split between a few brands and many unbranded sellers; on Meta a handful of home-fragrance brands keep the same ads running for months and years. The opportunity is a brand with its own store, not another Amazon listing. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A plug-in or cordless device that turns fragrance oil into a dry cold-air mist, no water. Sold as \"hotel scent at home\": Hotel Collection, Aroma360 and Scentify all sell the device plus refill oils. The buyer is a homeowner who wants the house to smell like a hotel lobby, and keeps buying oils. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> product form (listings); <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> the device-plus-refills model of Hotel Collection, Aroma360 and Scentify (their stores and ads)</p><p>Price: $64.49 median on Amazon, half between $39.99 and $89.99; AirScent's leading listing is $99.99. The refills make it a repeat purchase. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> repeat.</p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> At least <strong>58,000 purchases a month</strong> on five Amazon pages, about <strong>$4.1 million a month</strong>, because of the high price. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p><p><strong>Trend.</strong> Searches for \"waterless diffuser\" are <strong>×2.0</strong> versus a year ago (control-corrected); yearly index 0.8 → 2.4 → 5.6 → 9.1 → 34.5. Steady growth for four years, not a single spike. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (one pull of three)</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p>Leaders: Airversa (34 months, 11,400/mo, $39.99), <strong>AirScent</strong> (~23 months, 11,100/mo, $99.99, ~$1.1M/mo), ANZ/ScentBots (~13 months, 3,700/mo at $19.98), FEPPO (~9 months, 1,100/mo at $65.99). Unbranded sellers take ~$1.8M/mo together. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> ages and revenue.</p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>On Amazon: four brands under 24 months sell 1,000+ a month, but the unbranded half (NoxLumina at $89.99 with 4,000/mo, many at $20-80) pushes prices down. A newcomer on Amazon competes on price. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p><p>Off Amazon the picture is different (section 5): the brands that matter in this category are store brands that barely sell on Amazon. AirScent, the Amazon leader, runs only <strong>4</strong> Meta ads. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta, US, active, exact phrase \"scent diffuser\": <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>A small ad market by count, but with a high share of long-lived ads: when an ad works here, it keeps running. 11 of 13 shops in the sample have an ad 90+ days old; <strong>scentifyhome.com's oldest live ad is 795 days old</strong> (over two years). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>On each brand's own Page: <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><div class=tbl><table><thead><tr><th>Brand</th><th>Active</th><th>90+ days</th><th>180+ days</th></tr></thead><tbody><tr><td>Hotel Collection</td><td>563</td><td>158</td><td>5</td></tr><tr><td>Aroma360</td><td>370</td><td>77</td><td>0</td></tr><tr><td>Scentify</td><td>320</td><td>100</td><td>89</td></tr><tr><td>Aura House</td><td>212</td><td>22</td><td>3</td></tr><tr><td>AirScent</td><td>4</td><td>0</td><td>0</td></tr></tbody></table></div>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p>Three stores, all up. <strong>Scentify</strong>: 245 reviews in Aug-Oct 2026 vs 123 a year earlier, ×2.0; October 2026 is its best month on record. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> <strong>Aura House</strong>: ×2.7 store-wide; the diffuser itself went from 26 reviews in Oct 2025 to 139 in Oct 2026. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> Its Aug-Sep 2026 show only about 20 a month, which looks like paused review requests. <span class=\"tier t3\" title=\"disputed\">◇</span> <strong>Aroma360</strong>: ×1.4, but October is lifted by a free-diffuser promotion; August-September alone were below last year. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p><p>Together with search (×2.0), this is the best-confirmed growth of all 20 categories. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>Scentify's ads that have run for 796-899 days sell the device with a free scent (\"Get a FREE Scent with Your V2 Diffuser\"). Aura House's 201-day ad: \"Best scent diffuser? · 30 days supply left.\" The offer is the device plus the first oil; the business is the refills. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> ads, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> business model.</p>"},{"h":"Risks and open questions","kind":"text","html":"<ul> re?date=today%205-y&amp;geo=US&amp;q=magnesium%20spray\" target=\"_blank\" rel=\"noopener\">\"magnesium spray\"</a>. Method: <code>/RUNBOOK.md</code> v2.1.</p>"}],"m":{"A1":0.95,"A1_terms":"magnesium spray","A1_pulls":2,"A1_zero_share":0,"A2":60250,"A2_source":"automated scan","flags":[],"B1":0.026,"B1_n":76,"B2_1k":2,"B2_300":6,"B3_hhi":1031,"B3_top3":0.49,"D1_unbranded_1k":2,"B4_shops":[],"B6":null,"B6_none":null,"D2":null,"D2_note":"not measured"},"kill":"","note":""}],"intro":"<p>We measured 20 product categories the same way and asked one question: <strong>is there room for a new brand right now?</strong></p><p>Three independent signals, each read from the platform itself:</p><ol><li><strong>Amazon:</strong> how many people bought in the last month, and how much of it went to brands that are less than two years old. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Meta ads:</strong> how many ads are running, and how many have been kept alive for 1, 3 and 6 months. Advertisers stop ads that lose money, so an ad that is still running after months is a sign it pays back. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Google searches:</strong> is interest growing, flat or falling compared with a year ago. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li></ol>","methods":{"lead":"<p>Method v2.1, frozen in <code>/RUNBOOK.md</code>. Rules were written before results were read; every change is a version bump with the reason logged.</p>","secs":[{"h":"Amazon: who sells, and how new are they","html":"<ul><li><strong>What:</strong> amazon.com search results, pages 1-5, for one query per category, delivery address set to New York 10001. Sponsored cards are skipped. 16 categories were read by our script; 4 (lash serum, hair serum, pre-wash oil, whitening powder) by hand by the owner's assistant after Amazon asked AI agents not to browse it.</li><li><strong>Units:</strong> the \"bought in past month\" badge. It is a <strong>floor</strong> (\"1K+\" = at least 1,000) and counts <strong>buyers, not units</strong>; the true number is higher. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> Amazon's own count.</li><li><strong>Category:</strong> a strict description of the product form (e.g. a neck cream must be sold <em>for the neck</em>), so other products don't leak in.</li><li><strong>Brand age:</strong> the oldest listing of a brand in the sample, dated from its Amazon product code (ASIN); codes are issued in order, error about ±1-2 months. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>New brand:</strong> on Amazon less than 24 months, and not an established brand entering a new product (L'Oréal, Palmer's, RevitaLash…).</li><li><strong>Unbranded seller:</strong> a listing whose title does not start with a brand name. 22 of 72 top listings we checked by hand do have a registered brand that isn't in the title (LATORICE, NXPPYY…); they behave like unbranded sellers (price-led), and are counted as such.</li><li><strong>Revenue floor:</strong> units × listing price. Ignores discounts and multi-packs. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Meta ads: who keeps paying","html":"<ul><li><strong>What:</strong> Meta Ad Library, United States, active ads containing the exact phrase (e.g. \"tallow balm\"). The counts are Meta's own (shown as \"~N results\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Ad age:</strong> the same search with \"started before\" today minus 30 / 90 / 180 days.</li><li><strong>Shops:</strong> a sample of ads drawn evenly from each age window, grouped by the shop they link to. Because the sample is drawn by age, almost every category shows some shop with a 90+ day ad; read the counts, not just \"yes/no\".</li><li><strong>Brands:</strong> counted on the brand's own Facebook Page, plus the share of ads mentioning the brand that link to its site (brands like GODA advertise mostly through creators' pages).</li><li><strong>Limits:</strong> the US library shows only ads running today; stopped ads vanish. A re-check in 30 days (<code>meta_recheck.py</code>) will show which of today's ads died. An old ad can also be a forgotten low-budget ad or brand advertising; we weigh small direct-to-consumer brands more than large ones.</li></ul>"},{"h":"Google searches: is interest growing","html":"<ul><li><strong>What:</strong> Google Trends, United States, 5 years, weekly. Growth = last 12 full weeks divided by the same weeks a year earlier.</li><li><strong>Correction:</strong> in April-June 2026 every term, including \"shampoo\" and \"body lotion\", spikes in the same weeks: a Google data artifact. Each term's growth is divided by the controls' growth (1.14 in pull 1).</li><li><strong>Labels:</strong> ≥1.2 growing, 0.8-1.2 flat, &lt;0.8 falling (drop rule).</li><li><strong>Noise:</strong> Google returns a random sample each day; rare terms are noisy (we flag terms with many zero weeks). Three pulls on three days are averaged; pulls 1-2 are in (2026-11-08 and 11-09), pull 3 is due 2026-11-10.</li></ul>"},{"h":"Drop rules (decided before results)","html":"<p>A category is dropped if (a) searches fall below 0.8 of last year, or (b) new brands sell under 10,000 a month on Amazon <strong>and</strong> no shop keeps a Meta ad 90+ days.</p>"},{"h":"Not measured","html":"<p>Website traffic (estimators are unreliable for shops of this size: Similarweb itself shows nothing under 5,000 visits a month and is confident only above 100,000), review growth over time (pending), margins and product costs, TikTok Shop live sales.</p>"},{"h":"Data files","html":"<p><code>work/dossier/dossier_data.json</code> (all layers), <code>digest/&lt;id&gt;.json</code> (per page), <code>chart_data.json</code> (charts), <code>verdict_v21.json</code> / <code>FINAL_V21.md</code> (verdict table). Scripts: <code>work/blind/graveyard_*.py</code>, <code>meta_*.py</code>, <code>trends_calc.py</code>, <code>work/dossier/build_dossier.py</code>, <code>digest.py</code>, <code>verdict_v21.py</code>.</p>"},{"h":"Store reviews: are the winners still growing","html":"<ul><li><strong>What:</strong> each leader store's public review feed (Judge.me, Okendo, Yotpo, Stamped, Junip, Loox), counted per month back to mid-2024. A review is a share of orders, so growth in reviews tracks growth in orders. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Exact or estimated:</strong> Okendo, Yotpo, Stamped and Junip give every review with its date: exact. Judge.me gives the latest 1,000 exactly; older months are estimated from the 1-4 star reviews, which go further back, times the store's overall star mix (dashed on the charts). Loox hides dates; photo reviews carry their date in the image address, so for Loox stores we count photo reviews only, from a 20% sample (dashed).</li><li><strong>Limits:</strong> stores turn 3-10% of orders into reviews, so review counts can't be compared between stores, only month to month within one store. A store that changes how it asks for reviews breaks its own curve (Smooche, Aura House in Aug-Sep 2026). Some feeds hide low ratings (Stamped).</li></ul>"}]},"ru":{"name":{"dog_fountain":"Поилка-фонтан для питомцев","color_foundation":"Тональный крем, меняющий цвет","lash_serum":"Сыворотка для ресниц","tallow_balm":"Бальзам на говяжьем жире","shower_filter":"Душевая лейка с фильтром","hair_serum":"Сыворотка для роста волос","body_oil":"Масло для тела от дряблости","persimmon_soap":"Мыло с хурмой","compression_socks":"Компрессионные носки","pore_patch":"Патчи для пор носа","rosemary_oil":"Розмариновое масло для волос","prewash_oil":"Масло для волос до мытья","whitening_powder":"Отбеливающий порошок для зубов","turmeric_soap":"Мыло с куркумой","hair_removal_cream":"Мужской крем для депиляции","scent_diffuser":"Безводный аромадиффузор","neck_cream":"Крем для шеи","chin_wrap":"Маска-бандаж для подбородка","exfoliating_towel":"Отшелушивающее полотенце","magnesium_spray":"Магниевый спрей"},"verdict":{"dog_fountain":"Новички выживают здесь чаще всего: 28 из 104 продают 1 000+ в месяц. Но 26 из них — безымянные продавцы: это рынок копий, а не брендов.","color_foundation":"Единственный товар в обоих топах: спрос вырос в 4,5 раза, каждый четвёртый новичок продаёт 1 000+ в месяц. Но почти половина рынка у одного бренда (Luxe).","lash_serum":"Большой рынок без доминанта и с молодым победителем (Hanae, запущен в ноябре 2025). Только формула без простагландинов, иначе риск претензий FDA.","tallow_balm":"Больше всего выживших новичков (19) и самый раздробленный рынок. Но поисковый спрос остывает.","shower_filter":"Спокойный рынок: спрос ровный, цены ровные, никто не доминирует. Пробивается каждый восьмой новичок.","hair_serum":"Лучшая доля выживших новичков (28%), но данные Amazon собраны вручную и пересекаются с розмариновым маслом. Нужна перепроверка.","body_oil":"На старой полке пробился один новичок, GODA. Спрос ровный. В замер попали все масла для тела, не только от дряблости.","persimmon_soap":"Самый быстрый рост спроса (в 4,7 раза), но рынок маленький и плотный: пробивается каждый десятый.","compression_socks":"В Meta много рекламы, но на Amazon новичков мало (15 в выборке), а полка недосчитана.","pore_patch":"Полку держит Bioré: у трёх лидеров 81%. Выборка маленькая, поисковый запрос слишком редкий.","rosemary_oil":"Спрос падает (×0,76 за год). Рынок пересекается с сыворотками для волос.","prewash_oil":"Выглядит большим, но это полка старых брендов масел для волос. Поисковый запрос слишком редкий, чтобы читать тренд.","whitening_powder":"Самая маленькая полка из 20, и почти никто не держит рекламу дольше 90 дней.","turmeric_soap":"Спрос падает (×0,72), полку держат мыла с койевой кислотой (Valitic). Растёт один бренд — Earthly Derm в своём магазине.","hair_removal_cream":"Veet и Nair держат 93% полки. Места для новичка нет.","scent_diffuser":"Спрос растёт вдвое, магазины лидеров растут. Но на Amazon пробивается лишь каждый двенадцатый новичок.","neck_cream":"Полку держат старые бренды ухода, новички почти не пробиваются (7%).","chin_wrap":"Маленькая полка у старых брендов. Рекламу в Meta по этой фразе дают клиники, а не продавцы маски.","exfoliating_towel":"Поиск растёт, но полку держат Goshi и безымянные продавцы. Новички — 4%.","magnesium_spray":"Рынок держат старые wellness-бренды, новички почти отсутствуют (3%)."},"article":{"dog_fountain":{"claim":"Автор разбирает бренд Good Origins: фонтанчик из медицинской стали за $99 в собственном магазине, продажи через историю о здоровье почек и «AI-ветеринара» в рекламе. Оценка выручки — $104–185 тыс. в месяц.","reality":[["Спрос растёт","Поиск в Google +46% к прошлому году ◆. На Amazon покупают 220 тыс. штук в месяц — один из трёх самых больших рынков в списке ◆."],["Новички выживают","Из 104 продавцов, пришедших за последние 3–24 месяца, 28 продают 1 000+ в месяц: 27%, лучший результат среди 20 товаров ◈."],["Но выживают копии","26 из 28 выживших — безымянные продавцы. Брендов-новичков, которые пробились, почти нет ◆. Лидер — Veken (около 57 тыс. в месяц), старый бренд."],["Цены спокойные","За год цены топ-10 почти не менялись, только регулярные скидки. «Ценовой войны», о которой мы писали раньше, нет — вывод отозван ◈."],["Цена в видео выше рынка","Good Origins продаёт за $99, а средняя цена на Amazon — $39.99. Разница — это бренд и история, а не товар ◆."],["Реклама не измерена","Фраза «water fountain» в Meta находит садовые фонтаны, поэтому рекламу категории оценить нельзя. Good Origins по домену пока не проверяли."]],"take":"Лучший вход для продавца, который готов играть ценой и качеством на Amazon. Строить бренд здесь можно, как Good Origins, только через свой магазин и сильную историю: на Amazon бренды-новички почти не видны.","next":["Проверить Good Origins: возраст бизнеса, реклама по домену, отзывы магазина","Посчитать маржу при цене $25–40","Проверить возраст Veken и PETLIBRO"]},"color_foundation":{"claim":"Разбор магазина Hestia: тональный стик, который «подстраивается под тон кожи», для женщин старшего возраста. Оценка — $12,7–19,5 млн продаж. Автор клонирует страницу и запускает свой бренд с ИИ-аватаром в рекламе.","reality":[["Спрос взлетел","Поиск в Google вырос в 4,5 раза за год — второй результат среди 20 товаров ◆. На Amazon покупают 323 тыс. штук в месяц, это самый большой рынок в списке ◆."],["Новички выживают","Из 48 продавцов, пришедших за 3–24 месяца, 13 продают 1 000+ в месяц: 27% ◈. 10 из 13 — безымянные продавцы."],["Но рынок у одного бренда","Luxe продаёт около 150 тыс. в месяц — 46% полки. У трёх лидеров 65% ◆. По американскому стандарту это высокая концентрация."],["Лидеры не новые","Luxe собирает отзывы в своём магазине с 2021 года и называет себя «брендом на $30 млн». Smooche работает примерно с 2021-го, Prime Prometics — с 2020-го (Латвия). Новые у них только карточки на Amazon ◆."],["Магазины лидеров не растут","Отзывы на тональный крем Prime Prometics: 687 за август–октябрь против 690 год назад ◆. Рост спроса уходит на Amazon и к новым продавцам, а не в магазины старых брендов ◈."],["Цены: временный демпинг лидера","Luxe опускал цену до $13–17 вместо $40 с июля по октябрь, сейчас снова $28–30 ◈. Остальные держат $28–49. Войны нет, но лидер готов резать цену."]],"take":"Самый сильный товар по спросу и единственный в обоих топах. Новичку здесь место есть, но рядом с Luxe, который держит почти половину рынка и умеет резать цену. Заходить с отличием в формате или аудитории, а не копией Luxe.","next":["Маржа при цене $25–30","Реклама Smooche: 5 900 объявлений — на чём держится","Возраст бизнеса безымянных выживших"]},"lash_serum":{"claim":"Два разбора: магазин сыворотки для ресниц с оценкой $670 тыс. – $1,2 млн в месяц и ещё один — около $1 млн за 90 дней. Продают через ролики «до/после» с ресницами и ИИ-отзывы.","reality":[["Большой ровный рынок","На Amazon покупают 213 тыс. штук в месяц ◆. Поиск +17% к прошлому году — ровно ◆."],["Никто не доминирует","У трёх лидеров 35% полки — самый раздробленный рынок после бальзама ◆. Лидер Grande (52 тыс. в месяц) на Amazon 7+ лет."],["Молодой победитель есть","Hanae: домен зарегистрирован в ноябре 2025-го, а через пару месяцев — 5 500 продаж в месяц на Amazon ◆. Это лучший проверенный пример быстрого старта в списке."],["Новички выживают","Из 55 новых продавцов 9 продают 1 000+ в месяц: 16% ◈. Почти все — с брендом, а не безымянные."],["Регуляторный риск","Сыворотки с простагландинами (аналоги лекарства от глаукомы) FDA считает лекарством; Amazon и Meta их ограничивают ◈. Пептидные формулы, как у Hanae, этот риск обходят."],["Цены ровные","За год цены топ-10 почти не менялись, только циклы скидок ◈. Данные Amazon по этой категории собраны вручную — их стоит перепроверить."]],"take":"Хороший вход для бренда, а не для копии: рынок раздроблен, и молодой бренд Hanae пробился за два месяца. Условие одно — формула без простагландинов и аккуратные обещания: «ресницы выглядят гуще», а не «растут».","next":["Перепроверить 10 случайных строк ручных данных Amazon","Реклама Hanae по домену","Маржа и поставщики пептидных формул"]},"tallow_balm":{"claim":"Разбор магазина Base Supplies: бальзам из говяжьего жира с мёдом, оценка $872 тыс. в месяц. Видео целиком про то, как сделать ИИ-рекламу «как от реального блогера».","reality":[["Больше всего выживших","Из 142 новых продавцов 19 продают 1 000+ в месяц и 43 — 300+ ◆. Ни в одной категории нет столько выживших новичков."],["Самый открытый рынок","У трёх лидеров 41% полки, индекс концентрации самый низкий из 20 ◆. Лидер Terra Lotus — молодой бренд (домен с марта 2024-го, в 2025-м — топ-5 в уходе за кожей в TikTok Shop) ◆."],["Но спрос остывает","Все формулировки вместе — «tallow balm», «beef tallow for skin» и другие — дают −22% к прошлому году с поправкой на фон ◆. Это не обвал, но тренд прошёл пик."],["Лидеры: взлёт и откат","Отзывы Terra Lotus выросли с ~40 в месяц весной 2026-го до ~1 350 в августе и упали до 336 в октябре; 43% сентябрьских отзывов ниже 5 звёзд ◈. Старый лидер Ancestral ровно держит 300–600 в месяц."],["Цены ровные","Terra Lotus весь год по $19.99, рынок почти не двигался ◈."],["Маленькие магазины держат рекламу","Шесть магазинов-лидеров крутят рекламу в Meta, у Ancestral 75 объявлений идут 90+ дней ◆. Мелкие бренды здесь живут годами."]],"take":"Лучшее место, чтобы новичок выжил, но на остывающем спросе. Заходить можно, только если готовы к рынку, который больше не растёт: брать качеством и отзывами, а не волной хайпа.","next":["Третий замер Google Trends (10 ноября) по всем формулировкам","Почему у Terra Lotus упали отзывы и выросла доля плохих","Маржа при цене $15–20"]},"shower_filter":{"claim":"В видео про бюджетный старт за $500 упоминается бренд душевых леек с фильтром Eskin — $1,4 млн в месяц по оценке трекера. Совет: делать рекламу и страницу как у лидера.","reality":[["Спокойный рынок","Поиск +9% («filtered shower head» +22%) ◆. На Amazon покупают 104 тыс. штук в месяц ◆."],["Никто не доминирует","У трёх лидеров 44% полки ◆. Лидеры — старые бренды Amazon: FEELSO (6+ лет), SR SUN RISE, MakeFit."],["Новички выживают","Из 63 новых продавцов 8 продают 1 000+ в месяц: 13% ◈. 7 из 8 — безымянные."],["Молодых брендов-победителей нет","Единственный «новый» бренд Magichome на деле продаёт на Amazon во Франции с 2019 года ◆."],["Магазин-лидер стоит на месте","Sproos: 329 отзывов за август–октябрь против 344 год назад ◆. Отзывы смещаются на сменные картриджи по подписке — новых устройств продаётся меньше ◈. При этом 97 из 120 объявлений Sproos крутятся 90+ дней ◆."],["Цены слегка ползут","Постоянные скидки; у части моделей цена сползла с $30 до $22 ◈. Войны нет."]],"take":"Надёжный, но скучный рынок: нет ни роста, ни доминанта. Деньги здесь не в самой лейке, а в подписке на картриджи, как у Sproos. Входить, если строить модель повторных покупок.","next":["Экономика подписки на картриджи","Сертификация фильтров (NSF) — что нужно для обещаний","Возраст бизнеса безымянных выживших"]},"persimmon_soap":{"claim":"Разбор Suva: мыло с хурмой от «возрастного запаха» для пожилых покупателей в Facebook, $0,8–1,6 млн в месяц. Реклама — ИИ-«внучка» и статья, якобы написанная врачом.","reality":[["Самый быстрый рост спроса","Поиск вырос в 4,7 раза за год, «nonenal» — почти в 3 раза ◆. Запрос редкий (13% недель с нулём), поэтому цифра шумная ◈."],["Рынок маленький и плотный","На Amazon покупают 70 тыс. штук в месяц ◆. У трёх лидеров 62% ◆."],["Новички пробиваются редко","Из 67 новых продавцов 7 продают 1 000+ в месяц: 10% ◈."],["Но в рекламе растёт молодой бренд","Kaori: домен с февраля 2026-го, уже 750 объявлений в Meta, 210 из них идут 90+ дней ◆. Растёт через свой магазин, а не через Amazon."],["Старый лидер тоже растёт","Mirai Clinical (с 2014 года): 947 отзывов в магазине за август–октябрь против 471 год назад — вдвое ◆."],["Цены: давление у дешёвых наборов","Наборы по 3–5 брусков подешевели примерно на 20% ($7–10), Mirai — с $23 до $18–20 ◈. Войны нет."]],"take":"Лучшая волна спроса, но не для Amazon: там тесно. Окно — свой магазин и реклама в Meta на аудиторию 55+, как делает Kaori. Риск — обещания про запах тела и выдуманные «врачи» в рекламе.","next":["Как Kaori вырос за 9 месяцев: креативы и воронка","Маржа мыла при цене $15–35 за набор","Правила Meta для рекламы на аудиторию 55+"]},"body_oil":{"claim":"Два разбора магазина God Silk (GODA): масло для тела от дряблости, $2,1 млн за 180 дней и 400–500 заказов в день. Советуют копировать страницу и рекламу «до/после» морщин.","reality":[["Спрос ровный","Поиск «crepey skin» и «body oil» — около +2–6% ◆. «Firming body oil» +52%, но запрос редкий ◈."],["Один новичок пробился","GODA продаёт 20 тыс. в месяц на Amazon и крутит 4 400 объявлений в Meta, 580 из них 90+ дней ◆. Фото-отзывы в магазине — примерно в 5 раз больше, чем год назад ◈."],["Но GODA не стартап","Это бренд парфюма с феромонами, который добавил масло; отзывы в магазине с декабря 2023-го ◆. Год основания не нашли."],["Остальным тяжело","Из 47 новых продавцов 6 продают 1 000+: 13% ◈. Полку держат Palmer's, Neutrogena, Aveeno ◆."],["Замер шире нашего товара","В 197 тыс. продаж попали все масла для тела, а не только от дряблости ◆. Реальная ниша — GODA и несколько мелких продавцов."],["Цены ровные","GODA снизил цену с $47 до $33–35 в январе и держит её; большие бренды не двигаются ◈."]],"take":"Пример одного победителя на старой полке. Повторить GODA можно только через свой магазин и много рекламы в Meta; на Amazon новичку против Palmer's и Neutrogena тяжело.","next":["Сколько тратит GODA на рекламу","Год основания GODA","Отдельный замер полки только «firming / crepey»"]},"scent_diffuser":{"claim":"Разбор Ulfia Studio: премиальный аромадиффузор в стиле парфюмерного флакона, $161–279 тыс. в месяц (автор думает, что до $600 тыс.). В видео ультразвуковая модель, мы мерили безводные (waterless).","reality":[["Спрос растёт","«Waterless diffuser» — вдвое к прошлому году ◆. Более широкий «scent diffuser» — +13%."],["Магазины лидеров растут","Scentify — вдвое, Aura House — в 2,7 раза (сам диффузор: 26 → 139 отзывов в октябре), Aroma360 — в 1,4 раза, но октябрь подняла акция ◆. Это самое подтверждённое отзывами движение во всём списке."],["Но на Amazon тесно","Из 78 новых продавцов только 6 продают 1 000+: 8% ◈. Рынок на Amazon небольшой — 58 тыс. в месяц ◆."],["Лидеры старые","AirScent основан в 1946 году, Scentify работает примерно с 2020-го ◆. Молодого победителя не нашли."],["Цены: дорогой запуск и откат","Новые модели выходят по $130 и за пару месяцев опускаются до $80–90 — обычное стартовое ценообразование ◈. Войны нет."],["Реклама скромная","У лидеров в Meta меньше 100 объявлений, работающих 90+ дней ◆. Растут за счёт своих магазинов."]],"take":"Рынок растёт, но рост забирают старые магазины-бренды. Новичку окно — премиальный бренд со своим магазином и сменными ароматами (повторные покупки). На Amazon про function board(top,rest){const row=(c,i,t)=>`<a class="br ${t?"top":""}" href="#c-${c.slug}"><span class="rk">${i}</span>

     ${cl?`<div class="money">${esc(money(cl.revenue))}<small>${esc(cl.basis||"")}</small></div>`:""}</div></section>
  ${A?`<section class="blk"><div class="sh"><h2>Как на самом деле</h2></div><div class="facts">${A.reality.map(([h,p])=>`<div class="fact"><h3>${esc(h)}</h3><p>${tier(esc(p))}</p></div>`).join("")}</div></section>

    <div>Цены за 12 месяцев</div><div>${esc(m.D2_note)}</div>
    ${m.B4_shops.map(s=>`<div>Реклама Meta, ${esc(s.domain)}: активных / работают 90+ дней</div><div>${nf(s.active)} / ${nf(s.aged90)}</div>`).join("")}
    ${m.B6?`<div>Молодой бизнес-победитель (проверено вручную)</div><div>${esc(m.B6)}</div>`:""}
    <div class="c">◆ посчитано платформой · ◈ наша оценка или прочтение · ◇ спорно. Методика — на отдельной странице.</div></div></details></section>
  ${adsFig(c)}${foot()}</div>`;
  window.scrollTo(0,0);wireTips();drawAll(c)}
const tier=s=>s.replace(/◆/g,'<span title="посчитано платформой">◆</span>').replace(/◈/g,'<span title="наша оценка">◈</span>');
function money(s){s=String(s||"");const m=s.match(/\$[\d.,]+\s*(?:млн|тыс|million|k|K|M)?[^,;(]*/);return (s.split("(")[0]||s).slice(0,60)}
function funnel(c){const m=c.m,mx=m.B1_n||1,w=v=>Math.max(2,Math.round(100*v/mx))+"%";
  return `<div class="fig"><h3>Сколько новичков выживает</h3><p class="cap">Продавцы, пришедшие на Amazon за последние 3–24 месяца</p><div class="funnel">
   <div><b>${m.B1_n}</b><i style="width:${w(m.B1_n)};opacity:.25"></i><span>пришли</span></div>
   <div><b>${m.B2_300}</b><i style="width:${w(m.B2_300)};opacity:.5"></i><span>продают 300+</span></div>
