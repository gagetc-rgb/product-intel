   <div><b>${m.D1_unbranded_1k}</b><i style="width:${w(m.D1_unbranded_1k)};background:var(--faint)"></i><span>из них без бренда</span></div></div></div>`}
function trendFig(c){if(!c.trend.values)return"";return `<div class="fig"><h3>Спрос в Google</h3><p class="cap">«${esc(c.trend.term)}», США, по неделям, сглажено</p><div id="tr"></div></div>`}
function leadersFig(c){const L=(c.leaders||[]).slice(0,6);if(!L.length)return"";const mx=Math.max(...L.map(l=>l.units));
  return `<div class="fig"><h3>Лидеры Amazon</h3><p class="cap">Покупают в месяц · цена</p><div class="bars">${L.map(l=>`<div><span style="color:var(--ink);text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(l.name)}</span><i style="width:${Math.max(2,Math.round(100*l.units/mx))}%"></i><span>${kf(l.units)}${l.price?" · $"+l.price.toFixed(0):""}</span></div>`).join("")}</div></div>`}
function reviewsFig(c){if(!c.reviews)return"";return `<div class="fig"><h3>Отзывы в магазинах лидеров</h3><p class="cap">Отзывов в месяц; пунктир — оценка</p><div id="rv"></div></div>`}
function adsFig(c){const A=(c.creatives||[]).slice(0,3);if(!A.length)return"";
  return `<section class="blk"><div class="sh"><h2>Реклама, которая живёт дольше всех</h2><p>Объявления лидеров из библиотеки Meta, отсортированы по сроку показа.</p></div><div class="ads">${A.map(a=>`<a class="ad" href="${a.lib}" target="_blank" rel="noopener"><img src="${a.img}" alt="" loading="lazy"><div><b>${a.days} дн. в показе</b>${esc(a.domain)}</div></a>`).join("")}</div></section>`}
const SER=["#2B2BFF","#121212","#1E9E5A","#D08A00","#D2443C"];
function line(series,labels,W=520,H=200){const L=34,B=24,all=series.flatMap(s=>s.v.filter(x=>x!=null)),mx=Math.max(...all,1)*1.08,n=labels.length;
  const X=i=>L+i/(n-1)*(W-L-6),Y=v=>H-B-(v/mx)*(H-B-8);let g="";
  for(const t of[0,.5,1]){const y=Y(mx*t/1.08);g+=`<line x1="${L}" x2="${W}" y1="${y}" y2="${y}" stroke="#E3DFD6"/><text x="${L-6}" y="${y+4}" text-anchor="end">${Math.round(mx*t/1.08)}</text>`}
  labels.forEach((l,i)=>{if(l)g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle">${l}</text>`});
  series.forEach((s,k)=>{let d="",pen=false;s.v.forEach((v,i)=>{if(v==null){pen=false;return}d+=(pen?"L":"M")+X(i).toFixed(1)+","+Y(v).toFixed(1);pen=true});
    g+=`<path d="${d}" fill="none" stroke="${SER[k%5]}" stroke-width="2.2" ${s.dash?'stroke-dasharray="4 4"':''} stroke-linejoin="round"/>`});
  return `<svg viewBox="0 0 ${W} ${H}">${g}</svg>`+(series.length>1?`<div class="legend" style="margin-top:6px">${series.map((s,k)=>`<span><i style="display:inline-block;width:10px;height:3px;background:${SER[k%5]};vertical-align:middle;margin-right:6px"></i>${esc(s.name)}</span>`).join("")}</div>`:"")}
function drawAll(c){
  if(c.trend.values&&$("#tr")){const v=c.trend.values.slice(-156),sm=v.map((_,i)=>{const s=v.slice(Math.max(0,i-3),i+1);return s.reduce((a,b)=>a+b,0)/s.length});
    const w0=new Date(DATA.week0+"T00:00:00Z"),off=c.trend.values.length-v.length,MON=["янв","фев","мар","апр","май","июн","июл","авг","сен","окт","ноя","дек"];
    const lab=v.map((_,i)=>{const d=new Date(w0.getTime()+(off+i)*7*864e5);return d.getUTCMonth()===0&&d.getUTCDate()<=7?String(d.getUTCFullYear()):""});
    $("#tr").innerHTML=line([{name:"спрос",v:sm}],lab)}
  if(c.reviews&&$("#rv")){const M=DATA.months,S=c.reviews.series.slice(0,4);
    const ser=[];S.forEach(s=>{ser.push({name:s.name,v:s.pts.map(p=>p[2]?null:p[1])});if(s.pts.some(p=>p[2]))ser.push({name:s.name+" (оценка)",v:s.pts.map(p=>p[1]),dash:1})});
    $("#rv").innerHTML=line(ser.filter(s=>s.v.some(x=>x!=null)),M.map(ym=>ym.endsWith("-01")?ym.slice(0,4):""))}}

/* ---------- tips ---------- */
const RISK={legal:["g","Законно"],gray:["y","Серая зона"],risk:["r","Риск бана или иска"]};
const SEC=[["stay","Как оставаться на рынке","Запреты площадок и формулировки"],["sell","Как хитро продавать","Страницы, офферы, цены"],["ads","Как хитро рекламировать","Креативы и запуск"],["money","Как они считают деньги","Откуда цифры в видео"]];
let tipF="all";
function tips(){const T=RU.tips;
  const body=()=>SEC.map(([k,h,s])=>{const L=T.filter(t=>t.sec===k&&(tipF==="all"||t.risk===tipF));if(!L.length)return"";

    <div class="switch" role="group">${[["all","Все"],["legal","Законно"],["gray","Серая зона"],["risk","Риск"]].map(([k,v])=>`<button data-r="${k}" aria-pressed="${tipF===k}">${v}</button>`).join("")}</div></section>
    <div id="tipbody">${body()}</div>${foot()}</div>`;
  $$("[data-r]").forEach(b=>b.onclick=()=>{tipF=b.dataset.r;$$("[data-r]").forEach(x=>x.setAttribute("aria-pressed",x===b));$("#tipbody").innerHTML=body()});

function soon(t,p){$("#app").innerHTML=`<div class="wrap fade"><section class="cover"><span class="eyebrow">В работе</span><h1>${t}</h1><p class="lede">${p}</p></section>${foot()}</div>`;window.scrollTo(0,0)}
function foot(){return `<footer><span>Собрано ${DATA.built}</span><span>Методика v2.2</span><span>◆ посчитано платформой · ◈ наша оценка · ◇ спорно</span></footer>`}
function wireTips(){const T=$("#tip");$$("[data-tip]").forEach(e=>{e.onmouseenter=ev=>{T.textContent=e.dataset.tip;T.style.opacity=1;const r=e.getBoundingClientRect();

function route(){const h=location.hash.slice(1);let n="home";

  else{home();if(h==="all")setTimeout(()=>$("#all20").scrollIntoView(),20);n=h==="all"?"all":"home";if(h!=="all")window.scrollTo(0,0)}
  $$(".nav nav a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.n===n))}
addEventListener("hashchange",route);addEventListener("scroll",()=>$("#nav").classList.toggle("sc",scrollY>10));route();
