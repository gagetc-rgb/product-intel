ds almost absent; a long-lived but small ad market.</p><p>60,250 units a month; 68% old brands (Dr Teal's 13,000/mo, Seven Minerals 10,300, Ancient Minerals 5,400), 30% unbranded, 2% young brands. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> Note: the earlier scan used Amazon bylines for this category and found 4,550/mo to young brands; with title-only brand reading (the rule for all 20) it is 1,250. Some young brands may be hidden in the unbranded share. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span> Meta (\"magnesium spray\"): 510 active, 14% alive 90+, <strong>10% alive 180+</strong>; 5 of 13 shops keep a 90+ day ad (ozcogoods.com 443 days). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> Search ×0.97: flat. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>Reading: a small evergreen niche for a few store brands; nothing on Amazon says a newcomer can grow there. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"Sources","kind":"sources","html":"<p>Amazon (US, ZIP 10001) → <code>work/blind/graveyard_us/magnesium_spray.json</code>. Meta <a href=\"https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=US&amp;q=%22magnesium%20spray%22&amp;search_type=keyword_exact_phrase&amp;media_type=all\" target=\"_blank\" rel=\"noopener\">exact phrase \"magnesium spray\"</a>. Trends <a href=\"https://trends.google.com/trends/explore?date=today%205-y&amp;geo=US&amp;q=magnesium%20spray\" target=\"_blank\" rel=\"noopener\">\"magnesium spray\"</a>. Method: <code>/RUNBOOK.md</code> v2.1.</p>"}],"m":{"A1":0.95,"A1_terms":"magnesium spray","A1_pulls":3,"A1_zero_share":0,"A2":60250,"A2_source":"automated scan","flags":[],"B1":0.026,"B1_n":76,"B2_1k":2,"B2_300":6,"B3_hhi":1031,"B3_top3":0.49,"D1_unbranded_1k":2,"B4_shops":[],"B6":null,"B6_none":null,"D2":null,"D2_note":"not measured","B1_lo":0.007,"B1_hi":0.091,"B1_grp":"below"},"kill":"","note":""}],"intro":"<p>We measured 20 product categories the same way and asked one question: <strong>is there room for a new brand right now?</strong></p><p>Three independent signals, each read from the platform itself:</p><ol><li><strong>Amazon:</strong> how many people bought in the last month, and how much of it went to brands that are less than two years old. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Meta ads:</strong> how many ads are running, and how many have been kept alive for 1, 3 and 6 months. Advertisers stop ads that lose money, so an ad that is still running after months is a sign it pays back. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Google searches:</strong> is interest growing, flat or falling compared with a year ago. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li></ol>","methods":{"lead":"<p>Method v2.1, frozen in <code>/RUNBOOK.md</code>. Rules were written before results were read; every change is a version bump with the reason logged.</p>","secs":[{"h":"Amazon: who sells, and how new are they","html":"<ul><li><strong>What:</strong> amazon.com search results, pages 1-5, for one query per category, delivery address set to New York 10001. Sponsored cards are skipped. 16 categories were read by our script; 4 (lash serum, hair serum, pre-wash oil, whitening powder) by hand by the owner's assistant after Amazon asked AI agents not to browse it.</li><li><strong>Units:</strong> the \"bought in past month\" badge. It is a <strong>floor</strong> (\"1K+\" = at least 1,000) and counts <strong>buyers, not units</strong>; the true number is higher. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> Amazon's own count.</li><li><strong>Category:</strong> a strict description of the product form (e.g. a neck cream must be sold <em>for the neck</em>), so other products don't leak in.</li><li><strong>Brand age:</strong> the oldest listing of a brand in the sample, dated from its Amazon product code (ASIN); codes are issued in order, error about ±1-2 months. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>New brand:</strong> on Amazon less than 24 months, and not an established brand entering a new product (L'Oréal, Palmer's, RevitaLash…).</li><li><strong>Unbranded seller:</strong> a listing whose title does not start with a brand name. 22 of 72 top listings we checked by hand do have a registered brand that isn't in the title (LATORICE, NXPPYY…); they behave like unbranded sellers (price-led), and are counted as such.</li><li><strong>Revenue floor:</strong> units × listing price. Ignores discounts and multi-packs. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Meta ads: who keeps paying","html":"<ul><li><strong>What:</strong> Meta Ad Library, United States, active ads containing the exact phrase (e.g. \"tallow balm\"). The counts are Meta's own (shown as \"~N results\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Ad age:</strong> the same search with \"started before\" today minus 30 / 90 / 180 days.</li><li><strong>Shops:</strong> a sample of ads drawn evenly from each age window, grouped by the shop they link to. Because the sample is drawn by age, almost every category shows some shop with a 90+ day ad; read the counts, not just \"yes/no\".</li><li><strong>Brands:</strong> counted on the brand's own Facebook Page, plus the share of ads mentioning the brand that link to its site (brands like GODA advertise mostly through creators' pages).</li><li><strong>Limits:</strong> the US library shows only ads running today; stopped ads vanish. A re-check in 30 days (<code>meta_recheck.py</code>) will show which of today's ads died. An old ad can also be a forgotten low-budget ad or brand advertising; we weigh small direct-to-consumer brands more than large ones.</li></ul>"},{"h":"Google searches: is interest growing","html":"<ul><li><strong>What:</strong> Google Trends, United States, 5 years, weekly. Growth = last 12 full weeks divided by the same weeks a year earlier.</li><li><strong>Correction:</strong> in April-June 2026 every term, including \"shampoo\" and \"body lotion\", spikes in the same weeks: a Google data artifact. Each term's growth is divided by the controls' growth (1.14 in pull 1).</li><li><strong>Labels:</strong> ≥1.2 growing, 0.8-1.2 flat, &lt;0.8 falling (drop rule).</li><li><strong>Noise:</strong> Google returns a random sample each day; rare terms are noisy (we flag terms with many zero weeks). Three pulls on three days are averaged; pulls 1-2 are in (2026-11-08 and 11-09), pull 3 is due 2026-11-10.</li></ul>"},{"h":"Drop rules (decided before results)","html":"<p>A category is dropped if (a) searches fall below 0.8 of last year, or (b) new brands sell under 10,000 a month on Amazon <strong>and</strong> no shop keeps a Meta ad 90+ days.</p>"},{"h":"Not measured","html":"<p>Website traffic (estimators are unreliable for shops of this size: Similarweb itself shows nothing under 5,000 visits a month and is confident only above 100,000), review growth over time (pending), margins and product costs, TikTok Shop live sales.</p>"},{"h":"Data files","html":"<p><code>work/dossier/dossier_data.json</code> (all layers), <code>digest/&lt;id&gt;.json</code> (per page), <code>chart_data.json</code> (charts), <code>verdict_v21.json</code> / <code>FINAL_V21.md</code> (verdict table). Scripts: <code>work/blind/graveyard_*.py</code>, <code>meta_*.py</code>, <code>trends_calc.py</code>, <code>work/dossier/build_dossier.py</code>, <code>digest.py</code>, <code>verdict_v21.py</code>.</p>"},{"h":"Store reviews: are the winners still growing","html":"<ul><li><strong>What:</strong> each leader store's public review feed (Judge.me, Okendo, Yotpo, Stamped, Junip, Loox), counted per month back to mid-2024. A review is a share of orders, so growth in reviews tracks growth in orders. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Exact or estimated:</strong> Okendo, Yotpo, Stamped and Junip give every review with its date: exact. Judge.me gives the latest 1,000 exactly; older months are estimated from the 1-4 star reviews, which go further back, times the store's overall star mix (dashed on the charts). Loox hides dates; photo reviews carry their date in the image address, so for Loox stores we count photo reviews only, from a 20% sample (dashed).</li><li><strong>Limits:</strong> stores turn 3-10% of orders into reviews, so review counts can't be compared between stores, only month to month within one store. A store that changes how it asks for reviews breaks its own curve (Smooche, Aura House in Aug-Sep 2026). Some feeds hide low ratings (Stamped).</li></ul>"}]},"ru":{"name":{"dog_fountain":"Поилка-фонтан для питомцев","color_foundation":"Тональный крем, меняющий цвет","lash_serum":"Сыворотка для ресниц","tallow_balm":"Бальзам на говяжьем жире","shower_filter":"Душевая лейка с фильтром","hair_serum":"Сыворотка для роста волос","body_oil":"Масло для тела от дряблости","persimmon_soap":"Мыло с хурмой","compression_socks":"Компрессионные носки","pore_patch":"Патчи для пор носа","rosemary_oil":"Розмариновое масло для волос","prewash_oil":"Масло для волос до мытья","whitening_powder":"Отбеливающий порошок для зубов","turmeric_soap":"Мыло с куркумой","hair_removal_cream":"Мужской крем для депиляции","scent_diffuser":"Безводный аромадиффузор","neck_cream":"Крем для шеи","chin_wrap":"Маска-бандаж для подбородка","exfoliating_towel":"Отшелушивающее полотенце","magnesium_spray":"Магниевый спрей"},"verdict":{"dog_fountain":"Пробивается каждый четвёртый новичок: 25 из 100 продают 1 000+ в месяц. Но почти все они безымянные продавцы: это рынок копий, а не брендов.","color_foundation":"Самый большой рынок на Amazon, пробивается каждый четвёртый новичок. Но молодых брендов среди победителей нет, а рост поиска создаёт реклама трёх брендов. Почти половина рынка у Luxe.","lash_serum":"Большой рынок, но пробивается 13% новичков, а брендовый поиск почти целиком у Babe и Grande. Обещать «рост ресниц» нельзя. Молодой победитель один: Hanae.","tallow_balm":"Ближе всех к порогу: 11 брендов-новичков пробились, и бренд здесь продаёт дороже безымянных. Проверен один молодой бренд, нужен второй. Поиск остывает.","shower_filter":"Спрос и цены ровные, никто не доминирует. Пробивается каждый восьмой, но молодых брендов среди победителей нет, а вход требует сертификации.","hair_serum":"Лучшая доля пробившихся новичков (29%), но данные Amazon сняты отдельно со страниц поиска, повторно не сверены и пересекаются с розмариновым маслом. Нужна перепроверка.","body_oil":"В нише «от дряблости» пробился один бренд, GODA. Полка маленькая (52 тыс. в месяц) и плотная.","persimmon_soap":"Есть молодой победитель (Kaori), но рынок маленький и плотный: пробивается каждый десятый. Рост поиска во многом дают поиски брендов.","compression_socks":"Большая раздробленная полка (232 тыс. в месяц) у старых брендов; новичков в выборке мало (27), пробились 4.","pore_patch":"Полку держит Bioré: у трёх лидеров 81%. Выборка маленькая, поисковый запрос слишком редкий.","rosemary_oil":"Спрос падает (×0,77 за год). Рынок пересекается с сыворотками для волос.","prewash_oil":"У самого товара маленькая полка (37 тыс. в месяц); раньше в замер попадали все масла для волос. Пробился 1 новичок из 17.","whitening_powder":"Самая маленькая полка на Amazon из 20 (17 тыс. покупок в месяц). Но в Facebook держатся две молодые копии, MYTO и MOOTHS, обе рекламируются почти только от своего имени.","turmeric_soap":"Спрос падает (×0,73), полку держат мыла с койевой кислотой (Valitic). Растёт один бренд, Earthly Derm, в своём магазине.","hair_removal_cream":"Veet и Nair держат 85% полки. Места для новичка нет.","scent_diffuser":"Магазины лидеров растут, но на Amazon пробивается лишь каждый тринадцатый новичок.","neck_cream":"Полку держат старые бренды ухода, новички почти не пробиваются (7%).","chin_wrap":"Маленькая полка у старых брендов. Рекламу в Meta по этой фразе дают клиники, а не продавцы маски.","exfoliating_towel":"Поиск растёт, но полку держат Goshi и безымянные продавцы. Новички: 4%.","magnesium_spray":"Рынок держат старые wellness-бренды, новички почти отсутствуют (3%)."},"article":{"dog_fountain":{"claim":"Автор разбирает бренд Good Origins: фонтанчик из медицинской стали за $99 в собственном магазине, продажи через историю о здоровье почек и «AI-ветеринара» в рекламе. Оценка выручки: $104–185 тыс. в месяц.","reality":[["Спрос растёт","Поиск в Google +45% к прошлому году ◆. На Amazon покупают 209 тыс. штук в месяц: один из трёх самых больших рынков в списке ◆."],["Новички пробиваются","Из 100 продавцов, пришедших за последние 3–24 месяца, 25 продают 1 000+ в месяц: 25% (от 18 до 34%), одна из трёх лучших долей среди 20 товаров ◈. В первом замере было 28 из 104: в него попали наборы сменных фильтров."],["Но пробиваются копии","Почти все пробившиеся оказались безымянными продавцами (23 из 25, по названию карточки ◈). Бренд виден у Selene (1 000 в месяц, на Amazon 5 месяцев); возраст бизнеса не подтверждён. Лидер: Veken (около 57 тыс. в месяц), старый бренд."],["Цены спокойные","За год цены топ-10 почти не менялись, только регулярные скидки. «Ценовой войны», о которой мы писали раньше, нет: вывод отозван ◈."],["Цена в видео выше рынка","Good Origins продаёт за $99, а средняя цена на Amazon $39.99. Разницу дают бренд и история, а не товар ◆."],["Реклама не измерена","Фраза «water fountain» в Meta находит садовые фонтаны, поэтому рекламу категории оценить нельзя. Good Origins по домену пока не проверяли."]],"take":"Новичков здесь пробивается больше всего (25 из 100), но почти все они безымянные копии, а на Amazon по $30 с продажи почти ничего не остаётся: около $11,6 забирает Amazon, $11–19 стоит сам товар с доставкой и пошлиной. Смысл есть, только если найти поставщика заметно дешевле или продавать дороже: свой бренд, как Good Origins, через свой магазин и со сменными фильтрами по подписке.","next":["Проверить Good Origins: возраст бизнеса, реклама по домену, отзывы магазина","Проверить возраст Veken и PETLIBRO","Возраст бизнеса Selene"]},"color_foundation":{"claim":"Разбор магазина Hestia: тональный стик, который «подстраивается под тон кожи», для женщин старшего возраста. Оценка: $12,7–19,5 млн продаж. Автор клонирует страницу и запускает свой бренд с ИИ-аватаром в рекламе.","reality":[["Поиск вырос, но это поиск брендов","Запрос в Google вырос в 4,5 раза за год ◆, но ищут по нему в основном Luxe, Smooche и Prime Prometics («is luxe legit», «where to buy luxe»): это след их рекламы ◈. На Amazon покупают 323 тыс. штук в месяц, это самый большой рынок в списке ◆."],["Пробиваются копии, а не бренды","Из 48 продавцов, пришедших за 3–24 месяца, 13 продают 1 000+ в месяц: 27% (от 17 до 41%) ◈. 10 из 13 безымянные по названию карточки. Остальные трое (Luxe, Smooche и Prime Prometics) работают с 2020–2021 годов; без них 10 из 45 (22%). Проверенных молодых брендов среди победителей нет ◆. Бренды здесь продают по той же цене, что и безымянные ◈."],["Но рынок у одного бренда","Luxe продаёт около 150 тыс. в месяц, это 46% полки. У трёх лидеров 65% ◆. По американскому стандарту это высокая концентрация."],["Лидеры не новые","Luxe собирает отзывы в своём магазине с 2021 года и называет себя «брендом на $30 млн». Smooche работает примерно с 2021-го, Prime Prometics с 2020-го (Латвия). Новые у них только карточки на Amazon ◆."],["Магазины лидеров не растут","Отзывы на тональный крем Prime Prometics: 687 за август–октябрь против 690 год назад ◆. Рост спроса уходит на Amazon и к новым продавцам, а не в магазины старых брендов ◈."],["В рекламе держатся пять молодых магазинов","Hestia (магазин из видео; домен с марта 2026-го, витрина Lumine Skin с сентября 2025-го): 383 объявления 90+ дней, самое старое 371 день ◆. Hanae: стик «подстраивается под тон кожи», 66 объявлений 90+, 12 старше 180 ◆. Yuki: 40 объявлений 90+ от страницы «Korean Foundation Tips» ◆. Facelove: 14 объявлений стика 90+, 167 дней ◆. TryNova: 5 объявлений, 100 дней ◆ (архив Meta через Apify, 11.11.2026)."],["Цены: временный демпинг лидера","Luxe опускал цену до $13–17 вместо $40 с июля по октябрь, сейчас снова $28–30 ◈. Остальные держат $28–49. Войны нет, но лидер готов резать цену."]],"take":"Самый большой рынок. В Facebook держатся пять молодых копий, сильнее всех Hestia из видео (383 объявления 90+ дней); на Amazon пробиваются безымянные. Но бренду здесь пока нечем доказать шанс: среди победителей Amazon молодых брендов нет, цена бренда не выше безымянных, а почти половину рынка держит Luxe, который умеет резать цену. Рост поиска создаёт реклама трёх компаний, а не волна спроса.","next":["Реклама Smooche: на чём держатся 5 900 объявлений","Возраст бизнеса безымянных победителей","Facelove: доживёт ли реклама стика до 180 дней (замер 11 декабря)","Новые стики Beaumont Voss и TryNova: уже перешли 90 дней, проверить товар и возраст"]},"lash_serum":{"claim":"Два разбора: магазин сыворотки для ресниц с оценкой $670 тыс. – $1,2 млн в месяц и ещё один около $1 млн за 90 дней. Продают через ролики «до/после» с ресницами и ИИ-отзывы.","reality":[["Большой ровный рынок","На Amazon покупают 200 тыс. штук в месяц ◆. Поиск +17% к прошлому году, то есть ровно ◆."],["Два бренда держат внимание","У трёх лидеров 46% полки ◆. В первом замере мы потеряли одного из лидеров, Babe (около 38 тыс. в месяц по всем её карточкам), и засчитали касторовое масло и сыворотки для бровей. В поиске по брендам у Babe 57%, у Grande 40% ◆."],["Молодой победитель есть","Hanae: домен зарегистрирован в ноябре 2025-го, а сейчас, через год, у него 5 000+ покупок в месяц на Amazon ◆; когда начался рост, покажет Keepa ◈."],["Реклама держится у многих, молодая копия одна","За два года рекламу сыворотки для ресниц в США запускали 383 магазина и страницы; 42 продержали объявление 90+ дней, 8 крутят до сих пор ◆ (BigSpy, 11.11.2026). Почти все долгие объявления у старых брендов и блогеров. Из восьми живых молодой и продающий именно сыворотку только Hanae ◆. Facelove Cosmetics (домен с декабря 2025-го) попал в список из-за слов «lash serum», но его долгие объявления продают тушь, а сыворотку дают в подарок ◆. Lash Therapy завёл новый домен в июне 2026-го, но бренд австралийский и старше ◆."],["Новички пробиваются редко","Из 40 новых продавцов 5 продают 1 000+ в месяц: 13% (с учётом погрешности от 6 до 26%) ◈. Замер 11 ноября, автоматический; ручной замер 8 ноября дал 4 из 50, а совпадение значков «куплено за месяц» 173 из 208 общих товаров. Раньше мы писали 16%: это была ошибка фильтра."],["Обещать «рост» нельзя","По правилам FDA обещание «ресницы растут» делает товар лекарством; косметике можно обещать только вид: «ресницы выглядят гуще» ◆. Это слабее того, что ищут покупатели. Сыворотки с простагландинами FDA считает лекарством при любых словах ◈. Средство для области глаз, скорее всего, нужно регистрировать в FDA даже маленькой компании ◈."],["Цены ровные","За год цены топ-10 почти не менялись, только циклы скидок ◈. Данные Amazon перепроверены автоматическим замером 11 ноября: значки «куплено за месяц» совпали у 173 из 208 общих товаров ◆."]],"take":"По главной линзе это сильнейший кандидат: Hanae, магазин младше года, держит 185 объявлений сыворотки 90+ дней, все от двух страниц самого магазина; но самое старое из них 124 дня, старше 180 пока нет. Против: на Amazon пробиваются 13% новичков, внимание у Babe и Grande, а главное обещание категории («ресницы растут») нам недоступно. В пользу: бренды здесь продают вдвое дороже безымянных. Решит проверка: продаётся ли сыворотка со словами «выглядят гуще».","next":["Тест спроса только с разрешёнными обещаниями","Отзывы Hanae: работает ли мягкая формула","Перепроверить 10 случайных строк ручных данных Amazon"]},"tallow_balm":{"claim":"Разбор магазина Base Supplies: бальзам из говяжьего жира с мёдом, оценка $872 тыс. в месяц. Видео целиком про то, как сделать ИИ-рекламу «как от реального блогера».","reality":[["Больше всего пробившихся брендов","Из 142 новых продавцов 19 продают 1 000+ в месяц и 43 продают 300+ ◆. 11 из 19 с брендом: столько пробившихся брендов-новичков нет ни в одной категории. У поилки пробившихся больше, но почти все безымянные ◆."],["Самый открытый рынок","У трёх лидеров 41% полки, индекс концентрации самый низкий из 20 ◆. Лидер на Amazon и в TikTok Terra Lotus (домен с марта 2024-го, в 2025-м в топ-5 в уходе за кожей в TikTok Shop) ◆. В рекламе Facebook лидер другой, Ancestral ◆."],["Но спрос остывает","Все формулировки вместе («tallow balm», «beef tallow for skin» и другие) дают −22% к прошлому году с поправкой на фон (среднее двух замеров, 9 и 10 ноября) ◆. Это не обвал, но тренд прошёл пик."],["Лидеры: взлёт и откат","Отзывы Terra Lotus выросли с ~40 в месяц весной 2026-го до ~1 350 в августе и упали до 336 в октябре; 43% сентябрьских отзывов ниже 5 звёзд ◈. Старый лидер Ancestral ровно держит 300–600 в месяц."],["Цены ровные","Terra Lotus весь год по $19.99, рынок почти не двигался ◈."],["Маленькие магазины держат рекламу","Шесть магазинов-лидеров крутят рекламу в Meta, у Ancestral 75 объявлений идут 90+ дней ◆. Мелкие бренды здесь живут годами."]],"take":"Ближе всех к порогу по главной линзе: в Facebook держатся три молодые копии, Wild Gold, Bare Ritual и Holicow, все в основном от своего имени. Amazon это подтверждает: больше всего пробившихся брендов-новичков, и бренд продаёт в 1,7 раза дороже безымянных. Против: спрос остывает, а обещать помощь при экземе нельзя, поэтому нужно проверить, продаётся ли бальзам без этого. Не посчитано, сколько остаётся на рекламу в своём магазине.","next":["Почему у Terra Lotus упали отзывы и выросла доля плохих","Поиск раз в месяц: продолжается ли остывание","Деньги своего магазина: сколько с заказа остаётся на рекламу","Тест спроса без обещаний про экзему"]},"shower_filter":{"claim":"В видео про бюджетный старт за $500 упоминается бренд душевых леек с фильтром Eskin: $1,4 млн в месяц по оценке трекера. Совет: делать рекламу и страницу как у лидера.","reality":[["Спокойный рынок","Поиск +10% («filtered shower head» +22%) ◆. На Amazon покупают 104 тыс. штук в месяц ◆."],["Никто не доминирует","У трёх лидеров 44% полки ◆. Лидеры, старые бренды Amazon: FEELSO (6+ лет), SR SUN RISE, MakeFit."],["Новички пробиваются","Из 63 новых продавцов 8 продают 1 000+ в месяц: 13% (от 7 до 23%) ◈. 7 из 8 безымянные по названию карточки."],["Молодых брендов-победителей нет","Единственный бренд среди восьми, Magichome, продаёт на Amazon во Франции с 2019 года ◆. Без него 7 из 62 (11%)."],["Магазин-лидер стоит на месте","Sproos: 329 отзывов за август–октябрь против 344 год назад ◆. Отзывы смещаются на сменные картриджи по подписке, а новых устройств продаётся меньше ◈. При этом 97 из 120 объявлений Sproos крутятся 90+ дней ◆."],["Цены слегка ползут","Постоянные скидки; у части моделей цена сползла с $30 до $22 ◈. Войны нет."],["Вход сложнее обычного","Душевая лейка считается сантехникой: расход воды ограничен федеральным законом (2,5 галлона в минуту), а в Калифорнии модель нужно сертифицировать и внести в реестр до продажи ◆. Обещать пользу для здоровья или «убивает бактерии» нельзя ◈. Цены испытаний не публикуют, нужны расценки подрядчиков."]],"take":"Спокойный рынок без доминанта, деньги в подписке на картриджи, как у Sproos. Но среди пробившихся нет ни одного молодого бренда, а до первой продажи нужны испытание расхода воды и решение по Калифорнии. Пока не проходит порог.","next":["Экономика подписки на картриджи","Расценки на испытание расхода воды и регистрацию в Калифорнии","Возраст бизнеса безымянных победителей"]},"persimmon_soap":{"claim":"Разбор Suva: мыло с хурмой от «возрастного запаха» для пожилых покупателей в Facebook, $0,8–1,6 млн в месяц. В рекламе ИИ-«внучка» и статья, якобы написанная врачом.","reality":[["Поиск вырос, но ищут бренды","Запрос вырос в 4,7 раза за год, «nonenal» почти в 3 раза ◆. Ищут в основном бренды: Mirai, Swarva, Kaori; среди растущих запросов есть «is persimmon soap a hoax» ◈. Запрос редкий (13% недель с нулём), поэтому цифра шумная."],["Рынок маленький и плотный","На Amazon покупают 70 тыс. штук в месяц ◆. У трёх лидеров 62% ◆."],["Новички пробиваются редко","Из 67 новых продавцов 7 продают 1 000+ в месяц: 10% ◈."],["Но в рекламе растёт молодой бренд","Kaori: домен с февраля 2026-го, уже 750 объявлений в Meta, 210 из них идут 90+ дней ◆. Растёт через свой магазин, а не через Amazon."],["Старый лидер тоже растёт","Mirai Clinical (с 2014 года): 947 отзывов в магазине за август–октябрь против 471 год назад, вдвое больше ◆."],["Копии начинают держаться","За два года мыло с хурмой рекламировали в США 150 магазинов и страниц; в архиве BigSpy 90+ дней продержали только двое: Mirai Clinical (513 дней, крутится) и Kaori (старейшее объявление идёт с 20 марта и крутится до сих пор) ◆ (BigSpy, 11.11.2026). Ещё 8 дошли до 61–88 дней. Волна копий, начатая в августе–сентябре 2026-го, ещё жива на 46–88 днях; декабрьская проверка покажет, перейдут ли они 90 ◈. Сейчас в Meta 90+ дней держат ещё Swarva (давний магазин, 124 дня), Cachi Naturals (91 день) и Bella Via (90 дней) ◆; обе последние молодые и перешли 90 дней только что; Cachi Naturals рекламируется от своего имени, Bella Via от выдуманной «Mari Tanaka» (архив Meta, 11.11.2026)."],["Цены: давление у дешёвых наборов","Наборы по 3–5 брусков подешевели примерно на 20% ($7–10), Mirai с $23 до $18–20 ◈. Войны нет."]],"take":"На Amazon тесно, а рост поиска во многом дают поиски самих брендов. Окно: свой магазин и реклама в Meta на аудиторию 55+, как делает Kaori; за ней уже держатся ещё две молодые копии, Cachi Naturals и Bella Via. Риск: обещания про запах тела и выдуманные «врачи» в рекламе.","next":["Как Kaori вырос за 9 месяцев: креативы и воронка","Экономика своего магазина: набор мыла и реклама в Meta","Правила Meta для рекламы на аудиторию 55+"]},"body_oil":{"claim":"Два разбора магазина God Silk (GODA): масло для тела от дряблости, $2,1 млн за 180 дней и 400–500 заказов в день. Советуют копировать страницу и рекламу «до/после» морщин.","reality":[["Спрос по Google не читается","«Crepey skin» называет проблему, по нему ищут кремы и лосьоны. «Firming body oil» +52%, но запрос редкий ◈. Спрос виден только на Amazon."],["Один новичок пробился","GODA продаёт 20 тыс. в месяц на Amazon и крутит 4 400 объявлений в Meta, 580 из них 90+ дней ◆. Фото-отзывов в магазине примерно в 5 раз больше, чем год назад ◈."],["Но GODA не стартап","Это бренд парфюма с феромонами, который добавил масло; отзывы в магазине с декабря 2023-го ◆. Год основания не нашли."],["Остальным тяжело","В нише «от дряблости» из 43 новых продавцов 3 продают 1 000+: 7% (от 2 до 19%) ◈. Ниша плотная: индекс концентрации 2 366 ◆."],["Замер сузили до нашего товара","Раньше в 197 тыс. продаж попадали все масла для тела (Palmer's, Neutrogena, Aveeno). Только масла от дряблости: 52 тыс. в месяц ◆."],["Цены ровные","GODA снизил цену с $47 до $33–35 в январе и держит её; большие бренды не двигаются ◈."]],"take":"Пример одного победителя на старой полке. Повторить GODA можно только через свой магазин и много рекламы в Meta; на Amazon в этой нише пробились трое из 43.","next":["Сколько тратит GODA на рекламу","Год основания GODA","Отдельный замер полки только «firming / crepey»"]},"scent_diffuser":{"claim":"Разбор Ulfia Studio: премиальный аромадиффузор в стиле парфюмерного флакона, $161–279 тыс. в месяц (автор думает, что до $600 тыс.). В видео ультразвуковая модель, мы мерили безводные (waterless).","reality":[["Поиск растёт, но не только наш товар","«Waterless diffuser» вырос вдвое к прошлому году ◆, но по нему ищут и обычные масляные диффузоры ◈. Более широкий «scent diffuser»: +13%."],["Магазины лидеров растут","Scentify вдвое, Aura House в 2,7 раза (сам диффузор: 26 → 139 отзывов в октябре), Aroma360 в 1,4 раза, но октябрь подняла акция ◆. Это самое подтверждённое отзывами движение во всём списке."],["Но на Amazon тесно","Из 78 новых продавцов только 6 продают 1 000+: 8% (от 4 до 16%) ◈. Рынок на Amazon небольшой: 58 тыс. в месяц ◆."],["Лидеры старые","AirScent основан в 1946 году, Scentify работает примерно с 2020-го ◆. Молодого победителя не нашли."],["Цены: дорогой запуск и откат","Новые модели выходят по $130 и за пару месяцев опускаются до $80–90: обычное стартовое ценообразование ◈. Войны нет."],["Реклама скромная","У лидеров в Meta меньше 100 объявлений, работающих 90+ дней ◆. Растут за счёт своих магазинов."]],"take":"Рынок растёт, но рост забирают старые магазины-бренды. Окно для новичка: премиальный бренд со своим магазином и сменными ароматами (повторные покупки). На Amazon пробиться трудно.","next":["Экономика сменных ароматов (повторные покупки)","Ультразвуковые модели из видео требуют отдельного замера","Точная цена поставщика премиальной модели"]},"turmeric_soap":{"claim":"Разбор Earthly Derm: мыло с куркумой от пигментных пятен, $7–14 млн в месяц по оценке автора. Хвалит правдоподобные отзывы без обещаний вылечить.","reality":[["В TikTok Shop это большая тема","По запросу «turmeric soap» в TikTok Shop лидируют корейские бренды: у medicube набор с койевой кислотой и куркумой продан 154 тыс. раз, гель для душа 109 тыс.; у Dr.Melaxin спрей с куркумой 741 тыс., мыло 45,6 тыс. по $24,70 ◆ (счётчики продаж за всё время, TikTok Shop через Apify, 11.11.2026). Earthly Derm в TikTok Shop нет."],["В рекламе Facebook за лидером идёт волна","Earthly Derm: 88 объявлений старше 90 дней, 44 старше 180, все от своей страницы ◆. За ним держатся молодые Solrise (домен с апреля 2025-го, объявление 477 дней), Glowvani (14 объявлений, 112 дней) и Derm Glow (16 объявлений, 112 дней), все от своего имени ◆. STEM & SOUL держит 166 объявлений 90+ дней, 91 старше 180, самое старое 371 день; возраст домена не проверен (реестр .co не отвечает, первая копия сайта в Wayback — май 2026-го) ◈. Новые Curculia Paris, Kaoli, Kevaros, Truetona запустились 1–41 день назад ◆ (архив Meta через Apify, 11.11.2026)."],["Деньги: наборы, а не брусок","На Amazon один брусок за $11 почти ничего не оставляет ◈. Но Earthly Derm продаёт в своём магазине наборы по 1–5 брусков с подпиской (3 бруска $39–49), Dr.Melaxin берёт $24,70 за брусок в TikTok Shop ◆. С заказа на $40–50 после товара, почты и комиссий остаётся грубо $25–30 до рекламы, как у мыла с хурмой ◈."],["Спрос падает","Все формулировки вместе («turmeric soap», «kojic acid soap», «turmeric bar») дают −27% к прошлому году с поправкой на фон (среднее двух замеров, 9 и 10 ноября) ◆."],["Но один бренд растёт быстро","Earthly Derm: 2 553 отзыва на мыло за август–октябрь против 334 год назад, в 7,6 раза больше, рост почти каждый месяц ◆. Сайт с января 2024-го, 530 объявлений в Meta ◆."],["Amazon держат другие","Полку держат мыла с койевой кислотой (Valitic, 30 тыс. в месяц); у трёх лидеров 60%, высокая концентрация ◆."],["Новички пробиваются редко","Из 92 новых продавцов 8 продают 1 000+: 9% ◈."],["Сумма из видео не подтверждается","Автор называет $7–14 млн в месяц. Для этого нужно 156–311 тыс. заказов, а новых отзывов на главное мыло 850–960 в месяц: отзыв оставлял бы 1 покупатель из 163–365. Скорее всего, сумма завышена ◈. Разбор этой проверки ниже."],["Цены: давление у дешёвых наборов","Наборы по 5 брусков подешевели с $10 до $7 (~$1,40 за брусок); Valitic держит цену ◈."]],"take":"Не только Earthly Derm. В Facebook за лидером держатся три молодые копии (Solrise, Glowvani, Derm Glow) и STEM & SOUL, и идёт свежая волна; в TikTok Shop тему «койевая кислота + куркума» продают корейские бренды. Вывод «денег нет» верен только для одного бруска на Amazon за $11: в своём магазине мыло продают наборами (у Earthly Derm 3 бруска за $39–49), и с такого заказа на рекламу остаётся заметно больше ◈. Против: поиск в Google падает, обещания про пятна похожи на лечебные.","next":["Возраст STEM & SOUL и доживут ли до 90 дней Curculia Paris и Ka ta Ads Library (3,700 объявлений за всё время). Точный трафик, AOV и число заказов не приведены.","caveat":"Оценка выручки в $8.2M/мес является косвенным расчетом по количеству активных объявлений в Meta Ads Library, а не зафиксированной банковской выручкой."}]},"cred":{"bench":{"median":1.98,"top10":6.3,"src":"https://littledata.io/average-website-performance","beauty_cr_max":5.38,"beauty_src":"https://marketing.dynamicyield.com/benchmarks/conversion-rate/"},"rows":[{"store":"Earthly Derm","pid":"turmeric_soap","video":"zRMForJwsy8","quote":"Just look at the revenue numbers 7 to $14 million a month ... close to a million monthly visitors or 900,000","tier":"◆","claim":"$7–14 млн","visits":"900–913 тыс.","rpv":"$7,7–15,6","gap":"4–8 раз","note":"Трафик назвал сам автор, её же показывает SimilarWeb (913 тыс. за сентябрь). Даже лучшие 10% магазинов на Shopify зарабатывают $6,30 с визита."},{"store":"Skult","pid":"chin_wrap","video":"dZRoQlQF9WQ","quote":"with a 2,000 active ads number we're looking at $8.2 million every single month ... anywhere between 4 to 7 million","tier":"◈","claim":"$4–8,2 млн","visits":"16–27 тыс.","rpv":"$148–512","gap":"75–259 раз","note":"Трафик по SimilarWeb (сервис оценки трафика), он неточен для маленьких сайтов. Но даже если визитов в 10 раз больше, нужно $15–51 с визита, больше, чем у лучших 10% магазинов."}],"points":[["Выручку считают по рекламе","Совет из видео: «умножь число объявлений на 100, получишь выручку». Сумму $8,2 млн для Skult автор выводит из «2 000 активных объявлений». Но число объявлений показывает, сколько магазин тестирует, а не сколько продаёт: сколько из них окупается, по их числу не видно."],["Цифры из сервисов-шпионов","Суммы в роликах взяты из оценок Winning Hunter (платного сервиса слежки за конкурентами) и собственного «оценщика выручки» автора по числу объявлений и трафику. Отчётности магазинов там нет."],["Каждое видео продаёт курс","Ролики заканчиваются рекламой программы автора и его сервиса для клонирования страниц (подписка $79). «Магазин делает $X млн» служит витриной этой воронки."],["Метод: клонировать, а не проверять","Формула канала: «мы не строим бизнес с нуля, мы клонируем работающий магазин». Вопрос, выживет ли ещё один клон, в видео не задаётся. Именно его мы и проверили."]]},"tips":[{"sec":"stay","h":"Обещать «помогает», а не «лечит»","p":"Автор разбирает магниевый спрей, который пишет «исправляет давление», и советует: «я бы написал „помогает“, но не „лечит“». Обещание вылечить делает косметику лекарством в глазах FDA (Управления по контролю за продуктами и лекарствами США).","risk":"legal","src":[["e87jdUzxgpY","magnesium_spray"]]},{"sec":"stay","h":"Не показывать резких «до/после» с телом","p":"Про масло для тела: крупные бренды крутят ролики «было толстое тело → стало худое», но новичку автор так делать запрещает: «забанят в ноль». Безопасно показывать результат на коже и морщинах.","risk":"legal","src":[["ezFy2gHYXSE","body_oil"]]},{"sec":"stay","h":"Результат на ресницах показывать можно","p":"Про сыворотку для ресниц: «это не фитнес-преображение, за которое банят». До/после ресниц Meta пропускает, и бренд строит на этом всю рекламу и страницу.","risk":"legal","src":[["aoTzuwQrCiw","lash_serum"]]},{"sec":"stay","h":"Отсеивать товары, за которые банят","p":"Автор отказался от «мгновенной подтяжки живота»: «не хочу бан в Facebook за такую рекламу». Риск бана отсеивает товары уже на этапе выбора.","risk":"legal","src":[["cmfJ_sxiO68","color_foundation"]]},{"sec":"stay","h":"Проверять ограничения до запуска","p":"ИИ-помощник по поставщикам спрашивает про ограничения категории, а проверка товара включает правила площадок. Для нас: проверить правила Meta и FDA на категорию до закупки.","risk":"legal","src":[["z06laDSzT9M","prewash_oil"],["oDgModChsIo","dog_fountain"]]},{"sec":"stay","h":"Несколько агентских рекламных аккаунтов","p":"У миллионных брендов «несколько агентских рекламных аккаунтов», поэтому им сходит с рук жёсткая реклама. Сами такие аккаунты я возврата в конце страницы.","risk":"legal","src":[["oDgModChsIo","dog_fountain"],["iIYC7y0Xxvs","exfoliating_towel"]]},{"sec":"sell","h":"Размеры, которые ничего не меняют","p":"Автор заметил: бренд продаёт варианты «под размер собаки», хотя всем шлёт одно и то же: «чисто маркетинговый трюк». Это введение покупателя в заблуждение.","risk":"risk","src":[["cmfJ_sxiO68","color_foundation"]]},{"sec":"sell","h":"Сначала перепродажа, потом своя марка","p":"Начать с дропшиппинга (продажи чужого товара без склада), а когда товар пошёл, заказать свою этикетку: маржа резко растёт.","risk":"legal","src":[["ezFy2gHYXSE","body_oil"],["e87jdUzxgpY","magnesium_spray"]]},{"sec":"sell","h":"Та же страница на другом языке","p":"Бренд крема для депиляции держит копию страницы на французском и заходит во Францию.","risk":"legal","src":[["fIIQuEV_RCQ","hair_removal_cream"]]},{"sec":"ads","h":"ИИ-аватар вместо реального покупателя","p":"Почти во всех видео ИИ-«покупательница» рассказывает свою историю, а поверх идёт нарезка видео, «чтобы нельзя было понять, что это ИИ». С 2024 года FTC (Федеральная торговая комиссия США) запрещает выдуманные отзывы, в том числе сгенерированные ИИ ◈.","risk":"risk","src":[["cmfJ_sxiO68","color_foundation"],["q85augBJ9Kk","tallow_balm"],["W65gSMrv2p8","whitening_powder"],["fylkQEOxacg","persimmon_soap"]]},{"sec":"ads","h":"ИИ-«эксперт»: ветеринар, врач","p":"Поилку рекламирует «ИИ-ветеринар Jacob Burgerman». Статью про мыло с хурмой якобы «написал врач», и автор сам в этом сомневается. Сыворотку продают под заголовком «дерматолог из Стэнфорда предупреждает». Выдуманный эксперт: самый рискованный приём.","risk":"risk","src":[["oDgModChsIo","dog_fountain"],["fylkQEOxacg","persimmon_soap"],["reFwcjsOYiU","hair_serum"]]},{"sec":"ads","h":"ИИ-двойник реального блогера","p":"Обучить ИИ на ролике настоящего блогера с отзывом и сменить голос; сделать инфлюенсера «похожего, но не того же человека». Риск исков за чужой образ и бана.","risk":"risk","src":[["q85augB method v2.3 (2026-11-10). 'go' = passes the absolute floor of METRICS.md v2.3 item 6; empty today. Reasons quote metrics_v23.json, KEYWORD_AUDIT_2026-11-10.md, margin.json and ENTRY_REQUIREMENTS_US_2026-11-10.md; keep them in sync when the data changes. 2026-11-11 (owner): groups follow lens M (METRICS v2.4): watch = at least one young copy holding a 90+ day ad; no = none. Verdict texts start with Facebook.","go":[],"watch":["tallow_balm","whitening_powder","persimmon_soap","lash_serum","color_foundation","turmeric_soap"],"no":["dog_fountain","hair_serum","shower_filter","body_oil","scent_diffuser","compression_socks","neck_cream","pore_patch","rosemary_oil","prewash_oil","hair_removal_cream","exfoliating_towel","magnesium_spray","chin_wrap"],"head":{"go":["Заходить","Порог по Facebook: две молодые копии держат рекламу 90+ дней, со своего магазина остаются деньги на рекламу, а главное обещание товара можно повторить законно. Полностью сегодня не проходит ни один товар"],"watch":["Наблюдать","В Facebook держится хотя бы одна молодая копия. У каждого написано, чего не хватает до порога"],"no":["Не заходить","В Facebook молодых копий нет: рекламу 90+ дней держат только лидер или давние магазины"]},"why":{"color_foundation":"Facebook: держатся пять молодых копий. Сильнее всех Hestia, тот самый магазин из видео: домен с марта 2026-го, 383 объявления 90+ дней, а её вторая витрина Lumine Skin держит объявление 371 день ◆. Дальше Hanae (стик, 245 дней), Yuki (40 объявлений, 125 дней, от страницы «Korean Foundation Tips»), Facelove (167 дней) и TryNova (5 объявлений, 100 дней) ◆. На Amazon пробивается каждый четвёртый новичок, но почти все безымянные, и почти половина рынка у Luxe.","lash_serum":"Facebook: держится одна молодая копия, Hanae: 185 объявлений сыворотки старше 90 дней, самое старое 124 дня ◆; долгую рекламу держат в основном старые бренды и блогеры. Обещать «рост ресниц» нельзя: по правилам FDA это заявление о лекарстве. На Amazon пробивается 13% новичков, поиск по брендам у Babe и Grande; в TikTok лидер EPAIS растёт ×6,9.","tallow_balm":"Facebook: держатся три молодые копии, Wild Gold, Bare Ritual и Holicow (7 объявлений, 163 дня); обе рекламируются от своего имени, у обеих есть объявления старше 180 дней. Лидеры по каналам: в рекламе Ancestral, на Amazon и в TikTok Terra Lotus. Минус: поиск за год −22%, а продажи Terra Lotus в TikTok вчетверо ниже её обычного месяца.","shower_filter":"Пробивается каждый восьмой новичок, но бренд виден только у одного, и он продаёт с 2019 года. Вход сложнее обычного: расход воды ограничен законом, в Калифорнии модель нужно сертифицировать до продажи. Денег впритык: 21–39% цены.","dog_fountain":"Пробивается каждый четвёртый новичок (25 из 100), но почти все они безымянные копии, а с продажи за $30 на Amazon остаётся от −$3 до +$5.","hair_serum":"Лучшая доля пробившихся новичков (29%), с продажи 34–49%, но данные Amazon сняты отдельно со страниц поиска, повторно не сверены и пересекаются с розмариновым маслом.","persimmon_soap":"Facebook: держатся три молодые копии: Kaori (235 дней, в основном через страницы с именами людей), Cachi Naturals (91 день, от своего имени) и Bella Via (90 дней, от выдуманной «Mari Tanaka») ◆; давняя Swarva держит рекламу 124 дня. На Amazon пробивается каждый десятый новичок, с продажи остаётся 27–44%; в TikTok продажи главного продавца растут (×2,4).","body_oil":"В нише «от дряблости» покупают 52 тыс. в месяц, пробились 3 новичка из 43, и рост держится на одном бренде (GODA). Денег впритык: 25–41%.","scent_diffuser":"Магазины лидеров растут, но на Amazon пробивается каждый тринадцатый, а маржа зависит от цены поставщика. Рост поиска частично относится к обычным масляным диффузорам.","turmeric_soap":"Facebook: держатся три молодые копии: Solrise (домен с апреля 2025-го, объявление 477 дней), Glowvani (14 объявлений, 112 дней) и Derm Glow (16 объявлений мыла с койевой кислотой, 112 дней), все от своего имени ◆. STEM & SOUL держит 166 объявлений 90+ дней и 91 старше 180, но возраст домена не проверен ◈. Лидер Earthly Derm: 88 объявлений 90+ дней ◆. В TikTok Shop тему «койевая кислота + куркума» продают корейские бренды десятками тысяч штук ◆. На Amazon по $11 за брусок денег нет, но в своём магазине мыло продают наборами.","compression_socks":"Полка большая (232 тыс. в месяц) и раздробленная, но её держат старые бренды, а с набора за $15 остаётся от −$1 до +$4.","neck_cream":"Полку держат старые бренды ухода, новички почти не пробиваются (7%).","pore_patch":"Полку держит Bioré: у трёх лидеров 81% продаж.","rosemary_oil":"Спрос падает, и рынок пересекается с сыворотками для волос.","prewash_oil":"У самого товара маленькая полка (37 тыс. в месяц), пробился 1 новичок из 17. При цене ~$11 с продажи остаётся 11–28%.","whitening_powder":"Facebook: держатся две молодые копии, MYTO и MOOTHS, обе рекламируются почти только от своего имени. Продают минеральный зубной порошок вместо пасты. На Amazon это самая маленькая полка из 20 (17 тыс. покупок в месяц).","hair_removal_cream":"Veet и Nair держат 85% полки, пробились 3 новичка из 50, а при цене ~$10 Amazon забирает больше половины.","chin_wrap":"Facebook: молодой копии нет. K-Glow, которую мы считали копией, продаёт бальзам и щётку для лица, а не маску ◆. На Amazon полка маленькая, новички почти не пробиваются (4%), в Google товар почти не ищут.","exfoliating_towel":"Полку держат Goshi и безымянные продавцы, пробивается 4% новичков.","magnesium_spray":"Рынок старых wellness-брендов (3% новичков), а при цене ~$14 с продажи остаётся 13–29%."},"change":{"dog_fountain":"Молодая копия в Facebook с рекламой 90+ дней: сейчас держится только давний магазин. На Amazon с продажи почти ничего не остаётся: нужен поставщик дешевле ~$4,5 или цена от $40.","hair_serum":"Молодая копия в Facebook с рекламой 90+ дней: сейчас держатся только давние магазины. Данные Amazon по этому товару сняты отдельно со страниц поиска и повторно не сверены.","persimmon_soap":"Это история своего магазина и рекламы, как у Kaori. Cachi Naturals и Bella Via только что перешли 90 дней: замер 11 декабря покажет, удержатся ли они; Cachi интереснее, она рекламируется от своего имени.","body_oil":"Молодая копия в Facebook с рекламой 90+ дней: сейчас держится только давний магазин. На Amazon пробился один бренд, GODA.","scent_diffuser":"Молодая копия в Facebook с рекламой 90+ дней: сейчас держится только давний магазин. На Amazon: если модель у поставщика обходится до ~$20, с продажи остаётся 40%+.","turmeric_soap":"Перспективно, наблюдаем. Чем интересно: у лидера Earthly Derm самая долгая честная реклама в нише (88 объявлений 90+ дней, все от своего имени), за ним держатся три молодые копии (Solrise 477 дней, Glowvani, Derm Glow) и STEM & SOUL, и идёт свежая волна, а в TikTok Shop тема «койевая кислота + куркума» продаёт десятки тысяч штук. Мыло дешёвое, лёгкое и расходное, продаётся наборами по $39–49. Следующий шаг: прогнать через BigSpy, сколько копий уже сдалось; 11 декабря посмотреть, перейдут ли 90 дней Curculia Paris и Kaoli; проверить возраст STEM & SOUL.","tallow_balm":"Посчитать деньги своего магазина (сколько с заказа остаётся на рекламу) и проверить, продаётся ли бальзам без обещаний про экзему. Поиск и TikTok смотрим раз в месяц.","color_foundation":"Копий уже пять, повторить модель можно. Решит, продаётся ли стик без обещаний, которые нельзя повторить, и сколько остаётся с заказа в своём магазине.","shower_filter":"Хотя бы одна копия после лидера с рекламой 90+ дней: сейчас ни одной. Вход требует сертификации для Калифорнии.","lash_serum":"Найти вторую молодую копию, кроме Hanae, и проверить, продаётся ли сыворотка с разрешённым обещанием «ресницы выглядят гуще».","whitening_powder":"Найти лидера ниши и прогнать «tooth powder» через архив BigSpy: сколько копий уже сдалось.","chin_wrap":"Молодой магазин, который держит рекламу именно маски 90+ дней. В новой волне есть Chinology (77 дней), но её товар ещё не проверен."},"_followers_note":"Lens M, metric M2 (METRICS.md v2.4). Source: work/lensm/M2_RESULT.md and m2_stores.csv (2026-11-10): domain date = RDAP, oldest ad = oldest ad of the domain in the phrase sample; Kaori's 210 ads at 90+ = AUDIT_2026-11-09 §5; Hanae's Amazon units and Wild Gold's reviews = numbers already on the site. Replaces the v2.3 'winners' block (Terra Lotus, Earthly Derm, GODA are leaders or older than 24 months). Updated 2026-11-11 from Codex step 1 (work/lensm/codex/ACCEPTANCE_STEP1_2026-11-11.md): ad counts 30/60/90/180, page types, store facts. 2026-11-11: facelove-cosmetics.com added under color_foundation (its 90+ ads land on the color-changing foundation stick and mascara, not lash serum; checked in Meta Ad Library). Updated 2026-11-11 from the Apify pull (work/apify/APIFY_RESULTS_2026-11-11.md): K-Glow removed (not a chin wrap), Hanae added under color foundation, counts are full 90+ day counts of the category product. Soaps updated 2026-11-11 from the full 90+ day pull (work/apify/soap_candidates_2026-11-11.json). Watch products updated 2026-11-11 from the full 90+ day phrase pull; bar: 5+ long ads (owner: only strong signals).","followers":[{"brand":"Kaori","domain":"try-kaori.com","pid":"persimmon_soap","age":"домен с февраля 2026","fact":"Старейшее работающее объявление идёт с 20 марта, 235 дней ◆. Объявлений мыла старше 90 дней 179, из них 58 старше 180 ◆. Но от страницы магазина только 48; остальные 131 от страниц с именами людей и «бабушкиными» названиями: «Grandma's Glow», «Patti Clayton», «Linda Doxey», «Margaret Whittaker» ◆.","leader":"Лидер: Mirai Clinical, с 2014 года","reg":"2026-02-11","ad_days":235},{"brand":"Wild Gold","domain":"wildgoldtallow.com","pid":"tallow_balm","age":"домен с марта 2025","fact":"Старейшее объявление живёт 272 дня ◆. 35 объявлений старше 90 дней, 24 старше 180; все от страницы самого бренда ◆. Но отзывов в магазине стало меньше: 9 за август–октябрь против 53 годом раньше ◆.","leader":"Лидер: Ancestral","reg":"2025-03-17","ad_days":272},{"brand":"Bare Ritual","domain":"bare-ritual.com","pid":"tallow_balm","age":"домен с августа 2025","fact":"Бальзам для мужчин, возврат денег в течение 90 дней. Старейшее объявление бальзама живёт 305 дней ◆. Объявлений бальзама старше 90 дней 44, из них 21 старше 180; 43 от страницы бренда ◆. Но это лишь четверть долгой рекламы магазина: больше всего (83) у спрея для волос, и она идёт от выдуманной «Eleanor Roseford Bennett» ◆.","leader":"Лидер: Ancestral","reg":"2025-08-04","ad_days":305},{"brand":"Hanae","domain":"hanaekorea.com","pid":"lash_serum","age":"домен с ноября 2025","fact":"185 объявлений сыворотки старше 90 дней, самое старое 124 дня, старше 180 ни одного ◆. Все от двух страниц самого магазина: «Trending In Korea» (129, привязан Instagram магазина) и «Hanae Korea» (56) ◆. На Amazon 5 000+ покупок в месяц на главной карточке ◆.","leader":"Лидеры: Borboleta, Babe","reg":"2025-11-02","ad_days":124},{"brand":"Hanae","domain":"hanaekorea.com","pid":"color_foundation","age":"домен с ноября 2025","fact":"Тот же магазин, что в сыворотке: его стик «подстраивается под тон кожи». 66 объявлений старше 90 дней, 12 старше 180, самое старое 245 дней ◆. Найден 11 ноября при выгрузке рекламы Hanae ◈.","leader":"Лидеры: Luxe, Prime Prometics, Smooche","reg":"2025-11-02","ad_days":245},{"brand":"Facelove","domain":"facelove-cosmetics.com","pid":"color_foundation","age":"домен с декабря 2025","fact":"Косметика для женщин 50+. Объявлений тонального стика, который «подстраивается» под кожу, старше 90 дней 14, самое старое 167 дней, старше 180 ни одного ◆. Из 14 девять от страниц бренда, остальные от страниц вроде «The Glow Up» ◆. Больше всего долгой рекламы у магазина на тушь (25) ◆.","leader":"Лидеры: Luxe, Prime Prometics, Smooche","reg":"2025-12-28","ad_days":167},{"brand":"MYTO","domain":"getmyto.com","pid":"whitening_powder","age":"домен с декабря 2025","fact":"Старейшее объявление живёт 135 дней ◆. Всего ~150 объявлений, из них 27 старше 90 дней, все от страницы самого бренда ◆. Банка $29,99, на странице предложено автопополнение ◆. Продаёт минеральный порошок вместо пасты; отбеливание в рекламе на втором плане ◆. Классический отбеливающий порошок (например, с углём) в США почти не держится: из 40 рекламодателей за два года 90+ дней продержал объявление один ◆ (BigSpy, 11.11.2026).","leader":"Лидер ниши не определён","reg":"2025-12-19","ad_days":135},{"brand":"MOOTHS","domain":"trymooths.com","pid":"whitening_powder","age":"домен с мая 2026","fact":"Старейшее объявление живёт 101 день ◆. Всего ~55 объявлений, из них 7 старше 90 дней, 6 из них от страницы бренда ◆. Тоже минеральный порошок вместо пасты ◆.","leader":"Лидер ниши не определён","reg":"2026-05-12","ad_days":101},{"brand":"Glowvani","domain":"glowvani.com","pid":"turmeric_soap","age":"домен с января 2025","fact":"Мыло с куркумой «Brightening Beauty Bar». 14 объявлений старше 90 дней, самое старое 112 дней, все от своей страницы ◆.","leader":"Лидер: Earthly Derm","reg":"2025-01-15","ad_days":112},{"brand":"Cachi Naturals","domain":"cachinaturals.com","pid":"persimmon_soap","age":"домен с августа 2026","fact":"Мыло с хурмой против запаха 2-ноненала. 7 объявлений старше 90 дней, самое старое 91 день, все от своей страницы ◆. Перешла 90 дней только что ◈.","leader":"Лидер: Mirai Clinical, с 2014 года","reg":"2026-08-03","ad_days":91},{"brand":"Bella Via","domain":"bellaviashop.com","pid":"persimmon_soap","age":"домен с марта 2026","fact":"6 объявлений старше 90 дней, самое старое 90 дней; все от страницы выдуманной «Mari Tanaka» и ведут на статью «Is your persimmon soap real?» ◆.","leader":"Лидер: Mirai Clinical, с 2014 года","reg":"2026-03-25","ad_days":90},{"brand":"Solrise","domain":"shopsolrise.com","pid":"turmeric_soap","age":"домен с апреля 2025","fact":"Мыло с куркумой и койевой кислотой «Glow Bar». 6 объявлений старше 90 дней, 5 старше 180, самое старое 477 дней, все от своей страницы ◆.","leader":"Лидер: Earthly Derm","reg":"2025-04-23","ad_days":477},{"brand":"Derm Glow","domain":"myskincycle.co лько «chin strap», но так называют и ремешки от храпа и для шлемов; он за год не изменился. Спрос на этот товар виден только на Amazon: около 42 тыс. покупок в месяц."],"body_oil":["Спрос: запрос не про товар","Прежний запрос «crepey skin» называет проблему: по нему ищут в основном кремы и лосьоны. Запрос про сам товар («firming body oil») слишком редкий. Спрос на этот товар виден только на Amazon: около 52 тыс. покупок в месяц.","не про товар"]},"revenue_override":{"turmeric_soap":["bad","У главного мыла 850–960 новых отзывов в месяц. Если бы заказов было 156–311 тыс., отзыв оставлял бы 1 покупатель из 163–365. Это подозрительно мало. Разбор ниже."],"chin_wrap":["bad","Сумму автор не измерял, а вывел из числа объявлений. Число объявлений показывает, сколько магазин тестирует, а не сколько продаёт. На Amazon у Skult около 1 000 покупок в месяц. Разбор ниже."]},"a1_caveat":{"color_foundation":"По этому запросу ищут в основном три бренда: Luxe, Smooche и Prime Prometics; это след их рекламы, а не спрос на товар вообще.","persimmon_soap":"По этому запросу ищут в основном бренды (Mirai, Swarva, Kaori); среди растущих запросов есть «is persimmon soap a hoax».","scent_diffuser":"Запрос «waterless diffuser» ловит и обычные масляные диффузоры; более широкий «scent diffuser» вырос на 13%.","turmeric_soap":"Самый частый связанный запрос «kojic turmeric soap»: рынок здесь держит мыло с койевой кислотой.","rosemary_oil":"В этом запросе доминирует один бренд, Mielle.","magnesium_spray":"В связанных запросах много «magnesium glycinate», а это добавка, не спрей.","pore_patch":"В связанных запросах патчи от прыщей и для глаз, а не для пор носа."},"video_cost":{"lash_serum":"Автор видео называет закупку $2 за штуку оптом на Alibaba. Наш диапазон по объявлениям поставщиков $1,5–2,8: сходится ◈.","body_oil":"Автор видео называет $1 за флакон оптом на Alibaba и $9–14 при поштучной закупке на AliExpress. Наш диапазон $1–3: с оптовой ценой сходится ◈.","scent_diffuser":"Автор видео назыв const ABRE=new RegExp("(^|[^\\wА-Яа-яЁё-])("+Object.keys(ABBR).sort((a,b)=>b.length-a.length).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|")+")(?![\\wА-Яа-яЁё-])");
function abbrify(){const root=$("#app"),done=new Set(),W=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>n.parentElement.closest("script,style,button,abbr,[data-tip],h1,.nav")?NodeFilter.FILTER_REJECT:NodeFilter.FILTER_ACCEPT});
  const nodes=[];while(W.nextNode())nodes.push(W.currentNode);
  nodes.forEach(n=>{let t=n.nodeValue,m,frag=null,last=0;const re=new RegExp(ABRE.source,"g");
    while((m=re.exec(t))){const k=m[2];if(done.has(k))continue;done.add(k);frag=frag||document.createDocumentFragment();const st=m.index+m[1].length;
      frag.appendChild(document.createTextNode(t.slice(last,st)));const a=document.createElement("abbr");a.className="ab";a.dataset.tip=ABBR[k];a.textContent=k;frag.appendChild(a);last=st+k.length}
    if(frag){frag.appendChild(document.createTextNode(t.slice(last)));n.replaceWith(frag)}})}
