<meta charset="utf-8">
<title>Shelf Survey US 2026</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;600;700;800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a field report — sticky masthead, a chart-first overview (market map → top 5 → all 20), one long page per category with charts set into the text. */
:root{
  --paper:#F2F3EF; --card:#FFFFFF; --ink:#18201D; --muted:#5D6762; --faint:#8C958F; --line:#D8DCD5; --wash:#E7EAE4;
  --accent:#2350B8; --accent-wash:#E3E9F7;
  --good:#1D7F49; --good-wash:#DDEFE3; --warn:#B87A0B; --warn-wash:#F6EBD3; --bad:#B8402B; --bad-wash:#F5E0DA; --violet:#7A55B8; --violet-wash:#ECE5F6;
  --c1:#2350B8; --c2:#C0562E; --c3:#1D7F49; --c4:#8A5BB8; --c5:#B87A0B;
  --k-new:#1D7F49; --k-gen:#D79B2B; --k-est:#6F8FD0; --k-old:#7E8781; --k-genold:#C7CBC5;
  --a1:#C9D6F2; --a2:#8EA8E2; --a3:#4F73C9; --a4:#1F3F8F;
  --f-head:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#111513; --card:#181D1B; --ink:#E6EBE7; --muted:#A1ABA5; --faint:#748079; --line:#2B332F; --wash:#1F2522;
  --accent:#86A8F2; --accent-wash:#1E2843;
  --good:#5CC48A; --good-wash:#16301F; --warn:#E3B04B; --warn-wash:#33280F; --bad:#EE7F68; --bad-wash:#3A1D17; --violet:#B497E8; --violet-wash:#2A2140;
  --c1:#86A8F2; --c2:#EE8F66; --c3:#5CC48A; --c4:#B497E8; --c5:#E3B04B;
  --k-new:#4DB67D; --k-gen:#D9A443; --k-est:#7F9EE0; --k-old:#7C8781; --k-genold:#46504B;
  --a1:#25345C; --a2:#3A5596; --a3:#6286D8; --a4:#A9C0F4; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#111513; --card:#181D1B; --ink:#E6EBE7; --muted:#A1ABA5; --faint:#748079; --line:#2B332F; --wash:#1F2522;
  --accent:#86A8F2; --accent-wash:#1E2843;
  --good:#5CC48A; --good-wash:#16301F; --warn:#E3B04B; --warn-wash:#33280F; --bad:#EE7F68; --bad-wash:#3A1D17; --violet:#B497E8; --violet-wash:#2A2140;
  --c1:#86A8F2; --c2:#EE8F66; --c3:#5CC48A; --c4:#B497E8; --c5:#E3B04B;
  --k-new:#4DB67D; --k-gen:#D9A443; --k-est:#7F9EE0; --k-old:#7C8781; --k-genold:#46504B;
  --a1:#25345C; --a2:#3A5596; --a3:#6286D8; --a4:#A9C0F4; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:400 17px/1.6 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
a{color:var(--accent)} a:hover{text-decoration-thickness:2px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:3px}
h1,h2,h3,h4{font-family:var(--f-head);text-wrap:balance;line-height:1.15;margin:0}
code{font:400 .82em var(--f-mono);background:var(--wash);padding:1px 5px;border-radius:4px;word-break:break-word}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:600 12px/1.2 var(--f-head);letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
/* masthead */
.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--paper);border-bottom:1px solid var(--line)}
.mast .wrap{display:flex;align-items:center;gap:20px;padding-block:12px;flex-wrap:wrap}
.logo{font:800 17px/1 var(--f-head);color:var(--ink);text-decoration:none;display:flex;align-items:baseline;gap:8px}
.logo small{font:500 12px var(--f-mono);color:var(--muted)}
.nav{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.nav a{font:600 14px var(--f-head);color:var(--muted);text-decoration:none;padding:6px 10px;border-radius:6px}
.nav a[aria-current="page"]{color:var(--ink);background:var(--wash)}
.nav a:hover{color:var(--ink)}
main{padding-block:28px 64px}
/* tiers */
.tier{font-size:.8em;margin-left:2px;cursor:help}
.tier.t1{color:var(--ink)} .tier.t2{color:var(--muted)} .tier.t3{color:var(--warn)}
/* overview */
.hero{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;margin-bottom:22px}
.hero h1{font-size:clamp(30px,4.6vw,52px);font-weight:800;letter-spacing:-.02em;max-width:18ch}
.hero .lede{max-width:68ch;color:var(--muted);font-size:18px}
.hero .lede p{margin:.4em 0} .hero .lede ol{margin:.3em 0;padding-left:1.3em}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel-h{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:baseline;justify-content:space-between;margin-bottom:10px}
.panel-h h2{font-size:21px;font-weight:700}
.cap{font:400 14px/1.45 var(--f-head);color:var(--muted);max-width:80ch}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 13px var(--f-head);color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.chartbox{position:relative;width:100%}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--paper);font:500 13px/1.4 var(--f-head);padding:8px 10px;border-radius:6px;max-width:260px;z-index:5;transform:translate(-50%,calc(-100% - 12px))}
.tip b{font-weight:700}
.tip[hidden]{display:none!important}
svg text{fill:var(--muted);font-family:var(--f-head);font-size:12px}
svg .lbl{fill:var(--ink);font-weight:600}
.dot{cursor:pointer;transition:opacity .15s}
.dot:hover{stroke:var(--ink);stroke-width:2}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:42px 0 14px;flex-wrap:wrap}
.section-title h2{font-size:28px;font-weight:800;letter-spacing:-.01em}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column;text-decoration:none;color:inherit;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .ph{aspect-ratio:4/3;background:var(--wash);position:relative;overflow:hidden}
.card .ph img{width:100%;height:100%;object-fit:cover;display:block}
.card .rk{position:absolute;left:10px;top:10px;font:800 13px var(--f-head);background:var(--card);color:var(--ink);border-radius:20px;padding:3px 9px}
.card .bd{padding:12px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
.card h3{font-size:18px;font-weight:700}
.card p{margin:0;font-size:15px;line-height:1.45;color:var(--muted)}
.minis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-top:auto;padding-top:6px;border-top:1px solid var(--line)}
.mini{display:flex;flex-direction:column;gap:1px}
.mini b{font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.mini span{font:500 11px/1.2 var(--f-head);color:var(--muted)}
.spark{display:block;width:100%;height:34px}
/* table */
.filters{display:flex;flex-wrap:wrap;gap:6px}
.chip{font:600 13px var(--f-head);border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:20px;padding:5px 12px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.tbl{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;width:100%;font:400 14px/1.4 var(--f-head)}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font:600 12px var(--f-head);color:var(--muted);letter-spacing:.03em;white-space:nowrap}
.grid20 th{cursor:pointer;user-select:none}
.grid20 th[aria-sort]::after{content:" ↓";color:var(--ink)}
.grid20 th[aria-sort="ascending"]::after{content:" ↑"}
.grid20 td{vertical-align:middle;white-space:nowrap}
.grid20 tbody tr{cursor:pointer}
.grid20 tbody tr:hover td{background:var(--wash)}
.grid20 td.n{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
.grid20 th.n{text-align:right}
.cell{display:inline-block;min-width:54px;text-align:right;padding:2px 7px;border-radius:5px}
.hbar{display:inline-block;height:8px;border-radius:2px;background:var(--k-new);vertical-align:middle;margin-left:8px}
.pill{display:inline-block;font:700 11px/1 var(--f-head);letter-spacing:.04em;text-transform:uppercase;padding:5px 8px;border-radius:20px;white-space:nowrap}
.s-top5{background:var(--good-wash);color:var(--good)} .s-challenger_compliance{background:var(--violet-wash);color:var(--violet)}
.s-reserve{background:var(--warn-wash);color:var(--warn)} .s-weak{background:var(--wash);color:var(--muted)} .s-dropped{background:var(--bad-wash);color:var(--bad)}
/* category page */
.crumb{font:600 14px var(--f-head);color:var(--muted);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.crumb a{color:var(--muted);text-decoration:none} .crumb a:hover{color:var(--ink)}
.sub{color:var(--faint);font-size:.85em}.warn{color:var(--warn);cursor:help}.lens{margin-top:14px}
.cathead{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:28px;align-items:start;margin:16px 0 22px}
.cathead h1{font-size:clamp(32px,4.4vw,50px);font-weight:800;letter-spacing:-.02em;margin:10px 0 12px}
.cathead .verdict{font-size:20px;line-height:1.45;max-width:46ch}
.cathead .photo{border-radius:10px;overflow:hidden;background:var(--wash);aspect-ratio:1/1;max-height:360px;width:100%}
.cathead .photo img{width:100%;height:100%;object-fit:cover;display:block}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:22px}
.kpi{background:var(--card);padding:12px 14px;display:flex;flex-direction:column;gap:3px}
.kpi b{font:500 22px/1.1 var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi span{font:500 12.5px/1.3 var(--f-head);color:var(--muted)}
.kpi em{font:600 12px var(--f-head);font-style:normal}
.toc{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:26px}
.lead{font-size:19px;max-width:68ch}
.body{display:grid;grid-template-columns:minmax(0,1fr);gap:0}
.sec{padding:26px 0;border-top:1px solid var(--line)}
.sec>h2{font-size:24px;font-weight:700;margin-bottom:10px;letter-spacing:-.01em}
.prose{max-width:70ch}
.prose p{margin:.55em 0} .prose ul,.prose ol{padding-left:1.25em;margin:.5em 0} .prose li{margin:.25em 0}
.prose blockquote{margin:.8em 0;padding:8px 14px;border-left:3px solid var(--line);color:var(--muted);font-style:italic}
.prose .tbl{margin:12px 0;max-width:100%}
.prose table{font-size:14px}
.fig{margin:16px 0 6px;display:flex;flex-direction:column;gap:10px}
.fig .panel{padding:16px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:14px}
.ctl{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font:500 13px var(--f-head);color:var(--muted)}
.ctl label{display:flex;align-items:center;gap:6px;cursor:pointer}
.readout{font:500 13px/1.4 var(--f-head);color:var(--muted);min-height:1.4em}
.readout b{color:var(--ink)}
/* stacked bars */
.stack{display:flex;height:34px;border-radius:6px;overflow:hidden;background:var(--wash)}
.stack div{display:flex;align-items:center;justify-content:center;font:600 12px var(--f-head);color:#fff;min-width:0;overflow:hidden;white-space:nowrap}
.stack-row{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;font:500 13px var(--f-head);color:var(--muted)}
.keys div{display:flex;justify-content:space-between;gap:10px} .keys b{font:500 13px var(--f-mono);color:var(--ink)}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
/* leaders */
.lrow{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,2fr);gap:4px 14px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center}
.lrow:last-child{border-bottom:0}
.lname{font:600 14.5px/1.3 var(--f-head)}
.lname small{display:block;font:500 12px var(--f-head);color:var(--muted)}
.lbar{display:flex;align-items:center;gap:8px;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums}
.lbar span.b{height:12px;border-radius:2px;flex:none}
.lmeta{grid-column:2;font:500 12px var(--f-head);color:var(--muted)}
.tag{font:700 10px/1 var(--f-head);letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:4px;margin-left:6px;vertical-align:1px}
.tag.new{background:var(--good-wash);color:var(--good)} .tag.old{background:var(--wash);color:var(--muted)}
/* funnel */
.fun{display:grid;grid-template-columns:minmax(110px,auto) minmax(0,1fr);gap:8px 12px;align-items:center;font:500 13.5px var(--f-head)}
.fun .bar{height:22px;border-radius:3px;background:var(--accent);display:flex;align-items:center;padding-left:8px;color:#fff;font:500 12px var(--f-mono);white-space:nowrap;min-width:2px}
.fun .val{font:500 13px var(--f-mono);color:var(--ink);margin-left:8px;white-space:nowrap}
.shops{display:flex;flex-wrap:wrap;gap:6px}
.shop{font:500 12.5px var(--f-mono);background:var(--wash);border-radius:5px;padding:4px 8px}
.shop b{font-weight:500;color:var(--accent)}
/* creatives */
.ads{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.ad{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.ad .im{position:relative;aspect-ratio:1/1;background:var(--wash)}
.ad img{width:100%;height:100%;object-fit:cover;display:block}
.ad .days{position:absolute;left:8px;top:8px;background:var(--ink);color:var(--paper);font:500 12px var(--f-mono);padding:4px 7px;border-radius:5px}
.ad .bd{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;font:400 13.5px/1.4 var(--f-head)}
.ad .bd b{font-weight:700}
.ad .bd span{color:var(--muted)}
.ad .bd a{font-size:12.5px;margin-top:auto}
.pager{display:flex;justify-content:space-between;gap:12px;margin-top:36px;flex-wrap:wrap}
.pager a{flex:1 1 220px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:14px 16px;text-decoration:none;color:var(--ink);font:700 17px var(--f-head)}
.pager a small{display:block;font:600 12px var(--f-head);color:var(--muted);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
.pager a:hover{border-color:var(--accent)}
.pager a.next{text-align:right}
.foot{border-top:1px solid var(--line);margin-top:48px;padding-top:16px;font:500 13px var(--f-head);color:var(--muted);display:flex;flex-wrap:wrap;gap:6px 18px}
.tiers{display:flex;flex-wrap:wrap;gap:6px 16px;font:500 13.5px var(--f-head);color:var(--muted)}
.empty{font:500 14px var(--f-head);color:var(--muted);padding:10px 0}
@media (max-width:820px){
  .cathead{grid-template-columns:minmax(0,1fr)}
  .cathead .photo{max-height:240px;aspect-ratio:16/10}
  .lrow{grid-template-columns:minmax(0,1fr)} .lmeta{grid-column:1}
  body{font-size:16.5px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<header class="mast"><div class="wrap">
  <a class="logo" href="#">Shelf Survey <small>US · 20 categories · Nov 2026</small></a>
  <nav class="nav" aria-label="Main">
    <a href="#" data-nav="overview">Overview</a>
    <a href="#all" data-nav="all">All 20</a>
    <a href="#method" data-nav="method">How we measured</a>
  </nav>
</div></header>

:true,"lib":"https://www.facebook.com/ads/library/?id=593764237127939"},{"img":"media/91c81591ef074b70.jpg","days":314,"start":"2025-12-29","page":"Prime Prometics","domain":"primeprometics.com","head":"Flawless Coverage Foundation for Women 50+","body":"💫 THE PERFECT MATURE FOUNDATION EXISTS?! 💫 Introducing the BEST pick for women 50+. Premium coverage. No creasing. A natural finish. ❤️ Medium-to-full coverage ❤️ Erase redness & d","video":true,"lib":"https://www.facebook.com/ads/library/?id=695228693637983"}],"photo":"media/9fae9b7bc570df28.jpg","lead":"<p><strong>Verdict: #1 of 20.</strong> Every layer we measure points the same way. This is a young market that is still growing fast, and the money in it already goes mostly to brands that did not exist on Amazon a year ago. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A foundation, usually a stick or a light liquid, that comes out of the tube in one neutral shade and \"adapts\" to the skin tone as it is blended. The pitch on every leading listing is the same: <em>one shade for everyone, made for mature skin</em>. Luxe sells it as \"for Mature Skin\", Prime Prometics as \"for Mature Women\", Prime Prometics' oldest live Meta ads say \"Color-Changing Foundation For 50+ Skin\". The buyer is a woman over 50 who is tired of shade-matching and of foundation settling into lines. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (listing titles and ad texts)</p><p>Typical price on Amazon: $21.99 median, half of all listings between $16.99 and $26.99. The three new leaders sell above that: Luxe at $27, Prime Prometics at $44, Smooche at $49. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> The first five pages of Amazon search for \"color changing foundation\" show at least <strong>322,950 purchases a month</strong> (sum of the \"bought in past month\" badges). At the listing prices that is at least <strong>$10.0 million a month</strong> on these five pages alone. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money (the badge is a floor and counts buyers, not units; discounts and multi-packs are ignored).</p><p><strong>Trend.</strong> US Google searches for \"color changing foundation\" over the last 12 weeks are <strong>4.7 times</strong> what they were in the same weeks a year ago, after correcting for a Google-wide spike in spring 2026. Yearly averages tell the same story: 0.6 → 0.8 → 2.4 → 5.3 → 26.7 (index, 2021-22 to 2025-26). The category went from almost nothing to a mass product in about 18 months. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (pull 1 of 3; the chart shows pulls 1-2)</p><blockquote>Chart: 5-year weekly search curve. The spike in April-June 2026 appears on control terms (shampoo, body lotion) in the same weeks, so it is a Google data artifact, not demand.</blockquote>"},{"h":"Who holds the market","kind":"shelf","html":"<p><span class=\"tier t1\" title=\"counted by a platform\">◆</span> (age of a brand = its oldest listing in the sample, dated from the ASIN; error about ±1-2 months)</p><p>By age of the seller (brand or unbranded listing), <strong>236,200 units a month go to sellers that are 6-12 months old</strong> and 69,400 to sellers under 6 months. Sellers older than two years take 12,100. This is the youngest shelf of all 20 categories. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>The leaders:</p><p><span class=\"tier t1\" title=\"counted by a platform\">◆</span> units and prices, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> months (ASIN dating) and revenue.</p><p>Note the ratings: 3.4-4.0 stars for the leaders. Buyers are not delighted; they are buying the promise. That is both a risk (returns, reviews) and an opening for a product that delivers better on the same promise. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>Yes, and this is the strongest case of the 20. <strong>Three brands under 24 months old sell 1,000+ a month each</strong>, and 23 unbranded listings do too. The unbranded part (90,050 units) is where the price war is: sellers like Facelove, LATORICE and MilkySeoul each sell about 10,000 a month at $29-45, without a known brand name. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>What this means for us: the brand route (own name, own store, Meta ads, Amazon as a second channel) is proven three times in 10 months. The cheap-Amazon route is crowded with unbranded sellers already. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta Ad Library, US, active ads containing the exact phrase \"color changing foundation\" (counts by Meta, 2026-11-07): <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>The largest ad market of all 20 categories. Most ads are short tests; the ones that survive belong to a few shops. In our sample, 9 of 13 shops have at least one ad running 90+ days; the oldest are magnixa.com (481 days), primeprometics.com (470) and trylumineskin.com (367). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>Brand by brand, counted on each brand's own Facebook Page: <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><div class=tbl><table><thead><tr><th>Brand</th><th>Active ads</th><th>90+ days</th><th>180+ days</th><th>Note</th></tr></thead><tbody><tr><td>Smooche</td><td>6,800</td><td>760</td><td>540</td><td></td></tr><tr><td>Prime Prometics</td><td>3,000</td><td>660</td><td>340</td><td>also runs ads from persona pages (\"Makeup Hacks for Mature Women\")</td></tr><tr><td>Luxe</td><td>2,604</td><td>78</td><td>7</td><td>rotates creatives fast; Amazon is its main channel</td></tr><tr><td>Lumine Skin</td><td>—</td><td>—</td><td>—</td><td>no Page of its own found; 12 of 23 ads with its name land on its site</td></tr></tbody></table></div><p>Hundreds of ads alive for half a year mean money keeps going into ads that pay back. Two of the three Amazon leaders also run this kind of evergreen Meta spend: the strongest sign we have that the product sells profitably on both channels. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p>Store reviews do not show the growth that search shows. <strong>Prime Prometics</strong>, the second-largest store brand: its foundation got 687 reviews in Aug-Oct 2026 vs 690 a year earlier, and has drifted from about 330 a month in spring to 199 in October. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> <strong>Smooche</strong>: photo reviews ran at 1,000-2,650 a month in Apr-Aug 2026 and then almost stopped in Sep-Oct; more likely a change in how the store asks for reviews than a sales collapse. <span class=\"tier t3\" title=\"disputed\">◇</span> Luxe's store feed has months-long gaps and is not used.</p><p>Reading: the growth in search is going to Amazon and to new brands, not to the incumbent stores. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>The oldest live ads (471 days, Prime Prometics) open with \"Color-Changing Foundation For 50+ Skin — Tired of…\". The angle is age plus frustration with ordinary foundation, not beauty in general. Smooche's 404-day ads lead with an offer (\"BUY 1, GET 1 FREE\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (<code>work/ads/longrunning_v2.json</code>, images saved)</p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Quality gap.</strong> Leader ratings of 3.4-4.0 suggest a lot of disappointed buyers; returns and reviews may hurt a newcomer as fast as they help. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>The peak may be near.</strong> Search grew ×4.7 in a year; such curves often flatten. Watch pulls 2-3 and the next months. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Brand-age dating is estimated</strong> from ASINs, not from \"Date First Available\" (not collected). <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Advertising cost</strong> is unknown; 12,000 active ads mean a crowded auction. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p><strong>#1.</strong> Pre-registered kill rules: demand is not falling (×4.66), new brands take 211,800 units/mo with many shops keeping 90+ day ads. It would drop if search interest fell below ×0.8 of last year, or if the new-brand share collapsed in a later scan.</p>"},{"h":"Methods and sources (check by hand in 5 minutes)","kind":"sources","html":"<ul><li>Amazon: search <code>color changing foundation</code> on amazon.com with delivery set to ZIP 10001; pages 1-5; read \"bought in past month\" on each card. Our scan: <code>work/blind/graveyard_us/color_foundation.json</code>, 2026-11-08.</li><li>Meta: <a href=\"https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=US&amp;q=%22color%20changing%20foundation%22&amp;search_type=keyword_exact_phrase&amp;media_type=all\" target=\"_blank\" rel=\"noopener\">Ad Library, US, active, exact phrase \"color changing foundation\"</a>; add \"start date before\" today minus 90 days for the 90+ count.</li><li>Trends: <a href=\"https://trends.google.com/trends/explore?date=today%205-y&amp;geo=US&amp;q=color%20changing%20foundation\" target=\"_blank\" rel=\"noopener\">Google Trends, US, 5 years, \"color changing found tural Beauty by Melissa Rae","domain":"borboleta.com","head":"","body":"😣 The biggest complaint I have about my lash serum…I’m distracted by my own eyelashes. 🦋🤪 Shop Borboleta Lash 🛍️ Use code MELISSA at https://borboleta.com/discount/MELISSA?ref=MELI","video":true,"lib":"https://www.facebook.com/ads/library/?id=29252125887707950"},{"img":"media/8769bfeecd1d9e7d.jpg","days":628,"start":"2025-02-19","page":"Natural Beauty by Melissa Rae","domain":"borboleta.com","head":"","body":"🏆 The best lash serum I’ve ever used - hands down. 👀 More effective, more affordable, faster results, and non irritating! 🙌🏼 Shop Borboleta Lash 🛍️ Use code MELISSA at https://borb","video":true,"lib":"https://www.facebook.com/ads/library/?id=623494927044793"}],"photo":"media/prod_lash_hanae.jpg","lead":"<p><strong>Verdict: challenger, not in the top 5 yet.</strong> On Amazon numbers alone it would rank around #2-#3: a <strong>$7.0 million-a-month</strong> shelf where eight brands under 24 months sell 1,000+ a month. Two things hold it back: products that promise \"growth\" are regulated, which costs money and limits claims; and the brand ages are estimated from product codes, not dated, after the method already mistook RevitaLash for a new brand. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"The product, size and trend","kind":"trend","html":"<p>A serum brushed on the lash line to make lashes look longer and fuller. Listings split into \"prostaglandin-free\" peptide serums (ForChics, EPAIS) and castor-oil ones (UpNature, unbranded). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> At least <strong>213,450 purchases a month</strong> on five Amazon pages (US, collected by hand), about <strong>$7.0 million a month</strong>; median price $26.98 (half between $17.99 and $44.00). Search for \"lash serum\" ×1.17 versus a year ago: <strong>flat</strong>, close to the growing line. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count/price/trend, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p>Grande Cosmetics alone: 52,000/mo, ~$1.8M. Young brands above 1,000/mo include NUNA (8,000/mo at $42.99, ~20 months) and UpNature (6,000 at $9.97, ~22 months). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> ages (ASIN-estimated; RevitaLash, Olaplex and Dr.Althea were moved to \"older brands\" by hand).</p>"},{"h":"Ads","kind":"ads","html":"<p>Meta, exact phrase \"lash serum\": 3,200 active; 1,100 (34%) 30+ days, 400 (12%) 90+, 90 (3%) 180+. 17 of 24 shops keep a 90+ day ad; oldest borboleta.com (725 days), moxielash.com (349). Brand Pages not counted yet. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Risks","kind":"text","html":"<ul><li><strong>Regulation.</strong> In the US a product claiming to <em>grow</em> lashes is treated as a drug; prostaglandin-type ingredients carry side-effect warnings. A cosmetic route exists (\"longer-looking\"), but claims and ingredients must be reviewed. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> (our flag \"COMPLIANCE\": the route exists, it costs money)</li><li><strong>Two-thirds of the shelf is old brands</strong>, Grande at the top for years. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Brand ages unverified</strong>: \"Date First Available\" could not be collected. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p>Challenger. It enters the top 5 if (1) a compliance review shows a cheap cosmetic route, and (2) dated listings confirm the young brands are really young.</p>"},{"h":"Sources","kind":"sources","html":"<p>Amazon <code>eyel ds/library/?id=1489077763025382"},{"img":"media/8feba93063534cd2.jpg","days":263,"start":"2026-02-18","page":"Bare Ritual","domain":"bare-ritual.com","head":"Someone asked if I got BOTOX. I didn't.","body":"Two weeks ago, someone at the gym asked if I'd gotten Botox. I laughed and said no. She didn't believe me. Said my face looked \"too smooth\" for someone who works construction. I've","video":true,"lib":"https://www.facebook.com/ads/library/?id=3370216843147057"},{"img":"media/88d0f08e3c1b2148.jpg","days":242,"start":"2026-03-11","page":"Bare Ritual","domain":"bare-ritual.com","head":"Buy 1 Get 1 Free — Today Only","body":"The best tallow balm on the market is usually $59.99 a jar. Today you're getting two for that. No subscription. No catch. No watered-down formula to make up the margin. Same 4 ingr","video":false,"lib":"https://www.facebook.com/ads/library/?id=917579884401653"}],"photo":"media/62c15f910002cedd.jpg","lead":"<p><strong>Verdict: #4 of 20.</strong> If the question is \"do new brands win here?\", tallow is the strongest answer of all 20 categories: <strong>nine brands under 24 months</strong> sell 1,000+ a month on Amazon, and a dozen small shops keep Meta ads running for 300-700 days. What holds it back is demand: after four years of steep growth, searches are flat. Entering now means fighting for share in a market that has stopped expanding. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A face and body balm made from rendered grass-fed beef fat, often whipped with honey or essential oils. It sells on \"ancestral\", \"clean\", \"one ingredient\" skincare: Ancestral Cosmetics' oldest ad opens with \"I made a face cream from BEEF FAT\". Buyers are people who distrust conventional skincare, men included (Forge Skin sells \"for Men\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (listings, ads)</p><p>Price: $16.95 median on Amazon (half between $9.99 and $22.99); Terra Lotus $19.99, Hearth &amp; Homestead $29.97, Forge $39.95. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> At least <strong>122,850 purchases a month</strong> on five Amazon pages, about <strong>$2.8 million a month</strong>. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p><p><strong>Trend.</strong> ×1.05 versus a year ago (control-corrected): <strong>flat</strong>. The yearly index shows why it looked so good before: 0.9 → 3.3 → 8.3 → 21.2 → 35.3 — four years of steep growth that has now levelled off. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (one pull of three)</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p>Most units go to sellers <strong>12-24 months old</strong> (55,350/mo): the wave of 2025 entrants is now the core of the shelf. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p><span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> ages and revenue.</p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>Yes: 9 young brands above 1,000/mo, plus 8 unbranded listings. The shelf is fragmented: the top three brands hold 41% of units (the lowest concentration among our top 5). Room for one more brand, but the newest cohort (under 6 months) takes only 2,650 units/mo: the door was wider in 2025 than it is now. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> counts, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> reading.</p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta, US, active, exact phrase \"tallow balm\": <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>16 of 19 shops in the sample have an ad 90+ days old. The oldest: Hibi Youth Skincare (703 days), ancestralcosmetics.com (348), byminus.com (310), bare-ritual.com (301). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>On each brand's own Page: <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><div class=tbl><table><thead><tr><th>Brand</th><th>Active</th><th>90+ days</th><th>180+ days</th><th>Reading</th></tr></thead><tbody><tr><td>byminus</td><td>150</td><td>38</td><td>17</td><td>evergreen</td></tr><tr><td>Ancestral Cosmetics</td><td>130</td><td>77</td><td>55</td><td>most evergreen: 42% of its ads live 180+ days</td></tr><tr><td>Terra Lotus</td><td>130</td><td>0</td><td>0</td><td>Amazon leader, only now testing Meta</td></tr><tr><td>Bare Ritual</td><td>77</td><td>43</td><td>21</td><td>evergreen</td></tr><tr><td>Forge</td><td>74</td><td>4</td><td>0</td><td>rotates fast</td></tr></tbody></table></div><p>Two different winning models are visible: Terra Lotus wins on Amazon without Meta; Ancestral, Bare Ritual and byminus win on their own stores with small but very long-lived ad sets. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p>The leaders move in different directions. <strong>Terra Lotus</strong>, a new brand, ramped from about 40 reviews a month in spring 2026 to about 1,350 in August, then fell to 488 in September and 336 in October; 43% of its September reviews are below five stars (26% all-time). <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> <strong>Ancestral</strong>, the older store leader, is flat year on year at 300-600 a month. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> <strong>Forge</strong> started collecting in June 2026 (93 in Aug-Oct). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> <strong>Wild Gold</strong> peaked in late 2025 and faded (9 vs 53). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>This matches flat search (×1.04): new brands still get in, but the market as a whole is not growing. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>Ancestral: \"I made a face cream from BEEF FAT\" (349 days), \"Handmade tallow products\" (341 days). Bare Ritual: \"Someone asked if I got BOTOX. I didn't.\" (263 days). Founder story and shock-value honesty, not clinical claims. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Growth has stopped</strong> (×1.05) after a 4-year boom; late entrants fight for share. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Low price floor</strong>: unbranded tallow at $9.99-19.99. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Perishability and smell</strong> (animal fat): shelf life and complaints. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Forge is not a new brand</strong> (~31 months on Amazon); corrected in v2.0 errata. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p><strong>#4.</strong> Not falling (×1.05), most new-brand winners of all categories, many shops with 90+ day ads. It would drop if search fell below ×0.8. It would rise if pulls 2-3 or the next months show growth returning.</p>"},{"h":"Methods and sources","kind":"sources","html":"<ul><li>Amazon: <code>beef tallow balm</code>, ZIP 10001 → <code>work/blind/graveyard_us/tallow_balm.json</code>.</li><li>Meta: <a href=\"https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=US&amp;q=%22tallow%20balm%22&amp;search_type=keyword_exact_phrase&amp;media_type=all\" target=\"_blank\" rel=\"noopener\">Ad .0,78.0,86.0,99.0,95.0,83.0,87.0,82.0,88.0,92.0,94.0,97.0,93.0,98.0,95.0,88.0,81.0,77.0,74.0,74.0,71.0,74.0,68.0,68.0,71.0,62.0,63.0,56.0,52.0,53.0,58.0,57.0,50.0,55.0],"mean":1.03,"pulls":{"pull1":1.02,"pull2":1.03,"pull3":1.05},"label":"flat","zeros":0.0},"reviews":{"series":[{"name":"GODA · photo reviews (est.)","pts":[["2024-07",75,true],["2024-08",90,true],["2024-09",230,true],["2024-10",210,true],["2024-11",150,true],["2024-12",120,true],["2025-01",150,true],["2025-02",215,true],["2025-03",10,true],["2025-04",90,true],["2025-05",80,true],["2025-06",10,true],["2025-07",20,true],["2025-08",25,true],["2025-09",40,true],["2025-10",25,true],["2025-11",10,true],["2025-12",35,true],["2026-01",70,true],["2026-02",35,true],["2026-03",30,true],["2026-04",15,true],["2026-05",20,true],["2026-06",120,true],["2026-07",45,true],["2026-08",60,true],["2026-09",135,true],["2026-10",270,true]],"growth":5.17},{"name":"DRMTLGY · whole store","pts":[["2024-07",null,false],["2024-08",null,false],["2024-09",null,false],["2024-10",null,false],["2024-11",null,false],["2024-12",null,false],["2025-01",218,true],["2025-02",177,true],["2025-03",472,true],["2025-04",579,true],["2025-05",446,true],["2025-06",972,true],["2025-07",1399,true],["2025-08",1161,true],["2025-09",1174,true],["2025-10",1041,true],["2025-11",753,true],["2025-12",750,true],["2026-01",389,true],["2026-02",478,true],["2026-03",747,true],["2026-04",285,true],["2026-05",282,true],["2026-06",256,true],["2026-07",117,true],["2026-08",177,true],["2026-09",392,false],["2026-10",339,false]],"growth":0.27}]},"creatives":[],"photo":"media/766ef63a4d9c956b.jpg","lead":"<p><strong>Verdict: #2 of 20.</strong> The shelf belongs to old drugstore brands, and demand is steady rather than growing. But one newcomer, <strong>GODA</strong>, went from zero to the top of the shelf in about 18 months: level with Palmer's as the #1 by revenue on Amazon, a large Meta presence run through creators, and 23,956 reviews on its own store. It is the clearest single proof among our 20 categories that a new brand can take a mature shelf. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span> (see below)</p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A body oil sold not for softness but against <strong>crepey skin</strong>: thin, wrinkled skin on arms, legs and chest that comes with age. GODA's listing reads \"Silk Body Oil Women - Firming Anti Aging\". The buyer is a woman 45+ who already uses a moisturizer and wants something that \"firms\". <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (listing titles)</p><p>Price: $19.47 median on Amazon (half between $12.99 and $28.25); GODA sells at $31.49, OSEA at $52. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> At least <strong>196,800 purchases a month</strong> on the first five Amazon search pages, about <strong>$4.0 million a month</strong> at listing prices. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p><p><strong>Trend.</strong> Searches for \"crepey skin\" are flat: ×1.02 versus a year ago after correcting for the spring-2026 Google artifact. The yearly index has moved sideways for five years (50 → 58 → 43 → 58 → 69). This is a steady need, not a fad. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (one pull of three)</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p><span class=\"tier t1\" title=\"counted by a platform\">◆</span> (brand age from ASINs, ±1-2 months)</p><p>Leaders by revenue (floor units × listing price): <strong>GODA ~$0.63M/mo</strong>, Palmer's ~$0.61M, OSEA ~$0.56M, Neutrogena ~$0.47M. GODA sells 20,000 a month from two listings, entered Amazon about 18 months ago, rated 4.3. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> revenue and age.</p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>Hard, but proven. Three brands under 24 months sell 1,000+ a month; GODA is by far the largest. Unlike color foundation, there is almost no unbranded price war here (4,900 units): buyers choose brands. A newcomer has to look and feel like a brand from day one. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta Ad Library, US, active, exact phrase \"crepey skin\" (this phrase also catches cream ads): <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>A big ad market. 22 of 26 shops in our sample keep at least one ad 90+ days; the oldest are thehealthcarpenter.com (439 days) and try-turmskin.com (323 days, 19 ads in the sample). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p><strong>How GODA advertises.</strong> Only 140 active ads run from GODA's own Page, none older than 180 days. But <strong>24 of 30 ads</strong> that mention \"Goda Silk\" land on goda.co, and they come from creator pages (\"Over 40 &amp; Fabulous\", \"Natasha Knows Scents\"). GODA's ad engine is creators, not its own Page. Its oldest live ad (262 days) is a creator post: \"2 Drops That Will Change Your Life!\" <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>DRMTLGY, the other brand we counted: 1,200 active ads, 200 alive 90+ days, 36 alive 180+. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p><strong>GODA</strong>, the newcomer that broke through, shows it in its own store too: photo reviews in Aug-Oct 2026 are about five times the same months of 2025, and October 2026 is its best month in the sample. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> (photo reviews only, read from a 20% sample)</p><p><strong>DRMTLGY</strong>'s store-wide reviews fell to about a quarter of last year, but body oil is a small part of what it sells, so this says little about the category. <span class=\"tier t3\" title=\"disputed\">◇</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>Short emotional hooks from real-looking women 40+, often filmed by creators, promising visible change from a small amount (\"2 drops\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (<code>work/ads/longrunning_v2.json</code>)</p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Flat demand.</strong> Growth must come from taking share, not from a rising market. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Creator dependence.</strong> GODA's model needs a stream of creators; we see the ads, not the cost. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>The Meta phrase is wide</strong> (\"crepey skin\" includes creams), so category ad counts overstate the oil-only market. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Big old brands at low prices</strong> (Palmer's $13.99, Aveeno $9.58) cap what a newcomer can charge on Amazon. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p><strong>#2.</strong> Not falling (×1.02); new brands take 26,600 units/mo; many shops with 90+ day ads. It would drop if search fell below ×0.8 or if GODA's share proved to be a one-off (watch its review curve).</p>"},{"h":"Methods and sources","kind":"sources","html":"<ul><li>Amazon: <code>body oil for crepey skin</code>, ZIP 10001, pages 1-5 → <code>work/blind/graveyard_us/body_oil.json</code>.</li><li>Meta: <a href=\"https://www.facebook.com/ads/library/?active_status=active&amp;ad_type=all&amp;country=US&amp;q=%22crepey%20skin%22&amp;search_type=keyword_exact_phrase&amp;media_type=all\" target=\"_blank\" rel=\"noopener\">Ad Library, exact phrase \"crepey skin\"</a>; GODA ads by phrase \"Goda Silk\".</li><li>Trends: <a href=\"https://trends.google.com/trends/explore?date=today%205-y&amp;geo=US&amp;q=crepey%20skin\" target=\"_blank\" rel=\"noopener\">Google Trends, US, 5 years, \"crepey skin\"</a>.</li><li>Review rate benchmark: <a href=\"https://judge.me/blog/benchmarking-review-collection-rate\" target=\"_blank\" rel=\"noopener\">Judge.me</a>.</li></ul>"}],"m":{"A1":1.03,"A1_terms":"crepey skin","A1_pulls":3,"A1_zero_share":0,"A2":51500,"A2_source":"automated scan","flags":[],"B1":0.07,"B1_n":43,"B2_1k":3,"B2_300":8,"B3_hhi":2366,"B3_top3":0.8,"D1_unbranded_1k":1,"B4_shops":[{"domain":"drmtlgy.com","active":1200,"aged90":300},{"domain":"goda.co","active":4400,"aged90":580}],"B6":null,"B6_none":"GODA: reviews since Dec 2023, founding year not found","D2":"stable","D2_note":"flat; GODA $47 to $33-35 in Jan, flat since","B1_lo":0.024,"B1_hi":0.186,"B1_grp":"middle"},"kill":"","note":"phrase 'crepey skin' also covers creams"},{"pid":"persimmon_soap","slug":"persimmon-soap","rank":8,"status":"reserve","title":"Persimmon soap","short":"Persimmon soap","verdict":"The fastest-growing search on the list and lively Meta testing, but a small, cheap market where one older brand holds a third and new brands so far take little.","channel":"own store + Meta","compliance":"","price":12.99,"p25p75":[9.99,17.99],"shelf":69550,"nb":7350,"gen":25450,"winB":3,"winG":5,"stores":10,"stores90":7,"meta":{"phrase":"persimmon soap","active":2700,"aged30":830,"aged90":130,"aged180":11,"date":"2026-11-07"},"kind":{"generic_old":11300,"generic_new":25450,"old_brand":25450,"new_brand":7350},"age":{"24+":36750,"6-12":18700,"12-24":3600,"0-6":10500},"leaders":[{"name":"Mirai","units":25300,"listings":6,"status":"old","months":70,"price":19.95,"stars":"4.3","asin":"B0DP37D91R","title":"Mirai Clinical Persimmon Soa ",304,false],["2026-07",280,false],["2026-08",338,false],["2026-09",341,false],["2026-10",268,false]],"growth":2.01}]},"creatives":[{"img":"media/86e92b9bd2ce9753.jpg","days":517,"start":"2025-06-09","page":"Mirai Clinical","domain":"miraiclinical.com","head":"Say Goodbye to ‘Old People Smell’ for Good","body":"Did you know that during menopause, your skin starts producing a compound called Nonenal, and normal soap can’t wash it away? 😳 That subtle \"old people smell\" isn’t about hygiene… ","video":true,"lib":"https://www.facebook.com/ads/library/?id=737280825391743"},{"img":"media/4dfa6e2922de0cfe.jpg","days":321,"start":"2025-12-22","page":"Mirai Clinical","domain":"miraiclinical.com","head":"Buy 3, Get 2 Free 🤩","body":"Did you know that during menopause, your skin starts producing a compound called Nonenal, and normal soap can’t wash it away? 😳 That subtle \"old people smell\" isn’t about hygiene… ","video":false,"lib":"https://www.facebook.com/ads/library/?id=1589878905502289"},{"img":"media/78c4bc932f710b9a.jpg","days":233,"start":"2026-03-20","page":"Grandma's Care Journal","domain":"try-kaori.com","head":"","body":"I've taught over 600 children how to read. I still remember most of their names. Then one September, they replaced me with a teacher half my age. Everyone knew the reason except me","video":false,"lib":"https://www.facebook.com/ads/library/?id=2330372864056320"},{"img":"media/042a2297c820e30e.jpg","days":233,"start":"2026-03-20","page":"Grandma's Care Journal","domain":"try-kaori.com","head":"","body":"My grandson was at my house every afternoon. He was everything to me. Then one day he was gone. His name is Jack. His mom dropped him off on her way to work and I'd hear the backpa","video":false,"lib":"https://www.facebook.com/ads/library/?id=949368220884779"},{"img":"media/02219d70cd27e1e4.jpg","days":219,"start":"2026-04-03","page":"Grandma's Glow","domain":"try-kaori.com","head":"","body":"My grandson shoved me out of his life after a year of college. He was everything to me. I didn't know why until it was almost too late. I changed that boy's diapers. I taught him h","video":false,"lib":"https://www.facebook.com/ads/library/?id=1159318819556156"},{"img":"media/6c980417884c3884.jpg","days":185,"start":"2026-05-07","page":"Mirai Clinical","domain":"miraiclinical.com","head":"","body":"How are you finding your Japanese Persimmon Soap? Smelling fresher? 🧼 Get 15% off our Persimmon Soap Trio set and discover our other scents! Discover your favorite scent and smell ","video":false,"lib":"https://www.facebook.com/ads/library/?id=1507196367435098"}],"photo":"media/827e0fbeb390bb49.jpg","lead":"<p><strong>Verdict: #5 of 20, with reservations.</strong> Search interest is up ×4.6 in a year, the strongest growth after color foundation, and new brands are testing hard on Meta. But the market is small ($1.2M a month on five Amazon pages), cheap ($13 median), and so far the growth mostly feeds one older brand, Mirai Clinical, and unbranded sellers. It stays in the top 5 because of the trend; it is the most fragile of the five. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A Japanese-style soap bar with persimmon tannin, sold against <strong>\"old people smell\"</strong> (nonenal body odor that comes with age). Listings say it openly: \"Persimmon Soap for Old People Smell\", \"Body Odor Control\". Buyers: people 50+, and their adult children buying for them. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (listing titles)</p><p>Price: $12.99 median (half between $9.99 and $17.99); Mirai Clinical $19.95, Kakiyu $29.99 (2-pack). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> At least <strong>69,550 purchases a month</strong> on five Amazon pages, about <strong>$1.2 million a month</strong>: the smallest market in our top 5. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p><p><strong>Trend.</strong> ×4.6 versus a year ago (control-corrected). Yearly index 0.2 → 0.7 → 1.8 → 6.4 → 45.3. Unlike most terms, it has its own peak in October 2026, separate from the spring Google artifact, so the growth is real. Note: 13% of the last two years' weeks are zero (low volume), so single pulls are noisy. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (one pull of three)</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p><strong>Mirai Clinical</strong> alone: 25,300 units/mo, ~70 months on Amazon, $19.95, ~$0.63M/mo. Unbranded sellers (yoniagood 10,000/mo at $9.99, NXPPYY 8,000 at $7.99) take ~$0.48M. The new brands are tiny on Amazon: Kaori 1,950/mo, Kakiyu 1,300, Morovan 1,100. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> revenue and ages.</p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>On Amazon, barely so far: three young brands just above 1,000/mo, while cheap multi-packs set the price. The real question is whether the new brands' Meta-driven stores are working (section 5). <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta, US, active, exact phrase \"persimmon soap\": <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>Many fresh tests, few survivors: only 5% of active ads are 90+ days old, the lowest of our top 5. Ads die fast here. 7 of 10 shops in the sample have a 90+ day ad: miraiclinical.com (492 days), the persona page \"Grandma's Glow\" (206), try-kaori.com (173). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>On each brand's own Page: Kaori 198 active / 48 at 90+ / 4 at 180+; Mirai Clinical 96 / 19 / 17; <strong>Kakiyu 470 / 0 / 0</strong>: a 2-month-old brand testing hard. Kaori and Kakiyu also run ads through persona pages (\"Grandma's Care Journal\", \"Mari Tanaka\"). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p><strong>Mirai Clinical</strong>, the store leader: 947 reviews in Aug-Oct 2026 vs 471 a year earlier, ×2.0, climbing steadily since early 2025. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> Kaori, the other leader, has no review widget we can read. The store curve agrees with the search growth. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>Mirai's 517-day ad: \"Say Goodbye to 'Old People Smell' for Good\". Kaori's ads run from grandmother persona pages. The angle is shame and family, aimed at the user's children as much as at the user. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> ads, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> reading.</p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Small pie, low price</strong>: a $13 soap needs many orders to pay for ads. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Ads die fast</strong> (5% at 90+ days): many testers, few profitable. <span class=\"tier t1\" title=\"counted by a platform\">◆</span>/<span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Noisy trend</strong> (low search volume). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Sensitive topic</strong> (age, smell): ad review and tone risk. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p><strong>#5.</strong> Growing (×4.6); kill rule (b) passes on it","body":"Get your first 100ml Scent FREE for a limited time only with the purchase of a Plug-in Diffuser V2 ($30 Value) Give your home the sense of scent with our all new Scent Diffuser — ✨","video":true,"lib":"https://www.facebook.com/ads/library/?id=993553792570970"},{"img":"media/f31abc2aa1b2b018.jpg","days":275,"start":"2026-02-06","page":"Scentify","domain":"scentifyhome.com","head":"","body":"✨ The self-care upgrade your home's been waiting for. Get 40% off and a FREE premium 100ml scent ($30 value) with the Scentify Plug-in Diffuser. Whisper-quiet technology, sleek des","video":false,"lib":"https://www.facebook.com/ads/library/?id=918626757778906"},{"img":"media/38c7d0df174ff7bd.jpg","days":201,"start":"2026-04-21","page":"Aura House","domain":"aurahouse.com","head":"\"Best scent diffuser?\"","body":"Why I'm Obsessed With This Scent Diffuser Brand: ✨ Elevated, Aesthetic Design 🏠 Clean Home Fragrances 💖 Scents Inspired By Luxury Hotels 💚 Sephora-Clean","video":false,"lib":"https://www.facebook.com/ads/library/?id=1940043790214452"},{"img":"media/e68f801d93d7280c.jpg","days":201,"start":"2026-04-21","page":"Aura House","domain":"aurahouse.com","head":"","body":"Why I'm Obsessed With This Scent Diffuser Brand: ✨ Elevated, Aesthetic Design 🏠 Clean Home Fragrances 💖 Scents Inspired By Luxury Hotels 💚 Sephora-Clean \"Best scent diffuser?\" 30 d","video":false,"lib":"https://www.facebook.com/ads/library/?id=1448928159721186"}],"photo":"media/1074a347e83c41d6.jpg","lead":"<p><strong>Verdict: #3 of 20.</strong> The most expensive product on our list ($64 median), with search interest doubling in a year. On Amazon it is split between a few brands and many unbranded sellers; on Meta a handful of home-fragrance brands keep the same ads running for months and years. The opportunity is a brand with its own store, not another Amazon listing. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>","sections":[{"h":"The product and the buyer","kind":"text","html":"<p>A plug-in or cordless device that turns fragrance oil into a dry cold-air mist, no water. Sold as \"hotel scent at home\": Hotel Collection, Aroma360 and Scentify all sell the device plus refill oils. The buyer is a homeowner who wants the house to smell like a hotel lobby, and keeps buying oils. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> product form (listings); <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> the device-plus-refills model of Hotel Collection, Aroma360 and Scentify (their stores and ads)</p><p>Price: $64.49 median on Amazon, half between $39.99 and $89.99; AirScent's leading listing is $99.99. The refills make it a repeat purchase. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> repeat.</p>"},{"h":"How big, and where it is going","kind":"trend","html":"<p><strong>Size.</strong> At least <strong>58,000 purchases a month</strong> on five Amazon pages, about <strong>$4.1 million a month</strong>, because of the high price. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> count, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> money.</p><p><strong>Trend.</strong> Searches for \"waterless diffuser\" are <strong>×2.0</strong> versus a year ago (control-corrected); yearly index 0.8 → 2.4 → 5.6 → 9.1 → 34.5. Steady growth for four years, not a single spike. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> (one pull of three)</p>"},{"h":"Who holds the market","kind":"shelf","html":"<p>Leaders: Airversa (34 months, 11,400/mo, $39.99), <strong>AirScent</strong> (~23 months, 11,100/mo, $99.99, ~$1.1M/mo), ANZ/ScentBots (~13 months, 3,700/mo at $19.98), FEPPO (~9 months, 1,100/mo at $65.99). Unbranded sellers take ~$1.8M/mo together. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> units/price, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> ages and revenue.</p>"},{"h":"Can a newcomer get in","kind":"entry","html":"<p>On Amazon: four brands under 24 months sell 1,000+ a month, but the unbranded half (NoxLumina at $89.99 with 4,000/mo, many at $20-80) pushes prices down. A newcomer on Amazon competes on price. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p><p>Off Amazon the picture is different (section 5): the brands that matter in this category are store brands that barely sell on Amazon. AirScent, the Amazon leader, runs only <strong>4</strong> Meta ads. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p>"},{"h":"What happens in ads","kind":"ads","html":"<p>Meta, US, active, exact phrase \"scent diffuser\": <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>A small ad market by count, but with a high share of long-lived ads: when an ad works here, it keeps running. 11 of 13 shops in the sample have an ad 90+ days old; <strong>scentifyhome.com's oldest live ad is 795 days old</strong> (over two years). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><p>On each brand's own Page: <span class=\"tier t1\" title=\"counted by a platform\">◆</span></p><div class=tbl><table><thead><tr><th>Brand</th><th>Active</th><th>90+ days</th><th>180+ days</th></tr></thead><tbody><tr><td>Hotel Collection</td><td>563</td><td>158</td><td>5</td></tr><tr><td>Aroma360</td><td>370</td><td>77</td><td>0</td></tr><tr><td>Scentify</td><td>320</td><td>100</td><td>89</td></tr><tr><td>Aura House</td><td>212</td><td>22</td><td>3</td></tr><tr><td>AirScent</td><td>4</td><td>0</td><td>0</td></tr></tbody></table></div>"},{"h":"Do the winners keep growing","kind":"reviews","html":"<p>Three stores, all up. <strong>Scentify</strong>: 245 reviews in Aug-Oct 2026 vs 123 a year earlier, ×2.0; October 2026 is its best month on record. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> <strong>Aura House</strong>: ×2.7 store-wide; the diffuser itself went from 26 reviews in Oct 2025 to 139 in Oct 2026. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> Its Aug-Sep 2026 show only about 20 a month, which looks like paused review requests. <span class=\"tier t3\" title=\"disputed\">◇</span> <strong>Aroma360</strong>: ×1.4, but October is lifted by a free-diffuser promotion; August-September alone were below last year. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p><p>Together with search (×2.0), this is the best-confirmed growth of all 20 categories. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></p>"},{"h":"What the winners say","kind":"creatives","html":"<p>Scentify's ads that have run for 796-899 days sell the device with a free scent (\"Get a FREE Scent with Your V2 Diffuser\"). Aura House's 201-day ad: \"Best scent diffuser? · 30 days supply left.\" The offer is the device plus the first oil; the business is the refills. <span class=\"tier t1\" title=\"counted by a platform\">◆</span> ads, <span class=\"tier t2\" title=\"estimate or our reading\">◈</span> business model.</p>"},{"h":"Risks and open questions","kind":"text","html":"<ul><li><strong>Amazon price war</strong>: unbranded devices at $20-90. <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li><li><strong>Heavy, fragile, electronic</strong>: returns and warranty cost more than for a cream. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>The brand wins on scent, not on hardware</strong>: the oils are the product to develop. <span class=\"tier t2\" title=\"estimate or our reading\">◈</span></li><li><strong>Note:</strong> v2.0 counted AirScent as unbranded (titles start with \"The\"); fixed in v2.1, new-brand units rose from 8,300 to 19,400 (ID scan). <span class=\"tier t1\" title=\"counted by a platform\">◆</span></li></ul>"},{"h":"Verdict and what would change it","kind":"text","html":"<p><strong>#3.</strong> Growing (×2.0), new brands take 21,20
