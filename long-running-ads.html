, "dashboard/ads_media/620fa4e505b98c51.jpg"], "productTitle": "Original Persimmon Soap", "productUrl": "https://try-kaori.com/products/deodorizing-persimmon-soap", "ads": [{"id": "2330372864056320", "start": "20 Mar 2026", "multi": null, "page": "Grandma's Care Journal", "video": false, "carousel": false, "land": "https://try-kaori.com/pages/7-reasons-why", "headline": "", "cta": "", "body": "I've taught over 600 children how to read. I still remember most of their names. Then one September, they replaced me with a teacher half my age. Everyone knew the reason except me.\nMy name is Linda. I'm 63. Room 14, same elementary school in Michigan for 26 years.\nI'm the teacher who gets there at 7 and leaves last. The one who stands at the door every morning and says every kid's name. After 26 years you read a room of eight-year-olds the way other people read the weather. You don't miss anything.\nTeaching is my passion. I just want to help kids learn. That's all it's ever been.\nFridays I bring muffins to the staff room. The plate is always empty by 9:30. One of my former students still sends me a card every Christmas: You made me love books.\nSure, I'm 63. The younger teachers make jokes sometimes. I've always had a good comeback. People respect you when you've been somewhere this long.\nThat was my life. Full. Good. Mine.\nThen sometime around October, the energy shifted.\nThe kids got quieter when I walked between the rows. Not all of them. But enough for me to notice.\nAnd I notice everything.\nThe staff room changed too. Maria stopped saving me a seat at lunch. A new teacher started that fall. 28 years old. Within a month she was part of every lunch, every coffee run, every inside joke.\nI'd been there 26 years and I was the one on the outside.\nI overheard our assistant principal giving a tour to parents. \"We're bringing in a lot of fresh energy this year.\" The way she said i", "startISO": "2026-03-20", "days": 232, "imgLocal": "dashboard/ads_media/78c4bc932f710b9a.jpg", "avatarLocal": "dashboard/ads_media/7a20726cd739bfa5.jpg", "brand": false}, {"id": "949368220884779", "start": "20 Mar 2026", "multi": null, "page": "Grandma's Care Journal", "video": false, "carousel": false, "land": "https://try-kaori.com/pages/7-reasons-why", "headline": "", "cta": "", "body": "My grandson was at my house every afternoon. He was everything to me. Then one day he was gone.\nHis name is Jack. His mom dropped him off on her way to work and I'd hear the backpack hit the floor before I even saw him. Shoes kicked off in the corner. Socks across the tiles. Every single day since first grade.\nI'd usually have something in the oven. Banana bread, oatmeal cookies, sometimes just biscuits if I'd been busy at the farmers market that morning. I go every Tuesday and Saturday — have for years. I pick my own tomatoes. I talk to the woman who sells the honey. I carry my own bags home. I'm seventy-one and I do everything myself.\nI'm not some frail old woman sitting in a chair waiting for company. I have a full life.\nBut Jack was the best part of it.\nHe had his spot on the couch. Left side, always. His mug in the cabinet — the blue one with the chipped handle he wouldn't let me throw away. His hook by the door, the low one I screwed in at his height when he was six. He'd do homework at the kitchen table with the cocoa steaming next to his pencil case, and then cartoons or Lincoln Logs until his mom came around six.\nFour years of flour on his nose from \"helping\" me bake. Four years of him falling asleep on the couch on Fridays while I just sat there reading. Perfectly happy.\nI don't know exactly when it changed. There wasn't one day where I thought okay, something is wrong. It just crept in so slowly I didn't see it until it was already done.\nJack was ten. And he starte", "startISO": "2026-03-20", "days": 232, "imgLocal": "dashboard/ads_media/042a2297c820e30e.jpg", "avatarLocal": "dashboard/ads_media/7a20726cd739bfa5.jpg", "brand": false}, {"id": " y", "headline": "", "cta": "", "body": "My grandson was at my house every afternoon. He was everything to me. Then one day he was gone.\nHis name is Jack. His mom dropped him off on her way to work and I'd hear the backpack hit the floor before I even saw him. Shoes kicked off in the corner. Socks across the tiles. Every single day since first grade.\nI'd usually have something in the oven. Banana bread, oatmeal cookies, sometimes just biscuits if I'd been busy at the farmers market that morning. I go every Tuesday and Saturday — have for years. I pick my own tomatoes. I talk to the woman who sells the honey. I carry my own bags home. I'm seventy-one and I do everything myself.\nI'm not some frail old woman sitting in a chair waiting for company. I have a full life.\nBut Jack was the best part of it.\nHe had his spot on the couch. Left side, always. His mug in the cabinet — the blue one with the chipped handle he wouldn't let me throw away. His hook by the door, the low one I screwed in at his height when he was six. He'd do homework at the kitchen table with the cocoa steaming next to his pencil case, and then cartoons or Lincoln Logs until his mom came around six.\nFour years of flour on his nose from \"helping\" me bake. Four years of him falling asleep on the couch on Fridays while I just sat there reading. Perfectly happy.\nI don't know exactly when it changed. There wasn't one day where I thought okay, something is wrong. It just crept in so slowly I didn't see it until it was already done.\nJack was ten. And he starte", "startISO": "2026-03-21", "days": 231, "imgLocal": "dashboard/ads_media/71032567ea8e0135.jpg", "avatarLocal": "dashboard/ads_media/7a20726cd739bfa5.jpg", "brand": false}, {"id": "1159318819556156", "start": "3 Apr 2026", "multi": null, "page": "Grandma's Glow", "video": false, "carousel": false, "land": "https://try-kaori.com/pages/7-reasons-why", "headline": "", "cta": "", "body": "My grandson shoved me out of his life after a year of college. He was everything to me. I didn't know why until it was almost too late.\nI changed that boy's diapers. I taught him how to hold a fishing rod down at the creek when he was so small the rod was taller than him.\nEvery Friday night for years he'd sleep over at my house. Board games until he fell asleep on the couch.\nI'd carry him to bed and he'd wrap his little arms around my neck so tight I could barely breathe.\nHe never wanted to let go.\nWhen Harold passed two years ago, my grandson drove over and sat with me on the porch for three hours. Didn't say a word. Just sat there while I cried.\nThat's my boy.\nHe's twenty now. But he's still my baby.\nSo when he went off to college I told myself: eleven months. He'll be home. We'll sit on that porch again and it'll be like nothing changed.\nI had his favorite dinner ready the day he came home. Pot roast. Carrots the way he likes. Potatoes crispy on the edges.\nSet the table for two. Put out the good plates.\nPicked him up at the airport. Stood at that gate like it was Christmas morning. Opened my arms because that's what you do when your whole heart is walking toward you.\nHe hugged me. But it was quick. One arm. Head turned. And he pulled back before I was ready to let go.\nI told myself it was the airport. Boys that age don't do big hugs with their grandma in public. That's what I told myself.\nThe car ride home was quiet. I kept talking. The pot roast, the neighbors, church. He", "startISO": "2026-04-03", "days": 218, "imgLocal": "dashboard/ads_media/02219d70cd27e1e4.jpg", "avatarLocal": "dashboard/ads_media/af6c0100cf5cc44f.jpg", "brand": false}, {"id": "26036475366023775", "start": "3 Apr 2026", "multi": null, "page": "Grandma's Glow", "video": false, "carousel": false, "land": "https://try-kaori.com/pages/7-reasons-why", "headline": "", "cta": "", "body": "My husband told me I smell like a nursing home. No amount of showering fixed it, until a nurse finally told me why.\nHe said it one evening in bed. Very carefully. Like he'd been sitting on it for weeks.\nAnd my husband is not a man who notices smells. So if he can smell it, everyone can. My daughter. The woman next to me at church. My granddaughter when she hugs me.\nIf I'm honest, I'd noticed something too. A stale, greasy smell on my pillow every morning. But I'm 64. Your nose gets funny as you get older. You pick up things that aren't there. I told myself I was imagining it.\nI wasn't imagining it.\nI know older people carry a certain smell. I remember it from my own mother. Her house had it. Her armchair. Her wool coat. I loved her but I remember thinking, why doesn't she just wash more?\nNow I'm the one with the smell.\nSo I did the only thing that made sense. The only thing that had ever worked my whole life.\nI showered more.\nMore expensive body wash. Exfoliating gloves. Three different deodorants in two months. Some mornings I scrubbed for 30 minutes.\nThe smell was on my pillow the next morning. Every time.\nThat scared me. Because I'd never had a problem a good shower couldn't fix.\nThen my granddaughter said it.\nShe's 7. She told my daughter that Nanny stinks. No filter. Just the truth that nobody else had the guts to say to my face except my husband.\nI started showering right before she came over. 20 minutes before. Fresh clothes from the dryer. Perfume.\nShe still scrunched", "startISO": "2026-04-03", "days": 218, "imgLocal": "dashboard/ads_media/3e90742f9946453e.jpg", "avatarLocal": "dashboard/ads_media/af6c0100cf5cc44f.jpg", "brand": false}, {"id": "1486709756421429", "start": "9 Apr 2026", "multi": null, "page": "Grandma's Glow", "video": false, "carousel": false, "land": "https://try-kaori.com/products/deodorizing-persimmon-soap", "headline": "", "cta": "", "body": "I got fired after 26 years behind a luxury beauty counter. Not for being late or for poor performance.\nBut for telling customers about a soap that actually solved what their $200 perfumes were trying to hide.\nThe store called it \"unprofessional.\" I call it the truth.\nLet me start from the beginning.\nI was 36 when I got the job. Young. Excited. I thought I'd won the lottery. A beauty counter at one of the biggest department stores in the country. The kind of store you'd recognize by name.\nFor 26 years I stood behind that counter. I learned every product. Every ingredient. Every trick to make a woman feel beautiful when she walked out the door.\nI loved that job.\nBut at 62, something changed. Not at the store. In me.\nI started noticing something I couldn't explain. I showered twice a day. I used the best body wash we sold. Expensive lotion. Two different fragrances every morning. I smelled like a walking perfume ad.\nBut something was off.\nAnd I couldn't figure out what it was. Because here's the thing. I couldn't smell it on myself.\nBut other people could.\nMy daughter started hugging me different. Not less often. Just quicker. Like she was counting to two and letting go. I told myself she was busy. She has two kids. She's always rushing somewhere.\nBut one morning my coworker Vanessa moved her chair. Six inches to the left. Didn't say a word. Didn't look at me. Just moved it.\nThat one I couldn't explain away.\nThen Barbara came in.\nBarbara was a customer I'd helped for years. Mid-", "startISO": "2026-04-09", "days": 212, "imgLocal": "dashboard/ads_media/8d1e9d8c2999a855.jpg", "avatarLocal": "dashboard/ads_media/af6c0100cf5cc44f.jpg", "brand": false}, {"id": "930973682901016", "start": "15 Apr 2026", "multi": null, "page": "Grandma's Glow", "video": false, "carousel": false, "land": "https://try-kaori.com/products/deodorizing-persimmon-soap", "headline": "", "cta": "", "body": "My ex-husband told me I was the most beautiful woman at our grandson's graduation.\nHis new wife was standing three feet away.\nAnd honestly. She started it.\nIt started about six weeks ago.\nMy grandson Leo was graduating. Big fancy school out East. Black tie dinner. Donors. The whole thing.\nTiffany is David's new wife. About fifteen years younger than me. She used to be a model and she makes sure you know it. She added me to a group on Facebook Messenger. Called it \"Graduation Weekend.\"\nShe typed out this long message. Where to go. What to wear. How hot it was going to be. Then she wrote a list. She called it \"freshness tips for the family.\"\nAnd at the bottom she added something that almost sounded nice.\n\"I know the humidity can be hard on all of us as we get older. I'm packing extra myself just in case. It's nothing to be embarrassed about.\"\nThen she wrote a second message. To me. In the group. Where David and everyone could see it.\n\"Karen darling, please pay attention to number four. We really can't have you showing up to the Welcome Dinner looking wilted. It puts pressure on Leo.\"\nAnd then:\n\"If you don't have a good way to stay fresh on a long trip, let me know. I can send you something. I just want the photos to come out nice.\"\nI stared at my phone.\nNumber four on her list said \"rinse hair with vinegar to fight travel odor.\"\nI am sixty-six years old. I have taken a shower every single morning of my life. I have never smelled bad. Not once.\nI thought she was just being mean.", "startISO": "2026-04-15", "days": 206, "imgLocal": "dashboard/ads_media/503aa97e7ce5e7b3.jpg", "avatarLocal": "dashboard/ads_media/af6c0100cf5cc44f.jpg", "brand": false}, {"id": "2389156421581461", "start": "15 Apr 2026", "multi": null, "page": "Grandma's Glow", "video": false, "carousel": false, "land": "https://try-kaori.com/products/deodorizing-persimmon-soap", "headline": "Deodorizing Persimmon Soap · Kaori", "cta": "Learn more", "body": "My ex-husband told me I was the most beautiful woman at our grandson's graduation.\nHis new wife was standing three feet away.\nAnd honestly. She started it.\nIt started about six weeks ago.\nMy grandson Leo was graduating. Big fancy school out East. Black tie dinner. Donors. The whole thing.\nTiffany is David's new wife. About fiftee const $ = s => document.querySelector(s);
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const name = id => (PRODUCTS.find(p=>p.id===id)||{}).name || id;
const hero = b => b.photos[(PRODUCTS.find(p=>p.id===b.id)||{}).heroIdx||0] || b.photos[0] || '';
let cur = location.hash.slice(1) || ADS.brands[0].id;
if(!ADS.brands.some(b=>b.id===cur)) cur = ADS.brands[0].id;
const fmtDays = d => d>=365 ? (d/365).toFixed(1).replace('.0','')+' yr' : Math.round(d/30.4)+' mo';
const ageCls = d => d>=365?'a3':d>=180?'a2':'a1';
const isBrand = a => a.brand;

$('#sub').textContent = `US · active · from Meta Ad Library, pulled ${ADS.generated}`;
$('#brands').innerHTML = ADS.brands.map(b=>`<button class="brand" data-id="${b.id}"><img src="${esc(hero(b))}" alt=""><span><b>${esc(name(b.id))}</b> <small>${b.total??b.loaded} ads ${b.minDays}+ d</small></span></button>`).join('');
$('#brands').querySelectorAll('.brand').forEach(el=>el.onclick=()=>{cur=el.dataset.id; history.replaceState(null,'','#'+cur); draw();});
['sort','fmt','who'].forEach(id=>$('#'+id).onchange=draw);

function card(a,b){
  const lib = 'https://www.facebook.com/ads/library/?id='+a.id;
  const tags = [];
  if(a.multi) tags.push(`<span class="tag hot" title="Meta groups identical copies: the advertiser runs this creative several times">×${a.multi} copies</span>`);
  tags.push(`<span class="tag">${a.video?'Video':a.carousel?'Carousel':'Image'}</span>`);
  if(!isBrand(a,b)) tags.push(`<span class="tag" title="Ad runs from a creator or persona page, not the brand page">Creator / persona page</span>`);
  return `<article class="ad">
    <div class="meta"><div class="st"><i></i>Active<span class="age ${ageCls(a.days)}" title="Running for ${a.days} days">${fmtDays(a.days)} · ${a.days} d</span></div>
      Started running on ${esc(a.start)}<div class="tags">${tags.join('')}</div></div>

    <div class="body" title="Click to expand">${esc(a.body)}</div>
    <a class="media" href="${lib}" target="_blank" rel="noopener">${a.imgLocal?`<img src="${esc(a.imgLocal)}" alt="">`:''}${a.video?'<div class="play"><span></span></div>':''}</a>
    <a class="link" href="${esc(a.land||lib)}" target="_blank" rel="noopener"><div class="t"><div class="d">${esc((a.land.match(/\/\/(?:www\.)?([^/]+)/)||[])[1]||b.domain)}</div><div class="h">${esc(a.headline||a.land.replace(/^https?:\/\/[^/]+/,'')||'')}</div></div>${a.cta?`<span class="cta">${esc(a.cta)}</span>`:''}</a>
    <div class="foot"><a href="${lib}" target="_blank" rel="noopener">Open in Ad Library ↗</a><span class="id">ID ${a.id}</span></div>
  </article>`;
}

function draw(){
  document.querySelectorAll('.brand').forEach(el=>el.setAttribute('aria-pressed', el.dataset.id===cur));
  const b = ADS.brands.find(x=>x.id===cur);
  $('#head').innerHTML = `<div class="head"><img src="${esc(hero(b))}" alt=""><div><h2>${esc(name(b.id))} — ${esc(b.productTitle)}</h2>
    <p><b>${b.total??'?'}</b> active US ads started ${b.minDays}+ days ago (Meta count); <b>${b.loaded}</b> shown. ${b.minDays<180?'This brand rotates creatives fast: no ads live 180+ days, so the bar is lowered to '+b.minDays+'.':''}</p>
    <p><a class="u" href="${esc(b.productUrl)}" target="_blank" rel="noopener">${esc(b.domain)} product page ↗</a> · <a class="u" href="https://www.facebook.com/ads/library/?active_status=active&ad_type=all&country=US&q=${encodeURIComponent(b.domain)}&search_type=keyword_unordered" target="_blank" rel="noopener">all their ads in Ad Library ↗</a></p></div></div>`;
  let list = b.ads.slice();
  const f=$('#fmt').value, w=$('#who').value, s=$('#sort').value;
  if(f!=='all') list = list.filter(a=>f==='video'?a.video:!a.video);
  if(w!=='all') list = list.filter(a=>w==='brand'?isBrand(a,b):!isBrand(a,b));
  if(s==='old') list.sort((x,y)=>y.days-x.days); else if(s==='new') list.sort((x,y)=>x.days-y.days);
  $('#grid').innerHTML = list.length ? list.map(a=>card(a,b)).join('') : '<div class="empty">No ads match these filters.</div>';
  $('#grid').querySelectorAll('.body').forEach(el=>el.onclick=()=>el.classList.toggle('open'));
}
const tb=$('#theme');
function setTheme(t){document.documentElement.dataset.theme=t; tb.textContent=t==='dark'?'Light':'Dark';}
setTheme(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
tb.onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
draw();
addEventListener('hashchange',()=>{const h=location.hash.slice(1); if(ADS.brands.some(b=>b.id===h)){cur=h; draw();}});
</script>
